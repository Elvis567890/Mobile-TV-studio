name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.24.0, channel: stable, cache: true }

      - name: Write pubspec
        run: |
          cat > pubspec.yaml << 'P'
          name: mobile_tv_studio
          publish_to: 'none'
          version: 0.1.0+1
          environment: { sdk: '>=3.4.0 <4.0.0' }
          dependencies:
            flutter: { sdk: flutter }
            shared_preferences: ^2.3.2
            provider: ^6.1.2
            uuid: ^4.5.0
            path_provider: ^2.1.4
            file_picker: ^8.1.2
            video_player: ^2.9.1
            camera: ^0.11.0+2
            flutter_webrtc: ^0.11.7
            web_socket_channel: ^3.0.1
          dev_dependencies:
            flutter_test: { sdk: flutter }
          flutter: { uses-material-design: true }
          P
          rm -f pubspec.lock

      - name: Write lib files
        run: |
          rm -rf lib test
          mkdir -p lib/screens lib/widgets lib/models lib/data lib/services

          cat > lib/main.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/role_chooser.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const App());
          }
          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false, title: 'Mobile TV Studio',
              theme: ThemeData(useMaterial3: true, brightness: Brightness.dark,
                scaffoldBackgroundColor: const Color(0xFF0A0A0A),
                colorScheme: const ColorScheme.dark(primary: Color(0xFF3B82F6), surface: Color(0xFF141414))),
              home: const RoleChooser());
          }
          D

          cat > lib/services/config.dart << 'D'
          class AppConfig {
            // Replace this AFTER you deploy the relay to Render.
            static const String signalingUrl = 'wss://mobile-tv-relay.onrender.com';
            static const String roomId = 'studio1';
          }
          D

          cat > lib/services/signaling.dart << 'D'
          import 'dart:async';
          import 'dart:convert';
          import 'package:web_socket_channel/web_socket_channel.dart';
          enum SignalType { offer, answer, candidate, join, leave }
          class SignalMessage {
            final SignalType type;
            final String room;
            final String from;
            final String sdp;
            final String mid;
            final int mline;
            SignalMessage({required this.type, required this.room, required this.from, this.sdp = '', this.mid = '', this.mline = 0});
            Map<String, dynamic> toJson() => {'type': type.name, 'room': room, 'from': from, 'sdp': sdp, 'mid': mid, 'mline': mline};
            factory SignalMessage.fromJson(Map<String, dynamic> j) => SignalMessage(
              type: SignalType.values.firstWhere((t) => t.name == j['type'], orElse: () => SignalType.candidate),
              room: j['room'] ?? '', from: j['from'] ?? '', sdp: j['sdp'] ?? '', mid: j['mid'] ?? '', mline: j['mline'] ?? 0);
          }
          class SignalingClient {
            final String serverUrl;
            final String roomId;
            final String clientId;
            SignalingClient({required this.serverUrl, required this.roomId, required this.clientId});
            WebSocketChannel? _channel;
            final _controller = StreamController<SignalMessage>.broadcast();
            Stream<SignalMessage> get messages => _controller.stream;
            Future<bool> connect() async {
              try {
                _channel = WebSocketChannel.connect(Uri.parse(serverUrl));
                await _channel!.ready;
                _channel!.stream.listen((raw) {
                  try { _controller.add(SignalMessage.fromJson(jsonDecode(raw as String))); } catch (_) {}
                }, onError: (_) {});
                send(SignalMessage(type: SignalType.join, room: roomId, from: clientId));
                return true;
              } catch (_) { return false; }
            }
            void send(SignalMessage m) { try { _channel?.sink.add(jsonEncode(m.toJson())); } catch (_) {} }
            Future<void> disconnect() async { send(SignalMessage(type: SignalType.leave, room: roomId, from: clientId)); await _channel?.sink.close(); await _controller.close(); }
          }
          D

          cat > lib/services/webrtc_session.dart << 'D'
          import 'dart:async';
          import 'package:flutter_webrtc/flutter_webrtc.dart';
          import 'signaling.dart';

          class WebRtcSession {
            final String serverUrl;
            final String roomId;
            final String clientId;
            final bool isCaller;

            WebRtcSession({required this.serverUrl, required this.roomId, required this.clientId, required this.isCaller});

            RTCPeerConnection? _pc;
            MediaStream? _localStream;
            SignalingClient? _signal;
            StreamSubscription<SignalMessage>? _sub;
            final _remote = RTCVideoRenderer();
            bool _rendererReady = false;

            RTCVideoRenderer get renderer => _remote;
            MediaStream? get localStream => _localStream;
            bool get ready => _rendererReady;

            Future<bool> start() async {
              try {
                if (!_rendererReady) { await _remote.initialize(); _rendererReady = true; }
                _pc = await createPeerConnection({
                  'iceServers': [
                    {'urls': 'stun:stun.l.google.com:19302'},
                    {'urls': 'stun:stun1.l.google.com:19302'},
                  ],
                  'sdpSemantics': 'unified-plan',
                });
                _pc!.onIceCandidate = (c) {
                  _signal?.send(SignalMessage(type: SignalType.candidate, room: roomId, from: clientId,
                    sdp: c.candidate ?? '', mid: c.sdpMid ?? '', mline: c.sdpMLineIndex ?? 0));
                };
                _pc!.onTrack = (e) {
                  if (e.streams.isNotEmpty) _remote.srcObject = e.streams[0];
                };
                _localStream = await navigator.mediaDevices.getUserMedia({
                  'audio': true,
                  'video': {'facingMode': 'environment', 'width': {'ideal': 854}, 'height': {'ideal': 480}},
                });
                for (final t in _localStream!.getTracks()) { await _pc!.addTrack(t, _localStream!); }
                _signal = SignalingClient(serverUrl: serverUrl, roomId: roomId, clientId: clientId);
                final ok = await _signal!.connect();
                if (!ok) return false;
                _sub = _signal!.messages.listen(_onSignal);
                if (isCaller) {
                  final offer = await _pc!.createOffer();
                  await _pc!.setLocalDescription(offer);
                  _signal!.send(SignalMessage(type: SignalType.offer, room: roomId, from: clientId, sdp: offer.sdp ?? ''));
                }
                return true;
              } catch (_) { return false; }
            }

            Future<void> _onSignal(SignalMessage m) async {
              if (m.from == clientId) return;
              if (m.type == SignalType.offer) {
                await _pc!.setRemoteDescription(RTCSessionDescription(m.sdp, 'offer'));
                final answer = await _pc!.createAnswer();
                await _pc!.setLocalDescription(answer);
                _signal!.send(SignalMessage(type: SignalType.answer, room: roomId, from: clientId, sdp: answer.sdp ?? ''));
              } else if (m.type == SignalType.answer) {
                await _pc!.setRemoteDescription(RTCSessionDescription(m.sdp, 'answer'));
              } else if (m.type == SignalType.candidate) {
                await _pc!.addCandidate(RTCIceCandidate(m.sdp, m.mid, m.mline));
              }
            }

            Future<void> stop() async {
              await _sub?.cancel();
              await _signal?.disconnect();
              for (final t in _localStream?.getTracks() ?? <MediaStreamTrack>[]) { await t.stop(); }
              await _localStream?.dispose();
              await _pc?.close(); await _pc?.dispose();
              _pc = null; _localStream = null;
            }
          }
          D

          cat > lib/models/overlay_item.dart << 'D'
          class OverlayItem {
            final String id;
            final String text;
            double x; double y; double size; int color;
            OverlayItem({required this.id, required this.text, required this.x, required this.y, this.size = 20, this.color = 0xFFFFFFFF});
            Map<String, dynamic> toJson() => {'id': id, 'text': text, 'x': x, 'y': y, 'size': size, 'color': color};
            factory OverlayItem.fromJson(Map<String, dynamic> j) => OverlayItem(id: j['id'], text: j['text'], x: (j['x'] as num).toDouble(), y: (j['y'] as num).toDouble(), size: (j['size'] as num).toDouble(), color: j['color']);
          }
          D

          cat > lib/data/overlay_store.dart << 'D'
          import 'dart:convert';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/overlay_item.dart';
          class OverlayStore {
            static const _k = 'overlays_v1';
            Future<List<OverlayItem>> loadAll() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString(_k);
              if (raw == null || raw.isEmpty) return [];
              try { return (jsonDecode(raw) as List).map((e) => OverlayItem.fromJson(e)).toList(); } catch (_) { return []; }
            }
            Future<void> saveAll(List<OverlayItem> items) async {
              final p = await SharedPreferences.getInstance();
              await p.setString(_k, jsonEncode(items.map((e) => e.toJson()).toList()));
            }
            Future<void> add(OverlayItem item) async { final a = await loadAll(); a.add(item); await saveAll(a); }
            Future<void> remove(String id) async { final a = await loadAll(); a.removeWhere((e) => e.id == id); await saveAll(a); }
          }
          D

          cat > lib/widgets/big_button.dart << 'D'
          import 'package:flutter/material.dart';
          class BigButton extends StatelessWidget {
            final IconData icon; final String label; final Color color; final VoidCallback onTap; final double size;
            const BigButton({super.key, required this.icon, required this.label, required this.onTap, this.color = const Color(0xFF3B82F6), this.size = 80});
            @override Widget build(BuildContext context) => InkWell(onTap: onTap, borderRadius: BorderRadius.circular(8),
              child: Container(width: size, height: size,
                decoration: BoxDecoration(color: color.withOpacity(0.12), border: Border.all(color: color, width: 1.5), borderRadius: BorderRadius.circular(8)),
                child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  Icon(icon, color: color, size: size * 0.32), const SizedBox(height: 4),
                  Text(label, textAlign: TextAlign.center, style: TextStyle(color: color, fontSize: 9, fontWeight: FontWeight.w900, letterSpacing: 1))])));
          }
          D

          cat > lib/widgets/status_badge.dart << 'D'
          import 'package:flutter/material.dart';
          class StatusBadge extends StatelessWidget {
            final String label; final Color color; final IconData icon;
            const StatusBadge({super.key, required this.label, required this.color, this.icon = Icons.circle});
            @override Widget build(BuildContext context) => Container(
              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
              decoration: BoxDecoration(color: color.withOpacity(0.15), border: Border.all(color: color.withOpacity(0.6)), borderRadius: BorderRadius.circular(20)),
              child: Row(mainAxisSize: MainAxisSize.min, children: [Icon(icon, size: 12, color: color), const SizedBox(width: 6),
                Text(label, style: TextStyle(color: color, fontSize: 10, fontWeight: FontWeight.w800, letterSpacing: 1.2))]));
          }
          D

          cat > lib/widgets/live_camera.dart << 'D'
          import 'package:camera/camera.dart';
          import 'package:flutter/material.dart';
          class LiveCamera extends StatefulWidget {
            final bool front;
            const LiveCamera({super.key, this.front = false});
            @override State<LiveCamera> createState() => _LC();
          }
          class _LC extends State<LiveCamera> with WidgetsBindingObserver {
            CameraController? _ctrl; bool _ready = false; String? _error;
            @override void initState() { super.initState(); WidgetsBinding.instance.addObserver(this); _init(); }
            Future<void> _init() async {
              try {
                final cams = await availableCameras();
                if (cams.isEmpty) { setState(() => _error = 'No cameras'); return; }
                final lens = widget.front ? CameraLensDirection.front : CameraLensDirection.back;
                final cam = cams.firstWhere((c) => c.lensDirection == lens, orElse: () => cams.first);
                _ctrl = CameraController(cam, ResolutionPreset.medium, enableAudio: true);
                await _ctrl!.initialize();
                if (mounted) setState(() => _ready = true);
              } catch (e) { if (mounted) setState(() => _error = e.toString()); }
            }
            @override void didUpdateWidget(covariant LiveCamera old) { super.didUpdateWidget(old); if (old.front != widget.front) { _ctrl?.dispose(); _ready = false; _init(); } }
            @override void didChangeAppLifecycleState(AppLifecycleState s) {
              if (s == AppLifecycleState.inactive) { _ctrl?.dispose(); _ready = false; }
              else if (s == AppLifecycleState.resumed) { _init(); }
            }
            @override void dispose() { WidgetsBinding.instance.removeObserver(this); _ctrl?.dispose(); super.dispose(); }
            @override Widget build(BuildContext context) {
              if (_error != null) return Container(color: Colors.black, child: Center(child: Text(_error!, style: const TextStyle(color: Colors.redAccent, fontSize: 11))));
              if (!_ready || _ctrl == null) return Container(color: Colors.black, child: const Center(child: CircularProgressIndicator(color: Colors.redAccent)));
              return CameraPreview(_ctrl!);
            }
          }
          D

          cat > lib/screens/role_chooser.dart << 'D'
          import 'package:flutter/material.dart';
          import 'director_screen.dart';
          import 'camera_screen.dart';
          class RoleChooser extends StatelessWidget {
            const RoleChooser({super.key});
            @override Widget build(BuildContext context) => Scaffold(body: SafeArea(child: SingleChildScrollView(
              physics: const ClampingScrollPhysics(), padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 16),
              child: Column(children: [
                const SizedBox(height: 20),
                const Text('MOBILE TV STUDIO', style: TextStyle(fontSize: 24, fontWeight: FontWeight.w900, letterSpacing: 4)),
                const SizedBox(height: 4),
                const Text('What is this phone?', style: TextStyle(fontSize: 12, color: Colors.white54)),
                const SizedBox(height: 20),
                Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                  _card(context, Icons.videocam, 'CAMERA', const Color(0xFFEF4444), () => Navigator.push(context, MaterialPageRoute(builder: (_) => const CameraScreen()))),
                  const SizedBox(width: 16),
                  _card(context, Icons.dashboard, 'DIRECTOR', const Color(0xFF3B82F6), () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DirectorScreen()))),
                  const SizedBox(width: 16),
                  _card(context, Icons.all_inclusive, 'BOTH', const Color(0xFF8B5CF6), () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DirectorScreen()))),
                ]),
              ]))));
            Widget _card(BuildContext context, IconData icon, String t, Color c, VoidCallback onTap) => InkWell(onTap: onTap, borderRadius: BorderRadius.circular(12),
              child: Container(width: 140, height: 150,
                decoration: BoxDecoration(color: Colors.white10, borderRadius: BorderRadius.circular(12), border: Border.all(color: c.withOpacity(0.5), width: 2)),
                child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(icon, size: 44, color: c), const SizedBox(height: 10),
                  Text(t, style: const TextStyle(fontSize: 14, fontWeight: FontWeight.w900, letterSpacing: 2))])));
          }
          D

          cat > lib/screens/camera_screen.dart << 'D'
          import 'package:flutter/material.dart';
          import '../widgets/big_button.dart';
          import '../widgets/status_badge.dart';
          import '../widgets/live_camera.dart';
          import '../services/webrtc_session.dart';
          import '../services/config.dart';
          class CameraScreen extends StatefulWidget {
            const CameraScreen({super.key});
            @override State<CameraScreen> createState() => _CS();
          }
          class _CS extends State<CameraScreen> {
            bool _live = false; bool _front = false; String _quality = '720p'; int _fps = 30; String _status = 'OFFLINE';
            WebRtcSession? _session;
            void _cycleQ() => setState(() => _quality = _quality == '720p' ? '480p' : _quality == '480p' ? '360p' : '720p');
            void _cycleFps() => setState(() { const o = [24, 25, 30, 35, 60]; _fps = o[(o.indexOf(_fps) + 1) % o.length]; });

            Future<void> _toggle() async {
              if (_live) {
                await _session?.stop();
                setState(() { _live = false; _status = 'OFFLINE'; });
              } else {
                setState(() => _status = 'CONNECTING…');
                final s = WebRtcSession(
                  serverUrl: AppConfig.signalingUrl,
                  roomId: AppConfig.roomId,
                  clientId: 'cam_${DateTime.now().millisecondsSinceEpoch}',
                  isCaller: true);
                final ok = await s.start();
                if (ok) {
                  _session = s;
                  setState(() { _live = true; _status = 'LIVE'; });
                } else {
                  setState(() => _status = 'RELAY OFFLINE');
                }
              }
            }

            @override void dispose() { _session?.stop(); super.dispose(); }

            @override Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('CAMERA NODE', style: TextStyle(fontSize: 14, letterSpacing: 3, fontWeight: FontWeight.w900)),
                backgroundColor: const Color(0xFF141414),
                actions: [Padding(padding: const EdgeInsets.only(right: 12), child: Center(child: StatusBadge(
                  label: '$_quality • ${_fps}fps • $_status',
                  color: _live ? const Color(0xFF22C55E) : (_status == 'CONNECTING…' ? Colors.orangeAccent : Colors.grey),
                  icon: _live ? Icons.wifi : Icons.cloud_off)))]),
              body: Row(children: [
                Expanded(child: Container(margin: const EdgeInsets.all(10),
                  decoration: BoxDecoration(color: Colors.black, borderRadius: BorderRadius.circular(8),
                    border: Border.all(color: _live ? const Color(0xFFEF4444) : Colors.white24, width: _live ? 3 : 1)),
                  child: ClipRRect(borderRadius: BorderRadius.circular(6), child: LiveCamera(front: _front)))),
                Container(width: 160, color: const Color(0xFF141414), padding: const EdgeInsets.all(8),
                  child: SingleChildScrollView(child: Column(children: [
                    BigButton(icon: _live ? Icons.stop : Icons.play_arrow, label: _live ? 'STOP' : 'GO LIVE',
                      color: _live ? const Color(0xFFEF4444) : const Color(0xFF22C55E), size: 78, onTap: _toggle),
                    const SizedBox(height: 8),
                    BigButton(icon: Icons.high_quality, label: _quality, onTap: _cycleQ, size: 64),
                    const SizedBox(height: 8),
                    BigButton(icon: Icons.speed, label: '$_fps FPS', color: Colors.tealAccent, onTap: _cycleFps, size: 64),
                    const SizedBox(height: 8),
                    BigButton(icon: Icons.flip_camera_android, label: _front ? 'FRONT' : 'REAR',
                      color: const Color(0xFF8B5CF6), size: 64, onTap: () => setState(() => _front = !_front)),
                  ]))),
              ]));
          }
          D

          cat > lib/screens/graphics_editor.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:uuid/uuid.dart';
          import '../models/overlay_item.dart';
          import '../data/overlay_store.dart';
          class GraphicsEditor extends StatefulWidget {
            const GraphicsEditor({super.key});
            @override State<GraphicsEditor> createState() => _GE();
          }
          class _GE extends State<GraphicsEditor> {
            final _store = OverlayStore(); List<OverlayItem> _items = []; String? _sel;
            @override void initState() { super.initState(); _load(); }
            Future<void> _load() async { _items = await _store.loadAll(); if (mounted) setState(() {}); }
            Future<void> _addText() async {
              final ctrl = TextEditingController();
              final t = await showDialog<String>(context: context, builder: (ctx) => AlertDialog(
                backgroundColor: const Color(0xFF141414), title: const Text('Add Text'),
                content: TextField(controller: ctrl, autofocus: true, style: const TextStyle(color: Colors.white)),
                actions: [TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('CANCEL')),
                  FilledButton(onPressed: () => Navigator.pop(ctx, ctrl.text), child: const Text('ADD'))]));
              if (t == null || t.isEmpty) return;
              await _store.add(OverlayItem(id: const Uuid().v4(), text: t, x: 0.5, y: 0.5));
              await _load();
            }
            void _move(Offset d, Size box) { final s = _items.firstWhere((e) => e.id == _sel);
              setState(() { s.x = (s.x + d.dx / box.width).clamp(0.0, 1.0); s.y = (s.y + d.dy / box.height).clamp(0.0, 1.0); }); }
            @override Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('GRAPHICS', style: TextStyle(fontSize: 14, letterSpacing: 3, fontWeight: FontWeight.w900)),
                backgroundColor: const Color(0xFF141414),
                actions: [TextButton.icon(onPressed: _addText, icon: const Icon(Icons.text_fields), label: const Text('ADD TEXT'))]),
              body: Column(children: [
                Expanded(flex: 3, child: Padding(padding: const EdgeInsets.all(12),
                  child: LayoutBuilder(builder: (context, cons) {
                    final box = Size(cons.maxWidth, cons.maxHeight);
                    return GestureDetector(onPanUpdate: (d) => _sel != null ? _move(d.delta, box) : null,
                      child: Container(decoration: BoxDecoration(color: Colors.black, borderRadius: BorderRadius.circular(6), border: Border.all(color: const Color(0xFFF5C542), width: 1.5)),
                        child: Stack(children: [
                          const Center(child: Text('DRAG TEXT TO MOVE', style: TextStyle(color: Colors.white24, fontSize: 10, letterSpacing: 3))),
                          ..._items.map((it) => Positioned(left: it.x * box.width - 60, top: it.y * box.height - 14,
                            child: GestureDetector(onTap: () => setState(() => _sel = it.id),
                              child: Container(padding: const EdgeInsets.all(4),
                                decoration: BoxDecoration(border: Border.all(color: _sel == it.id ? const Color(0xFF3B82F6) : Colors.transparent, width: 2)),
                                child: Text(it.text, style: TextStyle(color: Color(it.color), fontSize: it.size, fontWeight: FontWeight.w900, letterSpacing: 1)))))),
                        ])));
                  }))),
                Expanded(flex: 2, child: Container(color: const Color(0xFF141414),
                  child: _items.isEmpty ? const Center(child: Text('No overlays. Tap ADD TEXT.', style: TextStyle(color: Colors.white54, fontSize: 12)))
                    : ListView.builder(itemCount: _items.length, itemBuilder: (_, i) { final it = _items[i];
                        return ListTile(selected: _sel == it.id, selectedTileColor: Colors.white10,
                          leading: const Icon(Icons.text_fields, color: Colors.white70),
                          title: Text(it.text, style: const TextStyle(color: Colors.white)),
                          subtitle: Text('size ${it.size.toInt()}', style: const TextStyle(color: Colors.white54, fontSize: 10)),
                          trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                            IconButton(icon: const Icon(Icons.remove_circle_outline, color: Colors.white70), onPressed: () => setState(() => it.size = (it.size - 4).clamp(8.0, 72.0))),
                            IconButton(icon: const Icon(Icons.add_circle_outline, color: Colors.white70), onPressed: () => setState(() => it.size = (it.size + 4).clamp(8.0, 72.0))),
                            IconButton(icon: const Icon(Icons.delete_outline, color: Colors.redAccent), onPressed: () async { await _store.remove(it.id); await _load(); })]),
                          onTap: () => setState(() => _sel = it.id)); })),
                ),
                Container(height: 50, color: const Color(0xFF0A0A0A), padding: const EdgeInsets.symmetric(horizontal: 12),
                  child: Row(children: [
                    FilledButton.icon(onPressed: () async { await _store.saveAll(_items); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Saved'))); }, icon: const Icon(Icons.save), label: const Text('SAVE')),
                    const Spacer(),
                    FilledButton.icon(onPressed: () => Navigator.pop(context), icon: const Icon(Icons.check), label: const Text('DONE'))])),
              ]));
          }
          D

          cat > lib/screens/placeholder_screen.dart << 'D'
          import 'package:flutter/material.dart';
          class PlaceholderScreen extends StatelessWidget {
            final String title; final IconData icon;
            const PlaceholderScreen({super.key, required this.title, this.icon = Icons.construction});
            @override Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: Text(title, style: const TextStyle(fontSize: 14, letterSpacing: 3, fontWeight: FontWeight.w900)), backgroundColor: const Color(0xFF141414)),
              body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                Icon(icon, size: 64, color: Colors.white24), const SizedBox(height: 16),
                Text(title.toUpperCase(), style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.w900, letterSpacing: 3)),
