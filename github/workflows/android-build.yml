                        child: Text(_inputs[i], style: const TextStyle(color: _blue, fontSize: 6, fontWeight: FontWeight.w900)))]),
                    const SizedBox(height: 2),
                    Expanded(child: Row(children: [
                      Container(width: 4, decoration: BoxDecoration(color: Colors.black, borderRadius: BorderRadius.circular(2)),
                        child: Align(alignment: Alignment.bottomCenter, child: FractionallySizedBox(heightFactor: _mutes[i] ? 0.0 : _vols[i],
                          child: Container(decoration: BoxDecoration(gradient: const LinearGradient(begin: Alignment.bottomCenter, end: Alignment.topCenter, colors: [_green, _yellow]), borderRadius: BorderRadius.circular(2)))))),
                      const SizedBox(width: 3),
                      Expanded(child: SliderTheme(data: SliderTheme.of(context).copyWith(trackHeight: 2, activeTrackColor: _textMid, inactiveTrackColor: _border, thumbColor: Colors.white, thumbShape: const RoundSliderThumbShape(enabledThumbRadius: 4), overlayShape: const RoundSliderOverlayShape(overlayRadius: 6)),
                        child: Slider(value: _mutes[i] ? 0.0 : _vols[i], onChanged: (v) => setState(() => _vols[i] = v))))])),
                    const SizedBox(height: 2),
                    Row(children: [
                      Expanded(child: GestureDetector(onTap: () => setState(() => _mutes[i] = !_mutes[i]),
                        child: Container(height: 14, decoration: BoxDecoration(color: _mutes[i] ? _red : Colors.black, borderRadius: BorderRadius.circular(2), border: Border.all(color: _border)),
                          child: Center(child: Text('M', style: TextStyle(color: _mutes[i] ? Colors.white : _textMid, fontSize: 8, fontWeight: FontWeight.w900)))))),
                      const SizedBox(width: 3),
                      Expanded(child: Container(height: 14, decoration: BoxDecoration(color: Colors.black, borderRadius: BorderRadius.circular(2), border: Border.all(color: _border)),
                        child: const Center(child: Text('S', style: TextStyle(color: _textMid, fontSize: 8, fontWeight: FontWeight.w900)))))])]))))));

            Widget _actionBar() => Container(height: 48, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10),
              child: Row(children: [
                GestureDetector(onTap: () => setState(() => _onAir = !_onAir),
