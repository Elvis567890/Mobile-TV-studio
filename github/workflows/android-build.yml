                        GestureDetector(onTap: () => setState(() => _menu = false), child: const Icon(Icons.close, color: Colors.white, size: 16))])),
                    Expanded(child: ListView.builder(itemCount: items.length, itemBuilder: (_, i) { final it = items[i];
                      return InkWell(onTap: () { if (it[1] == 'Graphics') { _open(const GraphicsEditor()); }
                        else { _open(PlaceholderScreen(title: it[1] as String, icon: it[0] as IconData)); } },
