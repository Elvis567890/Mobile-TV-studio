            Widget _statusBar() => Container(height: 40, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10),
              child: Row(children: [
                Container(width: 7, height: 7, decoration: BoxDecoration(color: _onAir ? _red : _textMid, shape: BoxShape.circle)), const SizedBox(width: 6),
                Text(_onAir ? 'ON AIR' : 'OFFLINE', style: TextStyle(color: _onAir ? _red : _textMid, fontSize: 10, fontWeight: FontWeight.w900, letterSpacing: 2)),
                const SizedBox(width: 10), Container(width: 1, height: 16, color: _border), const SizedBox(width: 10),
                const Icon(Icons.videocam, color: Colors.white, size: 12), const SizedBox(width: 4),
                Text(_live, style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w700)), const SizedBox(width: 8),
                Text(_connStatus, style: TextStyle(color: _connStatus == 'CONNECTED' ? _green : Colors.orangeAccent, fontSize: 9, letterSpacing: 1)),
                const Spacer(),
                const Icon(Icons.access_time, color: Colors.white, size: 11), const SizedBox(width: 4),
                Text(_time, style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w700)), const SizedBox(width: 10),
                Icon(_connStatus == 'CONNECTED' ? Icons.wifi : Icons.cloud_off, color: _connStatus == 'CONNECTED' ? _green : Colors.grey, size: 12), const SizedBox(width: 10),
                GestureDetector(onTap: () => setState(() => _menu = !_menu), child: const Icon(Icons.menu, color: Colors.white, size: 18))]));

            Widget _camStrip() { final items = <Widget>[]; for (final c in _cams) items.add(Expanded(child: _camTile(c))); items.add(Expanded(child: _addTile())); return Container(height: 64, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10), child: Row(children: items)); }
            Widget _camTile(_Cam c) {
              final b = c.live ? _red : c.preview ? _yellow : _border; final bw = (c.live || c.preview) ? 2.0 : 1.0;
              return Padding(padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(onTap: () => setState(() { for (final x in _cams) x.preview = false; c.preview = true; }),
                  onDoubleTap: () => setState(() { for (final x in _cams) { x.live = false; x.preview = false; } c.live = true; }),
                  child: Container(decoration: BoxDecoration(color: Colors.black, border: Border.all(color: b, width: bw), borderRadius: BorderRadius.circular(3)),
                    child: Stack(children: [
                      Positioned(top: 3, left: 3, child: Container(width: 5, height: 5, decoration: BoxDecoration(color: c.live ? _red : c.preview ? _yellow : _textMid, shape: BoxShape.circle))),
                      if (c.live) Positioned(top: 3, right: 3, child: Container(padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                        decoration: BoxDecoration(color: _red, borderRadius: BorderRadius.circular(2)),
                        child: const Text('LIVE', style: TextStyle(color: Colors.white, fontSize: 6, fontWeight: FontWeight.w900, letterSpacing: 1)))),
                      Positioned(left: 4, bottom: 3, child: Text(c.name, style: const TextStyle(color: Colors.white, fontSize: 7, fontWeight: FontWeight.w900, letterSpacing: 1)))]))));
            }
            Widget _addTile() => Padding(padding: const EdgeInsets.symmetric(horizontal: 2),
              child: Container(decoration: BoxDecoration(borderRadius: BorderRadius.circular(3), border: Border.all(color: _textMid, width: 1)),
                child: const Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.add, color: Colors.white70, size: 14), SizedBox(height: 2), Text('Add', style: TextStyle(color: Colors.white70, fontSize: 7))])));

            Widget _tabRow() => Container(height: 24, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10),
              child: Row(children: [_tabBtn('PROGRAM', 0), const SizedBox(width: 20), _tabBtn('MULTIVIEW', 1)]));
            Widget _tabBtn(String l, int i) => GestureDetector(onTap: () => setState(() => _tabIndex = i),
              child: Text(l, style: TextStyle(color: _tabIndex == i ? Colors.white : _textMid, fontSize: 9, fontWeight: _tabIndex == i ? FontWeight.w900 : FontWeight.w600, letterSpacing: 2)));

            Widget _center() => _tabIndex == 1 ? _grid() : _program();

            Widget _program() => Padding(padding: const EdgeInsets.fromLTRB(10, 2, 10, 2),
              child: Container(decoration: BoxDecoration(color: Colors.black, border: Border.all(color: _yellow, width: 1.5), borderRadius: BorderRadius.circular(4)),
                child: LayoutBuilder(builder: (context, cons) {
                  final pW = cons.maxWidth;
                  final hasRemote = _session != null && _session!.renderer.srcObject != null;
                  return Stack(children: [
                    if (hasRemote) Positioned.fill(child: RTCVideoView(_session!.renderer, mirror: false, objectFit: RTCVideoViewObjectFit.RTCVideoViewObjectFitCover))
                    else Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                      const Icon(Icons.videocam_off, color: Colors.white24, size: 32),
                      const SizedBox(height: 6),
                      Text(_connStatus == 'RELAY OFFLINE' ? 'RELAY NOT DEPLOYED YET' : 'WAITING FOR CAMERA',
                        style: const TextStyle(color: Colors.white38, fontSize: 10, letterSpacing: 2))])),
                    Positioned(top: 6, left: 6, child: Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                      decoration: BoxDecoration(color: _red, borderRadius: BorderRadius.circular(2)),
                      child: const Text('PROGRAM', style: TextStyle(color: Colors.white, fontSize: 8, fontWeight: FontWeight.w900, letterSpacing: 1.5)))),
                    Positioned(right: 8, bottom: 8, width: pW * 0.28, height: pW * 0.28 * 9 / 16,
                      child: Container(decoration: BoxDecoration(color: Colors.black, border: Border.all(color: _yellow, width: 1.5), borderRadius: BorderRadius.circular(3)),
                        child: Stack(children: [
                          Center(child: Text(_prev, style: const TextStyle(color: Colors.white24, fontSize: 11, fontWeight: FontWeight.w900, letterSpacing: 2))),
                          Positioned(top: 3, left: 3, child: Container(padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                            decoration: BoxDecoration(color: _yellow, borderRadius: BorderRadius.circular(2)),
                            child: const Text('PREVIEW', style: TextStyle(color: Colors.black, fontSize: 6, fontWeight: FontWeight.w900, letterSpacing: 1))))])),
                  ]);
                })));

            Widget _grid() => Padding(padding: const EdgeInsets.all(10),
              child: GridView.builder(itemCount: _cams.length,
                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, mainAxisSpacing: 6, crossAxisSpacing: 6, childAspectRatio: 16 / 9),
                itemBuilder: (_, i) { final c = _cams[i]; final b = c.live ? _red : c.preview ? _yellow : _border;
                  return GestureDetector(onTap: () => setState(() { for (final x in _cams) x.preview = false; c.preview = true; }),
                    child: Container(decoration: BoxDecoration(color: Colors.black, border: Border.all(color: b, width: 1.5), borderRadius: BorderRadius.circular(3)),
                      child: Center(child: Text(c.name, style: const TextStyle(color: Colors.white70, fontSize: 10, fontWeight: FontWeight.w800, letterSpacing: 2))))); }));

            Widget _audio() => Container(height: 64, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10),
