          cat > lib/screens/director_screen.dart << 'D'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'graphics_editor.dart';
          import 'placeholder_screen.dart';
          import '../services/webrtc_session.dart';
          import '../services/config.dart';

          const _bg = Color(0xFF0A0A0A); const _panel = Color(0xFF141414); const _border = Color(0x14FFFFFF);
          const _red = Color(0xFFEF4444); const _green = Color(0xFF22C55E); const _yellow = Color(0xFFF5C542);
          const _blue = Color(0xFF3B82F6); const _textMid = Color(0x99FFFFFF);

          class DirectorScreen extends StatefulWidget {
            const DirectorScreen({super.key});
            @override State<DirectorScreen> createState() => _DS();
          }
          class _Cam { final String name; bool live; bool preview; _Cam(this.name, {this.live = false, this.preview = false}); }

          class _DS extends State<DirectorScreen> {
            bool _onAir = true; bool _menu = false; int _tabIndex = 0; int _sec = 0; Timer? _ticker;
            final _cams = [_Cam('CAM 1', live: true), _Cam('CAM 2', preview: true), _Cam('CAM 3'), _Cam('CAM 4'), _Cam('CAM 5'), _Cam('CAM 6')];
            final _vols = [0.7, 0.8, 0.6, 0.9, 0.5, 0.7];
            final _inputs = ['MIC', 'USB', 'BT', 'WIRED', 'MIC', 'USB'];
            final _mutes = List<bool>.filled(6, false);
            WebRtcSession? _session; String _connStatus = 'OFFLINE';

            @override void initState() { super.initState(); _ticker = Timer.periodic(const Duration(seconds: 1), (_) { if (mounted) setState(() => _sec++); }); _connect(); }
            @override void dispose() { _ticker?.cancel(); _session?.stop(); super.dispose(); }

            Future<void> _connect() async {
              setState(() => _connStatus = 'CONNECTING…');
              final s = WebRtcSession(
                serverUrl: AppConfig.signalingUrl, roomId: AppConfig.roomId,
                clientId: 'dir_${DateTime.now().millisecondsSinceEpoch}', isCaller: false);
              final ok = await s.start();
              if (ok) { _session = s; setState(() => _connStatus = 'CONNECTED'); }
              else { setState(() => _connStatus = 'RELAY OFFLINE'); }
            }

            String get _time { final h = (_sec ~/ 3600).toString().padLeft(2, '0'); final m = ((_sec ~/ 60) % 60).toString().padLeft(2, '0'); final s = (_sec % 60).toString().padLeft(2, '0'); return '$h:$m:$s'; }
            String get _live => _cams.firstWhere((c) => c.live, orElse: () => _cams[0]).name;
            String get _prev => _cams.firstWhere((c) => c.preview, orElse: () => _cams[1]).name;
            void _take() => setState(() { final l = _cams.indexWhere((c) => c.live); final p = _cams.indexWhere((c) => c.preview); if (l >= 0 && p >= 0) { _cams[l].live = false; _cams[l].preview = true; _cams[p].preview = false; _cams[p].live = true; } });
            void _open(Widget s) { setState(() => _menu = false); Navigator.of(context).push(MaterialPageRoute(builder: (_) => s)); }

