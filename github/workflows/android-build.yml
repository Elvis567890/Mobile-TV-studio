name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Regenerate Android folder
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          echo "=== android/app contents ==="
          ls android/app/

      - name: Patch app build.gradle with SDK versions
        run: |
          python3 << 'PYEOF'
          import os, re

          # Try both possible filenames
          path = None
          for candidate in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(candidate):
                  path = candidate
                  break

          if path is None:
              print("ERROR: no app build.gradle found")
              exit(1)

          print(f"Patching {path}")

          with open(path) as f:
              s = f.read()

          if path.endswith('.kts'):
              # Kotlin syntax
              if 'compileSdk = ' not in s:
                  s = s.replace('android {', 'android {\n    compileSdk = 34')
              if 'ndkVersion = ' not in s:
                  s = s.replace('android {', 'android {\n    ndkVersion = "25.1.8937393"')
              s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 34', s)
              s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 24', s)
          else:
              # Groovy syntax
              if 'compileSdkVersion' not in s:
                  s = s.replace('android {', 'android {\n    compileSdkVersion 34')
              if 'ndkVersion' not in s:
                  s = s.replace('android {', 'android {\n    ndkVersion "25.1.8937393"')
              s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', s)
              s = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', s)

          with open(path, 'w') as f:
              f.write(s)

          print("=== After patch ===")
          print(open(path).read())
          PYEOF

      - name: Force v2 embedding in manifest
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              s = f.read()

          s = re.sub(r'<meta-data[^>]*android:name="flutterEmbedding"[^>]*/>', '', s)
          s = s.replace(
              '</application>',
              '        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />\n    </application>'
          )
          if 'xmlns:tools' not in s:
              s = s.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n          xmlns:tools="http://schemas.android.com/tools"'
              )
          s = s.replace(
              'android:label="mobile_tv_studio"',
              'android:label="Mobile TV Studio"\n        android:usesCleartextTraffic="true"\n        tools:replace="android:label"'
          )

          with open(path, 'w') as f:
              f.write(s)
          print("=== Manifest after patch ===")
          print(open(path).read())
          PYEOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileTVStudio-release
          path: build/app/outputs/flutter-apk/app-release.apk
