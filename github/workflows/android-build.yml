                [Icons.bookmark_border, 'Templates'], [Icons.monitor_heart, 'Diagnostics'],
                [Icons.account_circle, 'Accounts'], [Icons.key, 'Stream Targets'],
                [Icons.schedule, 'Schedule'], [Icons.video_library, 'Recordings'], [Icons.settings, 'Settings']];
              return Positioned(top: 0, right: 0, bottom: 0,
                child: Container(width: 220, color: _bg,
                  child: Column(children: [
                    Container(height: 40, padding: const EdgeInsets.symmetric(horizontal: 12),
