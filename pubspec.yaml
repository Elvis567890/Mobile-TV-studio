name: mobile_tv_studio
description: Mobile TV Studio — live broadcast app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  camera: ^0.10.5+9
  flutter_webrtc: ^0.10.6
  web_socket_channel: ^2.4.5
  http: ^1.2.0
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^1.32.0
  video_player: ^2.8.3
  uuid: ^4.3.3
  intl: ^0.19.0
  logger: ^2.1.0
  file_picker: ^8.0.0
  haishin_kit: ^0.13.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0B0F"
  image: "assets/icon/app_icon.png"
  color_dark: "#0B0B0F"
  image_dark: "assets/icon/app_icon.png"
  android_12:
    color: "#0B0B0F"
    image: "assets/icon/app_icon.png"
