name: mobile_tv_studio
description: Mobile TV Studio — live broadcast app for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.0

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Camera and video
  camera: ^0.11.0+2
  video_player: ^2.9.1

  # WebRTC and RTMP streaming
  flutter_webrtc: ^0.11.6
  haishin_kit: ^0.13.0

  # Networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # OAuth for YouTube
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Bluetooth (modern fork that supports Flutter 3.24)
  flutter_blue_plus: ^1.34.5

  # File picking
  file_picker: ^8.1.2

  # Utilities
  uuid: ^4.5.0
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0B0F"
  image: "assets/icon/app_icon.png"
  color_dark: "#0B0B0F"
  image_dark: "assets/icon/app_icon.png"
  android_12:
    color: "#0B0B0F"
    image: "assets/icon/app_icon.png"
