            }
            void _setLive(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) {
                  _live[k] = false; _prev[k] = false;
                }
                _live[i] = true;
              });
            }
            void _add() {
              if (_camCount >= 15) return;
              setState(() => _camCount++);
