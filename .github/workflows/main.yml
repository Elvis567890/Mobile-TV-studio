name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: 3.24.0, channel: stable, cache: true}

      - name: Setup
        run: |
          rm -rf lib test android
          mkdir -p lib/screens lib/widgets lib/services assets/icon
          cat > pubspec.yaml << 'P'
          name: mobile_tv_studio
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            camera: ^0.11.0+2
            shared_preferences: ^2.3.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.1
          flutter:
            uses-material-design: true
            assets:
              - assets/icon/
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            adaptive_icon_background: "#0A0A0F"
            adaptive_icon_foreground: "assets/icon/app_icon.png"
          flutter_native_splash:
            android: true
            ios: false
            web: false
            color: "#0A0A0F"
            image: "assets/icon/app_icon.png"
            android_12:
              color: "#0A0A0F"
              image: "assets/icon/app_icon.png"
          P
          pip install Pillow > /dev/null 2>&1
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024,1024), (10,10,15,255))
          d = ImageDraw.Draw(img)
          d.ellipse((232,140,792,700), fill=(239,68,68,255))
          d.ellipse((312,220,712,620), fill=(10,10,15,255))
          d.polygon([(442,330),(442,510),(612,420)], fill=(255,255,255,255))
          try:
              f1=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',100)
              f2=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',68)
          except Exception:
              f1=f2=ImageFont.load_default()
          d.text((512,800),'MOBILE TV',fill=(255,255,255,255),anchor='mm',font=f1)
          d.text((512,900),'STUDIO',fill=(239,68,68,255),anchor='mm',font=f2)
          img.save('assets/icon/app_icon.png')
          PY

      - name: Write main.dart
        run: |
          cat > lib/main.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/role_chooser.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Mobile TV Studio',
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0A0A0F),
                ),
                home: const RoleChooser(),
              );
            }
          }
          D

      - name: Write camera widget
        run: |
          cat > lib/widgets/live_camera.dart << 'D'
          import 'package:camera/camera.dart';
          import 'package:flutter/material.dart';

          class LiveCamera extends StatefulWidget {
            final bool front;
            const LiveCamera({super.key, this.front = false});
            @override
            State<LiveCamera> createState() => _LiveCameraState();
          }

          class _LiveCameraState extends State<LiveCamera> {
            CameraController? _ctrl;
            bool _ready = false;
            String? _error;

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              try {
                final cams = await availableCameras();
                if (cams.isEmpty) {
                  setState(() => _error = 'No cameras');
                  return;
                }
                final lens = widget.front
                    ? CameraLensDirection.front
                    : CameraLensDirection.back;
                final cam = cams.firstWhere(
                  (c) => c.lensDirection == lens,
                  orElse: () => cams.first,
                );
                _ctrl = CameraController(cam, ResolutionPreset.high, enableAudio: true);
                await _ctrl!.initialize();
                if (mounted) setState(() => _ready = true);
              } catch (e) {
                if (mounted) setState(() => _error = e.toString());
              }
            }

            @override
            void didUpdateWidget(covariant LiveCamera old) {
              super.didUpdateWidget(old);
              if (old.front != widget.front) {
                _ctrl?.dispose();
                _ready = false;
                _init();
              }
            }

            @override
            void dispose() {
              _ctrl?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (_error != null) {
                return Container(
                  color: Colors.black,
                  child: Center(
                    child: Text(_error!,
                      style: const TextStyle(color: Colors.redAccent, fontSize: 11)),
                  ),
                );
              }
              if (!_ready || _ctrl == null) {
                return Container(
                  color: Colors.black,
                  child: const Center(
                    child: CircularProgressIndicator(color: Colors.redAccent)),
                );
              }
              final isFront = _ctrl!.description.lensDirection ==
                  CameraLensDirection.front;
              return RotatedBox(
                quarterTurns: isFront ? 3 : 1,
                child: CameraPreview(_ctrl!),
              );
            }
          }
          D

      - name: Write camera screen
        run: |
          cat > lib/screens/camera_screen.dart << 'D'
          import 'package:flutter/material.dart';
          import '../widgets/live_camera.dart';

          class CameraScreen extends StatefulWidget {
            const CameraScreen({super.key});
            @override
            State<CameraScreen> createState() => _CameraScreenState();
          }

          class _CameraScreenState extends State<CameraScreen> {
            bool _live = false;
            bool _front = false;
            String _quality = '720p';
            int _fps = 30;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                appBar: AppBar(
                  title: const Text('CAMERA NODE',
                    style: TextStyle(fontSize: 14, letterSpacing: 3,
                      fontWeight: FontWeight.w900)),
                  backgroundColor: const Color(0xFF141418),
                  actions: [
                    Padding(
                      padding: const EdgeInsets.only(right: 12),
                      child: Center(
                        child: Text(
                          '$_quality - ${_fps}fps - ${_live ? "LIVE" : "OFFLINE"}',
                          style: TextStyle(
                            color: _live ? Colors.green : Colors.grey,
                            fontSize: 10,
                            fontWeight: FontWeight.w800,
                            letterSpacing: 1,
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
                body: Row(
                  children: [
                    Expanded(
                      child: Container(
                        margin: const EdgeInsets.all(10),
                        decoration: BoxDecoration(
                          color: Colors.black,
                          borderRadius: BorderRadius.circular(8),
                          border: Border.all(
                            color: _live ? Colors.red : Colors.white24,
                            width: _live ? 3 : 1,
                          ),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(6),
                          child: LiveCamera(front: _front),
                        ),
                      ),
                    ),
                    Container(
                      width: 160,
                      color: const Color(0xFF141418),
                      padding: const EdgeInsets.all(8),
                      child: SingleChildScrollView(
                        child: Column(
                          children: [
                            _btn(
                              _live ? Icons.stop : Icons.play_arrow,
                              _live ? 'STOP' : 'GO LIVE',
                              _live ? Colors.red : Colors.green,
                              78,
                              () => setState(() => _live = !_live),
                            ),
                            const SizedBox(height: 8),
                            _btn(Icons.high_quality, _quality, Colors.blue, 64, () {
                              setState(() {
                                if (_quality == '720p') _quality = '480p';
                                else if (_quality == '480p') _quality = '360p';
                                else _quality = '720p';
                              });
                            }),
                            const SizedBox(height: 8),
                            _btn(Icons.speed, '$_fps FPS', Colors.tealAccent, 64, () {
                              setState(() {
                                final opts = [24, 25, 30, 35, 60];
                                _fps = opts[(opts.indexOf(_fps) + 1) % opts.length];
                              });
                            }),
                            const SizedBox(height: 8),
                            _btn(Icons.flip_camera_android,
                              _front ? 'FRONT' : 'REAR',
                              Colors.purpleAccent, 64,
                              () => setState(() => _front = !_front)),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _btn(IconData icon, String label, Color color, double size,
                VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(8),
                child: Container(
                  width: size,
                  height: size,
                  decoration: BoxDecoration(
                    color: color.withOpacity(0.12),
                    border: Border.all(color: color, width: 1.5),
                    borderRadius: BorderRadius.circular(8),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, color: color, size: size * 0.32),
                      const SizedBox(height: 4),
                      Text(label, textAlign: TextAlign.center,
                        style: TextStyle(color: color, fontSize: 9,
                          fontWeight: FontWeight.w900, letterSpacing: 1)),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Write director screen
        run: |
          cat > lib/screens/director_screen.dart << 'D'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter_webrtc/flutter_webrtc.dart';

          const _bg = Color(0xFF0A0A0F);
          const _panel = Color(0xFF141418);
          const _red = Color(0xFFEF4444);
          const _green = Color(0xFF22C55E);
          const _yellow = Color(0xFFF5C542);
          const _blue = Color(0xFF3B82F6);
          const _grey = Color(0x14FFFFFF);

          class DirectorScreen extends StatefulWidget {
            const DirectorScreen({super.key});
            @override
            State<DirectorScreen> createState() => _DirectorScreenState();
          }

          class _DirectorScreenState extends State<DirectorScreen> {
            bool _onAir = false;
            bool _menuOpen = false;
            int _tab = 0;
            int _seconds = 0;
            int _camCount = 6;
            Timer? _ticker;
            final List<bool> _live = List.generate(15, (i) => i == 0);
            final List<bool> _preview = List.generate(15, (i) => i == 1);
            final _remote = RTCVideoRenderer();
            bool _remoteReady = false;

            @override
            void initState() {
              super.initState();
              _ticker = Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() => _seconds++);
              });
              _initRemote();
            }

            Future<void> _initRemote() async {
              try {
                await _remote.initialize();
                if (mounted) setState(() => _remoteReady = true);
              } catch (_) {}
            }

            @override
            void dispose() {
              _ticker?.cancel();
              _remote.dispose();
              super.dispose();
            }

            String get _time {
              final h = (_seconds ~/ 3600).toString().padLeft(2, '0');
              final m = ((_seconds ~/ 60) % 60).toString().padLeft(2, '0');
              final s = (_seconds % 60).toString().padLeft(2, '0');
              return '$h:$m:$s';
            }

            void _take() {
              setState(() {
                final liveIdx = _live.indexOf(true);
                final previewIdx = _preview.indexOf(true);
                if (liveIdx < 0 || previewIdx < 0) return;
                _live[liveIdx] = false;
                _preview[liveIdx] = true;
                _preview[previewIdx] = false;
                _live[previewIdx] = true;
              });
            }

            void _selectPreview(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) _preview[k] = false;
                _preview[i] = true;
              });
            }

            void _setLive(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) {
                  _live[k] = false;
                  _preview[k] = false;
                }
                _live[i] = true;
              });
            }

            void _addCamera() {
              if (_camCount >= 15) return;
              setState(() => _camCount++);
            }

            Future<void> _removeCamera(int i) async {
              if (_camCount <= 1) return;
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: _panel,
                  title: const Text('Remove camera?'),
                  content: Text('Remove CAM ${i + 1}?'),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx, false),
                      child: const Text('CANCEL'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('REMOVE'),
                    ),
                  ],
                ),
              );
              if (ok != true) return;
              setState(() {
                _camCount--;
                if (!_live.sublist(0, _camCount).contains(true) && _camCount > 0) {
                  _live[0] = true;
                }
                if (!_preview.sublist(0, _camCount).contains(true) && _camCount > 1) {
                  _preview[1] = true;
                }
              });
            }

            Future<void> _pickCount() async {
              final choice = await showModalBottomSheet<int>(
                context: context,
                backgroundColor: _panel,
                builder: (ctx) => SafeArea(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Padding(
                        padding: EdgeInsets.all(16),
                        child: Text('NUMBER OF CAMERAS',
                          style: TextStyle(color: Colors.white70,
                            fontSize: 12, letterSpacing: 3,
                            fontWeight: FontWeight.w800)),
                      ),
                      Expanded(
                        child: ListView.builder(
                          itemCount: 15,
                          itemBuilder: (_, i) {
                            final n = i + 1;
                            return ListTile(
                              title: Text('$n camera${n == 1 ? "" : "s"}',
                                style: const TextStyle(color: Colors.white)),
                              trailing: n == _camCount
                                  ? const Icon(Icons.check, color: Colors.tealAccent)
                                  : null,
                              onTap: () => Navigator.pop(ctx, n),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
              if (choice != null) setState(() => _camCount = choice);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: _bg,
                body: SafeArea(
                  child: Stack(
                    children: [
                      Column(
                        children: [
                          _statusBar(),
                          _cameraStrip(),
                          _tabRow(),
                          Expanded(child: _tab == 1 ? _grid() : _program()),
                          _actionBar(),
                        ],
                      ),
                      if (_menuOpen) _menuPanel(),
                    ],
                  ),
                ),
              );
            }

            Widget _statusBar() {
              return Container(
                height: 40,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    Container(
                      width: 7,
                      height: 7,
                      decoration: BoxDecoration(
                        color: _onAir ? _red : Colors.grey,
                        shape: BoxShape.circle,
                      ),
                    ),
                    const SizedBox(width: 6),
                    Text(
                      _onAir ? 'ON AIR' : 'OFFLINE',
                      style: TextStyle(
                        color: _onAir ? _red : Colors.grey,
                        fontSize: 10,
                        fontWeight: FontWeight.w900,
                        letterSpacing: 2,
                      ),
                    ),
                    const SizedBox(width: 10),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 2),
                      decoration: BoxDecoration(
                        color: _blue.withOpacity(0.2),
                        borderRadius: BorderRadius.circular(3),
                      ),
                      child: Text(
                        '$_camCount CAMS',
                        style: const TextStyle(
                          color: _blue,
                          fontSize: 8,
                          fontWeight: FontWeight.w900,
                          letterSpacing: 1,
                        ),
                      ),
                    ),
                    const Spacer(),
                    Text(
                      _time,
                      style: const TextStyle(
                        color: Colors.white,
                        fontSize: 10,
                        fontWeight: FontWeight.w700,
                      ),
                    ),
                    const SizedBox(width: 10),
                    GestureDetector(
                      onTap: () => setState(() => _menuOpen = !_menuOpen),
                      child: const Icon(Icons.menu, color: Colors.white, size: 18),
                    ),
                  ],
                ),
              );
            }

            Widget _cameraStrip() {
              final items = <Widget>[];
              for (var i = 0; i < _camCount; i++) {
                items.add(Expanded(child: _camTile(i)));
              }
              items.add(SizedBox(width: 48, child: _addTile()));
              return Container(
                height: 64,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(children: items),
              );
            }

            Widget _camTile(int i) {
              final isLive = _live[i];
              final isPreview = _preview[i];
              final borderColor = isLive ? _red : isPreview ? _yellow : _grey;
              final borderWidth = (isLive || isPreview) ? 2.0 : 1.0;
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(
                  onTap: () => _selectPreview(i),
                  onDoubleTap: () => _setLive(i),
                  onLongPress: () => _removeCamera(i),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.black,
                      border: Border.all(color: borderColor, width: borderWidth),
                      borderRadius: BorderRadius.circular(3),
                    ),
                    child: Stack(
                      children: [
                        Positioned(
                          top: 3,
                          left: 3,
                          child: Container(
                            width: 5,
                            height: 5,
                            decoration: BoxDecoration(
                              color: isLive
                                  ? _red
                                  : isPreview
                                      ? _yellow
                                      : Colors.grey,
                              shape: BoxShape.circle,
                            ),
                          ),
                        ),
                        if (isLive)
                          Positioned(
                            top: 3,
                            right: 3,
                            child: Container(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 4, vertical: 1),
                              decoration: BoxDecoration(
                                color: _red,
                                borderRadius: BorderRadius.circular(2),
                              ),
                              child: const Text(
                                'LIVE',
                                style: TextStyle(
                                  color: Colors.white,
                                  fontSize: 6,
                                  fontWeight: FontWeight.w900,
                                  letterSpacing: 1,
                                ),
                              ),
                            ),
                          ),
                        Positioned(
                          left: 4,
                          bottom: 3,
                          child: Text(
                            'CAM ${i + 1}',
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 7,
                              fontWeight: FontWeight.w900,
                              letterSpacing: 1,
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _addTile() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(
                  onTap: _addCamera,
                  child: Container(
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(3),
                      border: Border.all(color: Colors.tealAccent, width: 1),
                    ),
                    child: const Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.add, color: Colors.tealAccent, size: 18),
                        SizedBox(height: 2),
                        Text('Add',
                          style: TextStyle(color: Colors.tealAccent, fontSize: 7)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _tabRow() {
              return Container(
                height: 24,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    _tabButton('PROGRAM', 0),
                    const SizedBox(width: 20),
                    _tabButton('MULTIVIEW', 1),
                  ],
                ),
              );
            }

            Widget _tabButton(String label, int index) {
              final active = _tab == index;
              return GestureDetector(
                onTap: () => setState(() => _tab = index),
                child: Text(
                  label,
                  style: TextStyle(
                    color: active ? Colors.white : Colors.white54,
                    fontSize: 9,
                    fontWeight: active ? FontWeight.w900 : FontWeight.w600,
                    letterSpacing: 2,
                  ),
                ),
              );
            }

            Widget _program() {
              return Padding(
                padding: const EdgeInsets.fromLTRB(10, 2, 10, 2),
                child: Container(
                  decoration: BoxDecoration(
                    color: Colors.black,
                    border: Border.all(color: _yellow, width: 1.5),
                    borderRadius: BorderRadius.circular(4),
                  ),
                  child: LayoutBuilder(
                    builder: (context, cons) {
                      final w = cons.maxWidth;
                      final hasRemote = _remoteReady && _remote.srcObject != null;
                      return Stack(
                        children: [
                          if (hasRemote)
                            Positioned.fill(
                              child: RTCVideoView(
                                _remote,
                                mirror: false,
                                objectFit: RTCVideoViewObjectFit.RTCVideoViewObjectFitCover,
                              ),
                            )
                          else
                            const Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Icon(Icons.videocam_off,
                                    color: Colors.white24, size: 32),
                                  SizedBox(height: 6),
                                  Text('WAITING FOR CAMERA',
                                    style: TextStyle(color: Colors.white38,
                                      fontSize: 10, letterSpacing: 2)),
                                ],
                              ),
                            ),
                          Positioned(
                            top: 6,
                            left: 6,
                            child: Container(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 6, vertical: 2),
                              decoration: BoxDecoration(
                                color: _red,
                                borderRadius: BorderRadius.circular(2),
                              ),
                              child: const Text('PROGRAM',
                                style: TextStyle(color: Colors.white, fontSize: 8,
                                  fontWeight: FontWeight.w900, letterSpacing: 1.5)),
                            ),
                          ),
                          Positioned(
                            right: 8,
                            bottom: 8,
                            width: w * 0.28,
                            height: w * 0.28 * 9 / 16,
                            child: Container(
                              decoration: BoxDecoration(
                                color: Colors.black,
                                border: Border.all(color: _yellow, width: 1.5),
                                borderRadius: BorderRadius.circular(3),
                              ),
                              child: Stack(
                                children: [
                                  Center(
                                    child: Text(
                                      'CAM ${_preview.indexOf(true) + 1}',
                                      style: const TextStyle(
                                        color: Colors.white24, fontSize: 11,
                                        fontWeight: FontWeight.w900, letterSpacing: 2),
                                    ),
                                  ),
                                  Positioned(
                                    top: 3,
                                    left: 3,
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(
                                        horizontal: 4, vertical: 1),
                                      decoration: BoxDecoration(
                                        color: _yellow,
                                        borderRadius: BorderRadius.circular(2),
                                      ),
                                      child: const Text('PREVIEW',
                                        style: TextStyle(color: Colors.black,
                                          fontSize: 6, fontWeight: FontWeight.w900,
                                          letterSpacing: 1)),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ],
                      );
                    },
                  ),
                ),
              );
            }

            Widget _grid() {
              final cols = _camCount <= 2
                  ? 2
                  : _camCount <= 4
                      ? 2
                      : _camCount <= 6
                          ? 3
                          : _camCount <= 9
                              ? 3
                              : _camCount <= 12
                                  ? 4
                                  : 5;
              return Padding(
                padding: const EdgeInsets.all(10),
                child: GridView.builder(
                  itemCount: _camCount,
                  gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                    crossAxisCount: cols,
                    mainAxisSpacing: 6,
                    crossAxisSpacing: 6,
                    childAspectRatio: 16 / 9,
                  ),
                  itemBuilder: (_, i) {
                    final isLive = _live[i];
                    final isPreview = _preview[i];
                    final borderColor = isLive ? _red : isPreview ? _yellow : _grey;
                    return GestureDetector(
                      onTap: () => _selectPreview(i),
                      onLongPress: () => _removeCamera(i),
                      child: Container(
                        decoration: BoxDecoration(
                          color: Colors.black,
                          border: Border.all(color: borderColor, width: 1.5),
                          borderRadius: BorderRadius.circular(3),
                        ),
                        child: Center(
                          child: Text(
                            'CAM ${i + 1}',
                            style: const TextStyle(
                              color: Colors.white70,
                              fontSize: 10,
                              fontWeight: FontWeight.w800,
                              letterSpacing: 2,
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }

            Widget _actionBar() {
              return Container(
                height: 48,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    GestureDetector(
                      onTap: () => setState(() => _onAir = !_onAir),
                      child: Container(
                        height: 36,
                        padding: const EdgeInsets.symmetric(horizontal: 14),
                        decoration: BoxDecoration(
                          color: _onAir ? _red : const Color(0xFF1E293B),
                          borderRadius: BorderRadius.circular(5),
                        ),
                        child: Row(
                          children: [
                            Icon(_onAir ? Icons.stop_circle : Icons.podcasts,
                              color: Colors.white, size: 16),
                            const SizedBox(width: 6),
                            Text(
                              _onAir ? 'END STREAM' : 'GO LIVE',
                              style: const TextStyle(
                                color: Colors.white,
                                fontSize: 11,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 1.2,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const Spacer(),
                    GestureDetector(
                      onTap: _take,
                      child: Container(
                        height: 36,
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        decoration: BoxDecoration(
                          color: _red,
                          borderRadius: BorderRadius.circular(5),
                        ),
                        child: const Row(
                          children: [
                            Icon(Icons.fiber_manual_record,
                              color: Colors.white, size: 10),
                            SizedBox(width: 6),
                            Text('TAKE',
                              style: TextStyle(color: Colors.white, fontSize: 12,
                                fontWeight: FontWeight.w900, letterSpacing: 2.5)),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _menuPanel() {
              return Positioned(
                top: 0,
                right: 0,
                bottom: 0,
                child: Container(
                  width: 220,
                  color: _bg,
                  child: Column(
                    children: [
                      Container(
                        height: 40,
                        padding: const EdgeInsets.symmetric(horizontal: 12),
                        decoration: const BoxDecoration(
                          border: Border(bottom: BorderSide(color: _grey)),
                        ),
                        child: Row(
                          children: [
                            const Text('Menu',
                              style: TextStyle(color: Colors.white,
                                fontSize: 12, fontWeight: FontWeight.w800)),
                            const Spacer(),
                            GestureDetector(
                              onTap: () => setState(() => _menuOpen = false),
                              child: const Icon(Icons.close,
                                color: Colors.white, size: 16),
                            ),
                          ],
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.grid_view, color: Colors.white70, size: 16),
                        title: const Text('Camera Count',
                          style: TextStyle(color: Colors.white, fontSize: 11)),
                        onTap: () {
                          setState(() => _menuOpen = false);
                          _pickCount();
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.add, color: Colors.white70, size: 16),
                        title: const Text('Add Camera',
                          style: TextStyle(color: Colors.white, fontSize: 11)),
                        onTap: () {
                          setState(() => _menuOpen = false);
                          _addCamera();
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Write role chooser
        run: |
          cat > lib/screens/role_chooser.dart << 'D'
          import 'package:flutter/material.dart';
          import 'director_screen.dart';
          import 'camera_screen.dart';

          class RoleChooser extends StatelessWidget {
            const RoleChooser({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 16),
                    child: Column(
                      children: [
                        const SizedBox(height: 20),
                        const Text('MOBILE TV STUDIO',
                          style: TextStyle(fontSize: 24,
                            fontWeight: FontWeight.w900, letterSpacing: 4)),
                        const SizedBox(height: 4),
                        const Text('What is this phone?',
                          style: TextStyle(fontSize: 12, color: Colors.white54)),
                        const SizedBox(height: 20),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            _card(context, Icons.videocam, 'CAMERA',
                              const Color(0xFFEF4444), () {
                              Navigator.push(context, MaterialPageRoute(
                                builder: (_) => const CameraScreen()));
                            }),
                            const SizedBox(width: 16),
                            _card(context, Icons.dashboard, 'DIRECTOR',
                              const Color(0xFF3B82F6), () {
                              Navigator.push(context, MaterialPageRoute(
                                builder: (_) => const DirectorScreen()));
                            }),
                            const SizedBox(width: 16),
                            _card(context, Icons.all_inclusive, 'BOTH',
                              const Color(0xFF8B5CF6), () {
                              Navigator.push(context, MaterialPageRoute(
                                builder: (_) => const DirectorScreen()));
                            }),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _card(BuildContext context, IconData icon, String title,
                Color color, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(12),
                child: Container(
                  width: 140,
                  height: 150,
                  decoration: BoxDecoration(
                    color: Colors.white10,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: color.withOpacity(0.5), width: 2),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 44, color: color),
                      const SizedBox(height: 10),
                      Text(title,
                        style: const TextStyle(fontSize: 14,
                          fontWeight: FontWeight.w900, letterSpacing: 2)),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Regen android + build
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          rm -f pubspec.lock
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'E'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          E

          cat > android/settings.gradle << 'E'
          pluginManagement {
              def fp = { def p = new Properties(); file("local.properties").withInputStream { p.load(it) }; return p.getProperty("flutter.sdk") }()
              includeBuild("$fp/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          E

          cat > android/build.gradle << 'E'
          ext { kotlin_version = "2.1.0" }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android {
                          if (compileSdkVersion == null) compileSdkVersion 34
                          if (defaultConfig != null) {
                              if (defaultConfig.targetSdkVersion == null) defaultConfig.targetSdkVersion 34
                              if (defaultConfig.minSdkVersion == null) defaultConfig.minSdkVersion 24
                          }
                      }
                  }
              }
          }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          E

          cat >> android/gradle.properties << 'E'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          E

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                    xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="true" />
              <application android:label="Mobile TV Studio"
                           android:name="${applicationName}"
                           android:icon="@mipmap/ic_launcher"
                           android:usesCleartextTraffic="true"
                           tools:replace="android:label">
                  <activity android:name=".MainActivity"
                            android:exported="true"
                            android:launchMode="singleTop"
                            android:theme="@style/LaunchTheme"
                            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                            android:hardwareAccelerated="true"
                            android:windowSoftInputMode="adjustResize"
                            android:screenOrientation="landscape">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme"
                                 android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          XML

          flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MobileTVStudio-android
          path: build/app/outputs/flutter-apk/app-release.apk
