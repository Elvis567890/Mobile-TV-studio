          import 'package:flutter/material.dart';
          import 'package:uuid/uuid.dart';
          import '../models/overlay_item.dart';
          import '../services/overlay_store.dart';
          import '../widgets/overlay_renderer.dart';

          class GraphicsEditor extends StatefulWidget {
            const GraphicsEditor({super.key});
            @override
            State<GraphicsEditor> createState() => _GraphicsEditorState();
          }

          class _GraphicsEditorState extends State<GraphicsEditor> {
            final _store = OverlayStore();
            List<OverlayItem> _items = [];
            String? _sel;
            final _swatches = [
              0xFFFFFFFF, 0xFFEF4444, 0xFFF5C542, 0xFF22C55E,
              0xFF3B82F6, 0xFF8B5CF6, 0xFFFF6B00, 0xFF00C2FF,
            ];

            @override
            void initState() { super.initState(); _load(); }

            Future<void> _load() async {
              final items = await _store.loadAll();
              if (mounted) setState(() => _items = items);
            }
            Future<void> _save() async {
              await _store.saveAll(_items);
              if (mounted) ScaffoldMessenger.of(context)
                .showSnackBar(const SnackBar(content: Text('Saved')));
            }
            Future<void> _addText() async {
              final ctrl = TextEditingController();
              final text = await showDialog<String>(context: context,
                builder: (ctx) {
                return AlertDialog(
                  backgroundColor: const Color(0xFF141418),
                  title: const Text('Add Text'),
                  content: TextField(controller: ctrl, autofocus: true,
                    style: const TextStyle(color: Colors.white)),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx),
                      child: const Text('CANCEL')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, ctrl.text),
                      child: const Text('ADD')),
                  ]);
              });
              if (text == null || text.isEmpty) return;
              setState(() => _items.add(OverlayItem(
                id: const Uuid().v4(), kind: OverlayKind.text,
                content: text, x: 0.5, y: 0.5)));
            }
            void _addLive() {
              setState(() => _items.add(OverlayItem(
                id: const Uuid().v4(), kind: OverlayKind.liveBadge,
                content: 'LIVE', x: 0.1, y: 0.15,
                size: 14, color: 0xFFEF4444)));
            }
            void _move(Offset d, Size box) {
              if (_sel == null) return;
              final item = _items.firstWhere((e) => e.id == _sel);
              setState(() {
                item.x = (item.x + d.dx / box.width).clamp(0.0, 1.0);
                item.y = (item.y + d.dy / box.height).clamp(0.0, 1.0);
              });
            }
            void _setColor(int c) {
              if (_sel == null) return;
              final item = _items.firstWhere((e) => e.id == _sel);
              setState(() => item.color = c);
            }

            List<Widget> _buildHandles(Size box) {
              return _items.map((it) => Positioned(
                left: it.x * box.width - 70,
                top: it.y * box.height - 20,
                child: GestureDetector(
                  onTap: () => setState(() => _sel = it.id),
                  child: Container(width: 140, height: 40,
                    decoration: BoxDecoration(border: Border.all(
                      color: _sel == it.id
                          ? const Color(0xFF3B82F6)
                          : Colors.transparent,
                      width: 2)))))).toList();
            }

            Widget _canvas() {
              return Padding(padding: const EdgeInsets.all(12),
                child: LayoutBuilder(builder: (context, cons) {
                  final box = Size(cons.maxWidth, cons.maxHeight);
                  return GestureDetector(
                    onPanUpdate: (d) => _move(d.delta, box),
                    child: Container(
                      decoration: BoxDecoration(color: Colors.black,
                        borderRadius: BorderRadius.circular(6),
                        border: Border.all(
                          color: const Color(0xFFF5C542), width: 1.5)),
                      child: Stack(children: [
                        const Center(child: Text('DRAG TO MOVE',
                          style: TextStyle(color: Colors.white24,
                            fontSize: 10, letterSpacing: 3))),
                        OverlayRenderer(overlays: _items),
                        ..._buildHandles(box),
                      ])));
                }));
            }

            Widget _swatchBar() {
              return Container(height: 44, color: const Color(0xFF141418),
                child: ListView(scrollDirection: Axis.horizontal,
                  children: _swatches.map((c) => GestureDetector(
                    onTap: () => _setColor(c),
                    child: Container(margin: const EdgeInsets.all(6),
                      width: 32, height: 32,
                      decoration: BoxDecoration(
                        color: Color(c), shape: BoxShape.circle,
                        border: Border.all(color: Colors.white24, width: 2))
                    ))).toList()));
            }

            Widget _list() {
              if (_items.isEmpty) {
                return const Center(child: Text('No overlays. Tap + to add.',
                  style: TextStyle(color: Colors.white54, fontSize: 12)));
              }
              return ListView.builder(itemCount: _items.length,
                itemBuilder: (_, i) {
                final it = _items[i];
                return ListTile(
                  selected: _sel == it.id,
                  selectedTileColor: Colors.white10,
                  title: Text(it.content,
                    style: const TextStyle(color: Colors.white)),
                  trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                    IconButton(icon: const Icon(
                      Icons.remove_circle_outline, color: Colors.white70),
                      onPressed: () => setState(() =>
                        it.size = (it.size - 4).clamp(6.0, 200.0))),
                    IconButton(icon: const Icon(
                      Icons.add_circle_outline, color: Colors.white70),
                      onPressed: () => setState(() =>
                        it.size = (it.size + 4).clamp(6.0, 200.0))),
                    IconButton(icon: const Icon(
                      Icons.delete_outline, color: Colors.redAccent),
                      onPressed: () => setState(() =>
                        _items.removeWhere((e) => e.id == it.id))),
                  ]),
                  onTap: () => setState(() => _sel = it.id));
              });
            }

            Widget _bottomBar() {
              return Container(height: 50, color: const Color(0xFF0A0A0F),
                padding: const EdgeInsets.symmetric(horizontal: 12),
                child: Row(children: [
                  FilledButton.icon(onPressed: _save,
                    icon: const Icon(Icons.save), label: const Text('SAVE')),
                  const Spacer(),
                  FilledButton.icon(onPressed: () => Navigator.pop(context),
                    icon: const Icon(Icons.check), label: const Text('DONE')),
                ]));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                appBar: AppBar(
                  title: const Text('GRAPHICS', style: TextStyle(
                    fontSize: 14, letterSpacing: 3,
                    fontWeight: FontWeight.w900)),
                  backgroundColor: const Color(0xFF141418),
                  actions: [
                    IconButton(icon: const Icon(Icons.add,
                      color: Colors.tealAccent), onPressed: _addText),
                    IconButton(icon: const Icon(Icons.fiber_manual_record,
                      color: Colors.redAccent), onPressed: _addLive),
                  ]),
                body: Column(children: [
                  Expanded(flex: 3, child: _canvas()),
                  if (_sel != null) _swatchBar(),
                  Expanded(flex: 2, child: _list()),
                  _bottomBar(),
                ]));
            }
          }
