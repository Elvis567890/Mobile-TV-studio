          cat > lib/services/youtube_auth.dart << 'D'
          import 'package:flutter/foundation.dart';
          import 'package:google_sign_in/google_sign_in.dart';
          import 'package:googleapis/youtube/v3.dart' as yt;
          import 'package:extension_google_sign_in_as_googleapis_auth/extension_google_sign_in_as_googleapis_auth.dart';
          class YouTubeAuth {
            static final _gs = GoogleSignIn(scopes: [
              'email', 'https://www.googleapis.com/auth/youtube',
              'https://www.googleapis.com/auth/youtube.force-ssl']);
            static Future<Map<String, String>?> signInAndCreateBroadcast() async {
              try {
                final user = await _gs.signIn();
                if (user == null) return null;
                final client = await _gs.authenticatedClient();
                if (client == null) return null;
                final ytApi = yt.YouTubeApi(client);
                final broadcast = yt.LiveBroadcast(
                  snippet: yt.LiveBroadcastSnippet(title: 'Mobile TV Studio Live',
                    scheduledStartTime: DateTime.now().toUtc().toIso8601String()),
                  status: yt.LiveBroadcastStatus(privacyStatus: 'public', selfDeclaredMadeForKids: false),
                  contentDetails: yt.LiveBroadcastContentDetails(enableAutoStart: true, enableAutoStop: true));
                final cb = await ytApi.liveBroadcasts.insert(broadcast, ['snippet', 'status', 'contentDetails']);
                final stream = yt.LiveStream(
                  snippet: yt.LiveStreamSnippet(title: 'Mobile TV Studio Stream'),
                  cdn: yt.CdnSettings(frameRate: '30fps', ingestionType: 'rtmp', resolution: '720p'));
                final cs = await ytApi.liveStreams.insert(stream, ['snippet', 'cdn', 'status']);
                await ytApi.liveBroadcasts.bind(cb.id!, ['id', 'contentDetails'], streamId: cs.id);
                final ing = cs.cdn?.ingestionInfo;
                if (ing == null) return null;
                return {
                  'displayName': user.displayName ?? 'YouTube',
                  'email': user.email,
                  'rtmpUrl': ing.ingestionAddress ?? '',
                  'streamKey': ing.streamName ?? '',
                };
              } catch (e) { debugPrint('YT: $e'); return null; }
            }
          }
