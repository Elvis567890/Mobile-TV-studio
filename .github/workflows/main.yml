build-web:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.24.0
        channel: stable
        cache: true

    - name: Strip mobile-only dependencies
      run: |
        python3 << 'PY'
        import re
        s = open('pubspec.yaml').read()
        s = re.sub(r'\n\s*mic_info:.*', '', s)
        s = re.sub(r'\n\s*webview_flutter:.*', '', s)
        s = re.sub(r'\n\s*google_sign_in:.*', '', s)
        s = re.sub(r'\n\s*googleapis:.*', '', s)
        s = re.sub(r'\n\s*googleapis_auth:.*', '', s)
        s = re.sub(r'\n\s*extension_google_sign_in_as_googleapis_auth:.*', '', s)
        open('pubspec.yaml','w').write(s)
        PY

    - name: Replace mobile-only files with web-safe stubs
      run: |
        # Audio input service: no mic_info on web
        cat > lib/services/audio_input_service.dart << 'D'
        import 'package:flutter/foundation.dart';
        class AudioInputDevice {
          final String id; final String name; final String type;
          AudioInputDevice({required this.id, required this.name, required this.type});
        }
        class AudioInputService extends ChangeNotifier {
          List<AudioInputDevice> _inputs = []; String? _selectedId;
          List<AudioInputDevice> get inputs => _inputs;
          String? get selectedId => _selectedId;
          Future<void> refresh() async {
            _inputs = [
              AudioInputDevice(id: 'default', name: 'Browser default', type: 'builtin'),
            ];
            notifyListeners();
          }
          Future<void> select(String id) async { _selectedId = id; notifyListeners(); }
        }
        D

        # Local recorder: no dart:io on web
        cat > lib/services/local_recorder.dart << 'D'
        import 'package:flutter/foundation.dart';
        class LocalRecorder extends ChangeNotifier {
          bool _recording = false; String? _currentPath;
          bool get recording => _recording;
          String? get currentPath => _currentPath;
          Future<String> prepare() async {
            _currentPath = 'browser://recording';
            return _currentPath!;
          }
          void markStarted() { _recording = true; notifyListeners(); }
          Future<String?> markStopped() async {
            _recording = false; notifyListeners(); return _currentPath;
          }
          Future<List<dynamic>> listRecordings() async => [];
          Future<void> deleteRecording(String path) async {}
        }
        D

        # Recordings screen: no dart:io on web
        cat > lib/screens/recordings_screen.dart << 'D'
        import 'package:flutter/material.dart';
        class RecordingsScreen extends StatelessWidget {
          const RecordingsScreen({super.key});
          @override
          Widget build(BuildContext context) => Scaffold(
            appBar: AppBar(title: const Text('RECORDINGS',
              style: TextStyle(fontSize: 14, letterSpacing: 3, fontWeight: FontWeight.w900)),
              backgroundColor: const Color(0xFF141418)),
            body: const Center(child: Padding(padding: EdgeInsets.all(24),
              child: Text('Local recording is available on Android only.\\n\\nOn the web version, the browser can download the stream.',
                textAlign: TextAlign.center,
                style: TextStyle(color: Colors.white54)))));
        }
        D

        # Overlay renderer: no dart:io on web, images skipped
        cat > lib/widgets/overlay_renderer.dart << 'D'
        import 'package:flutter/material.dart';
        import '../models/overlay_item.dart';
        class OverlayRenderer extends StatelessWidget {
          final List<OverlayItem> overlays;
          const OverlayRenderer({super.key, required this.overlays});
          @override
          Widget build(BuildContext context) => LayoutBuilder(
            builder: (context, cons) {
              final w = cons.maxWidth; final h = cons.maxHeight;
              return Stack(children: [
                for (final o in overlays)
                  if (o.kind != OverlayKind.image)
                    Positioned(
                      left: o.x * w - 60, top: o.y * h - 14,
                      child: _buildItem(o)),
              ]);
            });
          Widget _buildItem(OverlayItem o) {
            if (o.kind == OverlayKind.liveBadge) {
              return Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                decoration: BoxDecoration(color: Color(o.color),
                  borderRadius: BorderRadius.circular(4)),
                child: Row(mainAxisSize: MainAxisSize.min, children: [
                  Container(width: 8, height: 8, decoration: const BoxDecoration(
                    color: Colors.white, shape: BoxShape.circle)),
                  const SizedBox(width: 6),
                  Text(o.content, style: TextStyle(color: Colors.white,
                    fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 2))]));
            }
            if (o.bgBox) {
              return Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                decoration: BoxDecoration(color: Color(o.color),
                  borderRadius: BorderRadius.circular(4)),
                child: Text(o.content, style: TextStyle(color: Colors.white,
                  fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 1)));
            }
            return Text(o.content, style: TextStyle(color: Color(o.color),
              fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 1,
              shadows: const [Shadow(blurRadius: 4, color: Colors.black)]));
          }
        }
        D

        # Link account screen: no webview / google sign-in on web
        cat > lib/screens/link_account_screen.dart << 'D'
        import 'package:flutter/material.dart';
        import '../models/linked_account.dart';
        import '../services/account_store.dart';
        import '../services/platform_defaults.dart';
        class LinkAccountScreen extends StatefulWidget {
          final AccountPlatform platform; final AccountStore store;
          const LinkAccountScreen({super.key, required this.platform, required this.store});
          @override State<LinkAccountScreen> createState() => _LAS();
        }
        class _LAS extends State<LinkAccountScreen> {
          Future<void> _promptManualKey() async {
            final keyCtrl = TextEditingController();
            final nameCtrl = TextEditingController(text: PlatformDefaults.label(widget.platform));
            final ok = await showDialog<bool>(context: context,
              builder: (ctx) => AlertDialog(backgroundColor: const Color(0xFF141418),
                title: Text('Paste ${PlatformDefaults.label(widget.platform)} stream key'),
                content: SingleChildScrollView(child: Column(mainAxisSize: MainAxisSize.min, children: [
                  TextField(controller: nameCtrl, style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(labelText: 'Display name')),
                  const SizedBox(height: 8),
                  TextField(controller: keyCtrl, autofocus: true,
                    style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(labelText: 'Stream Key'))])),
                actions: [TextButton(onPressed: () => Navigator.pop(ctx, false),
                  child: const Text('CANCEL')),
                  FilledButton(onPressed: () => Navigator.pop(ctx, true),
                    child: const Text('LINK'))]));
            if (ok != true || keyCtrl.text.trim().isEmpty) return;
            await widget.store.link(platform: widget.platform,
              displayName: nameCtrl.text.trim(), streamKey: keyCtrl.text.trim(),
              rtmpUrl: PlatformDefaults.rtmp(widget.platform));
            if (!mounted) return;
            Navigator.pop(context);
          }
          @override Widget build(BuildContext context) => Scaffold(
            appBar: AppBar(title: Text('LINK ${PlatformDefaults.label(widget.platform).toUpperCase()}',
                style: const TextStyle(fontSize: 14, letterSpacing: 3, fontWeight: FontWeight.w900)),
              backgroundColor: const Color(0xFF141418)),
            body: Padding(padding: const EdgeInsets.all(24),
              child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
                Text(PlatformDefaults.helpText(widget.platform),
                  style: const TextStyle(color: Colors.white70, fontSize: 13)),
                const SizedBox(height: 20),
                OutlinedButton.icon(onPressed: _promptManualKey,
                  icon: const Icon(Icons.key), label: const Text('Paste stream key'),
                  style: OutlinedButton.styleFrom(minimumSize: const Size(0, 48))),
              ])));
        }
        class LinkAccountsGrid extends StatefulWidget {
          final AccountStore store;
          const LinkAccountsGrid({super.key, required this.store});
          @override State<LinkAccountsGrid> createState() => _LAG();
        }
        class _LAG extends State<LinkAccountsGrid> {
          @override void initState() { super.initState(); widget.store.load(); }
          Future<void> _link(AccountPlatform p) async {
            await Navigator.push(context, MaterialPageRoute(
              builder: (_) => LinkAccountScreen(platform: p, store: widget.store)));
            setState(() {});
          }
          @override Widget build(BuildContext context) => AnimatedBuilder(
            animation: widget.store, builder: (_, __) => GridView.count(
              padding: const EdgeInsets.all(16), crossAxisCount: 2,
              mainAxisSpacing: 12, crossAxisSpacing: 12, childAspectRatio: 1.5,
              children: AccountPlatform.values.map((p) {
                final linked = widget.store.forPlatform(p);
                return _PlatformButton(platform: p, linked: linked.isNotEmpty,
                  account: linked.isNotEmpty ? linked.first : null,
                  onTap: () => _link(p),
                  onUnlink: linked.isNotEmpty ? () async {
                    await widget.store.unlink(linked.first.id); setState(() {}); } : null);
              }).toList()));
        }
        class _PlatformButton extends StatelessWidget {
          final AccountPlatform platform; final bool linked;
          final LinkedAccount? account; final VoidCallback onTap; final VoidCallback? onUnlink;
          const _PlatformButton({required this.platform, required this.linked,
            this.account, required this.onTap, this.onUnlink});
          @override Widget build(BuildContext context) {
            final color = _colorFor(platform);
            return InkWell(onTap: onTap, borderRadius: BorderRadius.circular(12),
              child: Container(decoration: BoxDecoration(color: color.withOpacity(0.10),
                borderRadius: BorderRadius.circular(12),
                border: Border.all(color: linked ? color : Colors.white24, width: 2)),
                child: Padding(padding: const EdgeInsets.all(12),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start,
                    mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                      Row(children: [Icon(_iconFor(platform), color: color, size: 28),
                        const Spacer(),
                        if (linked) IconButton(icon: const Icon(Icons.close,
                          color: Colors.white54, size: 18), onPressed: onUnlink,
                          padding: EdgeInsets.zero, constraints: const BoxConstraints())]),
                      Text(PlatformDefaults.label(platform),
                        style: const TextStyle(color: Colors.white, fontSize: 14,
                          fontWeight: FontWeight.w900, letterSpacing: 1)),
                    ]))));
          }
          IconData _iconFor(AccountPlatform p) {
            switch (p) {
              case AccountPlatform.youtube: return Icons.play_circle_fill;
              case AccountPlatform.facebook: return Icons.facebook;
              case AccountPlatform.twitch: return Icons.videogame_asset;
              case AccountPlatform.tiktok: return Icons.music_note;
              case AccountPlatform.kick: return Icons.sports_esports;
              case AccountPlatform.trovo: return Icons.live_tv;
              case AccountPlatform.linkedin: return Icons.business;
              case AccountPlatform.x: return Icons.alternate_email;
            }
          }
          Color _colorFor(AccountPlatform p) {
            switch (p) {
              case AccountPlatform.youtube: return const Color(0xFFFF0000);
              case AccountPlatform.facebook: return const Color(0xFF1877F2);
              case AccountPlatform.twitch: return const Color(0xFF9146FF);
              case AccountPlatform.tiktok: return const Color(0xFF00F2EA);
              case AccountPlatform.kick: return const Color(0xFF53FC18);
              case AccountPlatform.trovo: return const Color(0xFF27DB8A);
              case AccountPlatform.linkedin: return const Color(0xFF0A66C2);
              case AccountPlatform.x: return const Color(0xFF1DA1F2);
            }
          }
        }
        D

        # YouTube auth: no google_sign_in on web (already removed from pubspec)
        cat > lib/services/youtube_auth.dart << 'D'
        import 'package:flutter/foundation.dart';
        class YouTubeAuth {
          static Future<Map<String, String>?> signInAndCreateBroadcast() async {
            debugPrint('YouTube sign-in not available on web');
            return null;
          }
        }
        D

    - name: Create web platform
      run: |
        rm -rf web
        flutter create --platforms=web .
        rm -f pubspec.lock

    - name: Install dependencies
      run: flutter pub get

    - name: Build web
      run: flutter build web --release --base-href /

    - name: Add GitHub Pages 404 fallback
      run: cp build/web/index.html build/web/404.html

    - uses: actions/upload-artifact@v4
      with:
        name: MobileTVStudio-web
        path: build/web/
