          class _StudioCanvasScreenState extends State<StudioCanvasScreen> {
            VideoPlayerController? _videoController;
            bool _isStreaming = false;
            bool _showCamera = true;
            int _countdown = 0;
            Timer? _countdownTimer;
            
            final TextEditingController _keyController = TextEditingController();
            final TextEditingController _centerTextController = TextEditingController(text: "BREAKING NEWS");
            final TextEditingController _tickerController = TextEditingController(text: "WELCOME TO ABRIMAX TV • LIVE 24/7 • ");
            
