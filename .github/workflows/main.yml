          import 'dart:io';
          import 'package:flutter/material.dart';
          import '../models/overlay_item.dart';
          class OverlayRenderer extends StatelessWidget {
            final List<OverlayItem> overlays;
            const OverlayRenderer({super.key, required this.overlays});
            @override
            Widget build(BuildContext context) => LayoutBuilder(
              builder: (context, cons) {
                final w = cons.maxWidth; final h = cons.maxHeight;
                return Stack(children: [
                  for (final o in overlays)
                    Positioned(
                      left: o.x * w - (o.kind == OverlayKind.image ? o.size : 60),
                      top: o.y * h - (o.kind == OverlayKind.image ? o.size : 14),
                      child: _AnimatedOverlay(key: ValueKey(o.id), item: o,
                        child: _buildItem(o))),
                ]);
              });
            Widget _buildItem(OverlayItem o) {
              if (o.kind == OverlayKind.image) {
                final f = File(o.content);
                if (!f.existsSync()) return const SizedBox.shrink();
                return SizedBox(width: o.size * 3, height: o.size * 3,
                  child: Image.file(f, fit: BoxFit.contain));
              }
              if (o.kind == OverlayKind.liveBadge) {
                return Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                  decoration: BoxDecoration(color: Color(o.color),
                    borderRadius: BorderRadius.circular(4)),
                  child: Row(mainAxisSize: MainAxisSize.min, children: [
                    Container(width: 8, height: 8, decoration: const BoxDecoration(
                      color: Colors.white, shape: BoxShape.circle)),
                    const SizedBox(width: 6),
                    Text(o.content, style: TextStyle(color: Colors.white,
                      fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 2))]));
              }
              if (o.bgBox) {
                return Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                  decoration: BoxDecoration(color: Color(o.color),
                    borderRadius: BorderRadius.circular(4)),
                  child: Text(o.content, style: TextStyle(color: Colors.white,
                    fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 1)));
              }
              return Text(o.content, style: TextStyle(color: Color(o.color),
                fontSize: o.size, fontWeight: FontWeight.w900, letterSpacing: 1,
                shadows: const [Shadow(blurRadius: 4, color: Colors.black)]));
            }
          }
          class _AnimatedOverlay extends StatefulWidget {
            final OverlayItem item; final Widget child;
            const _AnimatedOverlay({super.key, required this.item, required this.child});
            @override State<_AnimatedOverlay> createState() => _AOS();
          }
          class _AOS extends State<_AnimatedOverlay> {
            bool _visible = false;
            @override void initState() {
              super.initState();
              Future.delayed(const Duration(milliseconds: 50), () {
                if (mounted) setState(() => _visible = true); });
            }
            @override
            Widget build(BuildContext context) {
              switch (widget.item.transition) {
                case OverlayTransition.fade:
                  return AnimatedOpacity(opacity: _visible ? 1.0 : 0.0,
                    duration: const Duration(milliseconds: 400), child: widget.child);
                case OverlayTransition.slide:
                  return AnimatedSlide(offset: _visible ? Offset.zero : const Offset(-1, 0),
                    duration: const Duration(milliseconds: 400),
                    curve: Curves.easeOut, child: widget.child);
                case OverlayTransition.scale:
                  return AnimatedScale(scale: _visible ? 1.0 : 0.0,
                    duration: const Duration(milliseconds: 350),
                    curve: Curves.easeOutBack, child: widget.child);
                case OverlayTransition.none:
                  return widget.child;
              }
            }
          }
