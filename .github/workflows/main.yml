            Future<void> _rm(int i) async {
              if (_camCount <= 1) return;
              final ok = await showDialog<bool>(context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: _panel,
                  title: const Text('Remove camera?'),
                  content: Text('Remove CAM ${i + 1}?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false),
                      child: const Text('CANCEL')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('REMOVE')),
                  ]));
              if (ok != true) return;
              setState(() {
                _camCount--;
                if (!_live.sublist(0, _camCount).contains(true)
                    && _camCount > 0) { _live[0] = true; }
                if (!_prev.sublist(0, _camCount).contains(true)
                    && _camCount > 1) { _prev[1] = true; }
              });
            }
            Future<void> _pick() async {
              final c = await showModalBottomSheet<int>(
