name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: Reset pubspec
        run: |
          cat > pubspec.yaml << 'P'
          name: mobile_tv_studio
          publish_to: 'none'
          version: 0.1.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          P
          rm -f pubspec.lock

      - name: Regenerate android
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          rm -f pubspec.lock

      - name: Write modern settings.gradle
        run: |
          cat > android/settings.gradle << 'E'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          include ":app"
          E

      - name: Write modern build.gradle
        run: |
          cat > android/build.gradle << 'E'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          E

      - name: Write gradle.properties
        run: |
          cat > android/gradle.properties << 'E'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          android.nonFinalResIds=false
          E

      - name: Stub files with removed plugins
        run: |
          mkdir -p lib/transport lib/output lib/camera_mode lib/ads
          cat > lib/transport/bluetooth_transport.dart << 'S'
          import 'dart:typed_data';
          import 'video_transport.dart';
          class BluetoothTransport implements VideoTransport {
            BluetoothTransport({required this.remoteMac});
            final String remoteMac;
            @override String get name => 'Bluetooth';
            @override int get maxBitrateKbps => 600;
            @override TransportQuality get bestQuality => TransportQuality.low360p;
            @override bool get isRunning => false;
            @override void Function()? onLost;
            @override void Function()? onReady;
            void sendChunk(Uint8List c) {}
            @override Future<void> start() async => throw UnsupportedError('later');
            @override Future<void> stop() async {}
          }
          S
          cat > lib/output/rtmp_streamer.dart << 'S'
          import 'dart:async';
          import 'platform_targets.dart';
          enum StreamState { idle, connecting, live, error }
          class RtmpStreamer {
            RtmpStreamer({required this.target});
            final StreamTarget target;
            StreamState _s = StreamState.idle;
            StreamState get state => _s;
            final _c = StreamController<StreamState>.broadcast();
            Stream<StreamState> get stateStream => _c.stream;
            int _b = 0;
            int get bytesSent => _b;
            double get megabytesSent => _b / 1048576;
            DateTime? _t;
            Duration get uptime => _t == null ? Duration.zero : DateTime.now().difference(_t!);
            Future<void> start() async { _s = StreamState.live; _t = DateTime.now(); _c.add(_s); }
            void reportBytes(int n) => _b += n;
            Future<void> stop() async { _t = null; _s = StreamState.idle; _c.add(_s); }
            Future<void> dispose() async { await stop(); await _c.close(); }
          }
          S
          cat > lib/output/youtube_auth.dart << 'S'
          import 'linked_account.dart';
          class YoutubeAuth {
            static Future<LinkedAccount?> signIn() async => null;
            static Future<LinkedAccount?> createLiveBroadcast(LinkedAccount a) async => null;
          }
          S
          cat > lib/camera_mode/camera_preview.dart << 'S'
          import 'package:flutter/material.dart';
          class NativeCamera {
            static Future<List<Map<String, String>>> listCameras() async => [];
            static Future<bool> startPreview({required String cameraId, int width = 1280, int height = 720, int fps = 30}) async => false;
            static Future<void> stopPreview() async {}
          }
          class CameraPreview extends StatefulWidget {
            final String cameraId;
            const CameraPreview({super.key, required this.cameraId, int? width, int? height, int? fps, bool? active});
            @override State<CameraPreview> createState() => _CameraPreviewState();
          }
          class _CameraPreviewState extends State<CameraPreview> {
            @override
            Widget build(BuildContext context) => Container(color: Colors.black);
          }
          S
          cat > lib/ads/ad_player.dart << 'S'
          import 'package:flutter/material.dart';
          import 'ad_playlist.dart';
          class AdPlayer extends StatelessWidget {
            final AdClip clip;
            final VoidCallback onFinished;
            final bool loop;
            const AdPlayer({super.key, required this.clip, required this.onFinished, this.loop = false});
            @override
            Widget build(BuildContext context) => Container(
              color: Colors.black,
              child: Center(child: Text(clip.name, style: const TextStyle(color: Colors.white54, fontSize: 20))),
            );
          }
          S

      - name: Show generated files
        run: |
          echo "=== settings.gradle ===" && cat android/settings.gradle
          echo "" && echo "=== build.gradle ===" && cat android/build.gradle

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MobileTVStudio-release
          path: build/app/outputs/flutter-apk/app-release.apk
