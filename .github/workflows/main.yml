                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(children: [
                  Container(width: 7, height: 7, decoration: BoxDecoration(color: _onAir ? _red : Colors.grey, shape: BoxShape.circle)),
                  const SizedBox(width: 6),
                  Text(_onAir ? 'ON AIR' : 'OFFLINE', style: TextStyle(color: _onAir ? _red : Colors.grey, fontSize: 10, fontWeight: FontWeight.w900, letterSpacing: 2)),
                  const SizedBox(width: 10),
                  Container(padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 2), decoration: BoxDecoration(color: _blue.withOpacity(0.2), borderRadius: BorderRadius.circular(3)), child: Text('$_camCount CAMS', style: const TextStyle(color: _blue, fontSize: 8, fontWeight: FontWeight.w900, letterSpacing: 1))),
                  const Spacer(),
                  Text(_time, style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w700)),
                  const SizedBox(width: 10),
                  GestureDetector(onTap: () => setState(() => _menuOpen = !_menuOpen), child: const Icon(Icons.menu, color: Colors.white, size: 18)),
                ]));
            }
            Widget _strip() {
              final items = <Widget>[];
              for (var i = 0; i < _camCount; i++) {
                items.add(Expanded(child: _tile(i)));
              }
              items.add(SizedBox(width: 48, child: _addTile()));
              return Container(height: 64, color: _bg, padding: const EdgeInsets.symmetric(horizontal: 10), child: Row(children: items));
            }
            Widget _tile(int i) {
              final l = _live[i];
              final p = _prev[i];
              final bc = l ? _red : (p ? _yellow : _grey);
              final dc = l ? _red : (p ? _yellow : Colors.grey);
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(
                  onTap: () => _selPrev(i),
                  onDoubleTap: () => _setLive(i),
                  onLongPress: () => _rm(i),
                  child: Container(
                    decoration: BoxDecoration(color: Colors.black, border: Border.all(color: bc, width: (l || p) ? 2.0 : 1.0), borderRadius: BorderRadius.circular(3)),
                    child: Stack(children: [
                      _CameraStream(cameraNumber: i + 1, serverIp: _serverIp),
                      Positioned(top: 3, left: 3, child: Container(width: 5, height: 5, decoration: BoxDecoration(color: dc, shape: BoxShape.circle))),
                      if (l) Positioned(top: 3, right: 3, child: Container(padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1), decoration: BoxDecoration(color: _red, borderRadius: BorderRadius.circular(2)), child: const Text('LIVE', style: TextStyle(color: Colors.white, fontSize: 6, fontWeight: FontWeight.w900, letterSpacing: 1)))),
                      Positioned(left: 4, bottom: 3, child: Text('CAM ${i + 1}', style: const TextStyle(color: Colors.white, fontSize: 7, fontWeight: FontWeight.w900, letterSpacing: 1))),
                    ]))));
            }
            Widget _addTile() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(onTap: _add,
                  child: Container(
                    decoration: BoxDecoration(borderRadius: BorderRadius.circular(3), border: Border.all(color: Colors.tealAccent, width: 1)),
                    child: const Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                      Icon(Icons.add, color: Colors.tealAccent, size: 18),
                      SizedBox(height: 2),
                      Text('Add', style: TextStyle(color: Colors.tealAccent, fontSize: 7)),
                    ]))));
            }
            Widget _tabs() {
              return Container(height: 24, color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(children: [
                  _tabBtn('PROGRAM', 0),
                  const SizedBox(width: 20),
                  _tabBtn('MULTIVIEW', 1),
                ]));
            }
            Widget _tabBtn(String label, int idx) {
              final a = _tab == idx;
              return GestureDetector(onTap: () => setState(() => _tab = idx),
                child: Text(label, style: TextStyle(color: a ? Colors.white : Colors.white54, fontSize: 9, fontWeight: a ? FontWeight.w900 : FontWeight.w600, letterSpacing: 2)));
            }
            Widget _prog() {
              final pi = _prev.indexOf(true);
              final pn = pi >= 0 ? pi + 1 : 1;
              
              return Padding(
                padding: const EdgeInsets.fromLTRB(10, 2, 10, 2),
                child: Container(
                  decoration: BoxDecoration(color: Colors.black, border: Border.all(color: _yellow, width: 1.5), borderRadius: BorderRadius.circular(4)),
                  child: Stack(children: [
                    _CameraStream(cameraNumber: pn, serverIp: _serverIp),
                    Positioned(top: 6, left: 6, child: Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2), decoration: BoxDecoration(color: _red, borderRadius: BorderRadius.circular(2)), child: const Text('PROGRAM', style: TextStyle(color: Colors.white, fontSize: 8, fontWeight: FontWeight.w900, letterSpacing: 1.5)))),
                    if (_overlays.isNotEmpty) Positioned.fill(child: OverlayRenderer(overlays: _overlays)),
                    
                    Positioned(right: 8, bottom: 8,
                      width: 200, height: 112,
                      child: Container(
                        decoration: BoxDecoration(color: Colors.black, border: Border.all(color: _yellow, width: 1.5), borderRadius: BorderRadius.circular(3)),
                        child: Stack(children: [
                          _CameraStream(cameraNumber: pn, serverIp: _serverIp),
                          Positioned(top: 3, left: 3, child: Container(padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1), decoration: BoxDecoration(color: _yellow, borderRadius: BorderRadius.circular(2)), child: const Text('PREVIEW', style: TextStyle(color: Colors.black, fontSize: 6, fontWeight: FontWeight.w900, letterSpacing: 1)))),
                        ]))),
                  ])));
            }
            Widget _grid() {
              int c;
              if (_camCount <= 4) c = 2;
              else if (_camCount <= 9) c = 3;
              else if (_camCount <= 12) c = 4;
              else c = 5;
              return Padding(padding: const EdgeInsets.all(10),
                child: GridView.builder(itemCount: _camCount,
                  gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: c, mainAxisSpacing: 6, crossAxisSpacing: 6, childAspectRatio: 16 / 9),
                  itemBuilder: (_, i) {
                    final l = _live[i];
                    final p = _prev[i];
                    final bc = l ? _red : (p ? _yellow : _grey);
                    return GestureDetector(onTap: () => _selPrev(i), onLongPress: () => _rm(i),
                      child: Container(
                        decoration: BoxDecoration(color: Colors.black, border: Border.all(color: bc, width: 1.5), borderRadius: BorderRadius.circular(3)),
                        child: Stack(children: [
                           _CameraStream(cameraNumber: i + 1, serverIp: _serverIp),
                           Positioned(bottom: 4, left: 4, child: Text('CAM ${i + 1}', style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w800, letterSpacing: 2))),
                        ])));
                  }));
            }
            Widget _bar() {
              return Container(height: 48, color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(children: [
                  GestureDetector(onTap: () => setState(() => _onAir = !_onAir),
                    child: Container(height: 36, padding: const EdgeInsets.symmetric(horizontal: 14), decoration: BoxDecoration(color: _onAir ? _red : const Color(0xFF1E293B), borderRadius: BorderRadius.circular(5)),
                      child: Row(children: [
                        Icon(_onAir ? Icons.stop_circle : Icons.podcasts, color: Colors.white, size: 16),
                        const SizedBox(width: 6),
                        Text(_onAir ? 'END STREAM' : 'GO LIVE', style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w900, letterSpacing: 1.2)),
                      ]))),
                  const SizedBox(width: 8),
                  GestureDetector(onTap: () => setState(() => _showLiveCamera = !_showLiveCamera),
                    child: Container(height: 36, padding: const EdgeInsets.symmetric(horizontal: 10), decoration: BoxDecoration(color: _showLiveCamera ? _blue.withOpacity(0.3) : Colors.white10, borderRadius: BorderRadius.circular(5), border: Border.all(color: _showLiveCamera ? _blue : Colors.white24)),
                      child: Row(children: [
                        Icon(_showLiveCamera ? Icons.videocam : Icons.videocam_off, color: _showLiveCamera ? _blue : Colors.white54, size: 14),
                        const SizedBox(width: 4),
                        Text('LIVE CAM', style: TextStyle(color: _showLiveCamera ? _blue : Colors.white54, fontSize: 9, fontWeight: FontWeight.w900, letterSpacing: 1)),
                      ]))),
                  const Spacer(),
                  GestureDetector(onTap: _take,
                    child: Container(height: 36, padding: const EdgeInsets.symmetric(horizontal: 20), decoration: BoxDecoration(color: _red, borderRadius: BorderRadius.circular(5)),
                      child: const Row(children: [
                        Icon(Icons.fiber_manual_record, color: Colors.white, size: 10),
                        SizedBox(width: 6),
                        Text('TAKE', style: TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w900, letterSpacing: 2.5)),
                      ]))),
                ]));
            }
            Widget _menu() {
              return Positioned(top: 0, right: 0, bottom: 0,
                child: Container(width: 220, color: _bg,
                  child: Column(children: [
                    Container(height: 40, padding: const EdgeInsets.symmetric(horizontal: 12), decoration: const BoxDecoration(border: Border(bottom: BorderSide(color: _grey))),
                      child: Row(children: [
                        const Text('Menu', style: TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w800)),
                        const Spacer(),
                        GestureDetector(onTap: () => setState(() => _menuOpen = false), child: const Icon(Icons.close, color: Colors.white, size: 16)),
                      ])),
                    _mi(Icons.dns, 'Server IP ($_serverIp)', _editServer),
                    _mi(Icons.grid_view, 'Camera Count', () { setState(() => _menuOpen = false); _pick(); }),
                    _mi(Icons.add, 'Add Camera', () { setState(() => _menuOpen = false); _add(); }),
                    _mi(Icons.layers, 'Graphics', _openG, teal: true),
                    _mi(Icons.link, 'Link Accounts', _openA),
                    _mi(Icons.movie, 'Studio Canvas (Video + Cam)', _openStudioCanvas, teal: true),
                    _mi(Icons.settings, 'Stream Settings (Key/Logos)', () { setState(() => _menuOpen = false); _openStreamSettings(); }),
                    _mi(Icons.power_settings_new, 'Add to TV Schedule', _startAutomatedBroadcast, teal: true),
                    _mi(Icons.schedule, 'Schedule at Exact Time', () { setState(() => _menuOpen = false); _scheduleTimedVideo(); }, teal: true),
                  ])));
            }
            Widget _mi(IconData icon, String label, VoidCallback onTap, {bool teal = false}) {
              return InkWell(onTap: onTap,
                child: SizedBox(height: 38,
                  child: Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 12),
                    child: Row(children: [
                      Icon(icon, color: teal ? Colors.tealAccent : Colors.white70, size: 16),
                      const SizedBox(width: 10),
                      Expanded(child: Text(label, style: TextStyle(color: teal ? Colors.tealAccent : Colors.white, fontSize: 11, fontWeight: FontWeight.w600), overflow: TextOverflow.ellipsis)),
                    ]))));
            }
          }

          class _CameraStream extends StatefulWidget {
            final int cameraNumber;
            final String serverIp;
            
            const _CameraStream({required this.cameraNumber, required this.serverIp});

            @override
            State<_CameraStream> createState() => _CameraStreamState();
          }

          class _CameraStreamState extends State<_CameraStream> {
            VideoPlayerController? _controller;
            bool _hasError = false;

            @override
            void initState() {
              super.initState();
              _initPlayer();
            }

            Future<void> _initPlayer() async {
              final url = Uri.parse("http://${widget.serverIp}:8888/cam${widget.cameraNumber}/index.m3u8");
              _controller = VideoPlayerController.networkUrl(url);
              try {
                await _controller!.initialize();
                _controller!.setLooping(true);
                _controller!.setVolume(0);
                _controller!.play();
                if (mounted) setState(() {});
              } catch (e) {
                if (mounted) setState(() => _hasError = true);
              }
            }

            @override
            void dispose() {
              _controller?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (_hasError) {
                return const Center(child: Text('OFFLINE', style: TextStyle(color: Colors.white24, fontSize: 10)));
              }
              if (_controller == null || !_controller!.value.isInitialized) {
                return const Center(child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white24));
              }
              return SizedBox.expand(
                child: FittedBox(
                  fit: BoxFit.cover,
                  child: SizedBox(
                    width: _controller!.value.size.width,
                    height: _controller!.value.size.height,
                    child: VideoPlayer(_controller!),
                  ),
                ),
              );
            }
          }
          D

      - name: Configure Android
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'E'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip
          E

          cat > android/settings.gradle << 'E'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "9.0.1" apply false
              id "org.jetbrains.kotlin.android" version "2.3.20" apply false
          }
          include ":app"
          E

          cat > android/build.gradle << 'E'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.buildDir = "../build"
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") ||
                      project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 37
                          buildToolsVersion "37.0.0"
                      }
                  }
              }
          }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          E

          cat > android/app/build.gradle << 'E'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.yourcompany.mobile_tv_studio"
              compileSdk 37
              ndkVersion "26.1.10909125"
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId "com.yourcompany.mobile_tv_studio"
                  minSdk 24
                  targetSdk 37
                  versionCode 1
                  versionName "1.0"
              }
              packagingOptions {
                  exclude 'project.clj'
                  exclude 'META-INF/proguard/*'
                  exclude 'META-INF/*.kotlin_module'
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source = '../..' }
          E

          cat >> android/gradle.properties << 'E'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          E

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                    xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="true" />
              <application android:label="abrimax"
                           android:name="${applicationName}"
                           android:icon="@mipmap/ic_launcher"
                           android:usesCleartextTraffic="true"
                           tools:replace="android:label">
                  <activity android:name=".MainActivity"
                            android:exported="true"
                            android:launchMode="singleTop"
                            android:theme="@style/LaunchTheme"
                            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                            android:hardwareAccelerated="true"
                            android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme"
                                 android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          XML

      - name: Build APK
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: abrimax-android
          path: build/app/outputs/flutter-apk/app-release.apk
