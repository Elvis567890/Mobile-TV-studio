name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.0', channel: stable, cache: true}

      # ─────────────────────────────────────────────────────────────
      # 1) Generate project scaffolding FIRST
      # ─────────────────────────────────────────────────────────────
      - name: Flutter create
        run: |
          rm -rf lib test android build .dart_tool pubspec.lock pubspec.yaml
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .

      # ─────────────────────────────────────────────────────────────
      # 2) Overwrite pubspec + generate launcher icon
      # ─────────────────────────────────────────────────────────────
      - name: Setup pubspec and icon
        run: |
          mkdir -p lib/screens lib/widgets lib/models lib/services assets/icon
          pip install Pillow > /dev/null 2>&1
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024,1024), (10,10,15,255))
          d = ImageDraw.Draw(img)
          d.ellipse((232,140,792,700), fill=(239,68,68,255))
          d.ellipse((312,220,712,620), fill=(10,10,15,255))
          d.polygon([(442,330),(442,510),(612,420)], fill=(255,255,255,255))
          try:
              f1 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 100)
              f2 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 68)
          except Exception:
              f1 = f2 = ImageFont.load_default()
          d.text((512,800),'ABRIMAX',fill=(255,255,255,255),anchor='mm',font=f1)
          d.text((512,900),'STUDIO',fill=(239,68,68,255),anchor='mm',font=f2)
          img.save('assets/icon/app_icon.png')
          PY

          cat > pubspec.yaml << 'P'
          name: mobile_tv_studio
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            camera: ^0.11.0+2
            shared_preferences: ^2.3.2
            uuid: ^4.5.0
            flutter_webrtc: ^0.12.5
            rtmp_broadcaster: ^2.3.4
            mic_info: ^0.0.5
            permission_handler: ^11.3.1
            wakelock_plus: ^1.2.8
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.1
          flutter:
            uses-material-design: true
            assets:
              - assets/icon/
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            adaptive_icon_background: "#0A0A0F"
            adaptive_icon_foreground: "assets/icon/app_icon.png"
          flutter_native_splash:
            android: true
            ios: false
            web: false
            color: "#0A0A0F"
            image: "assets/icon/app_icon.png"
            android_12:
              color: "#0A0A0F"
              image: "assets/icon/app_icon.png"
          dependency_overrides:
            package_info_plus: ^8.0.0
          P

      # ─────────────────────────────────────────────────────────────
      # 3) Write all Dart sources
      # ─────────────────────────────────────────────────────────────
      - name: Write Dart files
        run: |
          # ─── lib/main.dart ───
          cat > lib/main.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'screens/role_chooser.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            await [
              Permission.camera,
              Permission.microphone,
              Permission.notification,
            ].request();
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'abrimax',
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0A0A0F),
                ),
                home: const RoleChooser(),
              );
            }
          }
          D

          # ─── lib/models/overlay_item.dart ───
          cat > lib/models/overlay_item.dart << 'D'
          enum OverlayKind { text, liveBadge }
          class OverlayItem {
            final String id;
            final OverlayKind kind;
            final String content;
            double x;
            double y;
            double size;
            int color;
            OverlayItem({
              required this.id, required this.kind, required this.content,
              required this.x, required this.y, this.size = 20,
              this.color = 0xFFFFFFFF,
            });
            Map<String, dynamic> toJson() => {
              'id': id, 'kind': kind.name, 'content': content,
              'x': x, 'y': y, 'size': size, 'color': color,
            };
            factory OverlayItem.fromJson(Map<String, dynamic> j) => OverlayItem(
              id: j['id'],
              kind: OverlayKind.values.firstWhere(
                (k) => k.name == j['kind'],
                orElse: () => OverlayKind.text,
              ),
              content: j['content'],
              x: (j['x'] as num).toDouble(),
              y: (j['y'] as num).toDouble(),
              size: (j['size'] as num).toDouble(),
              color: j['color'] ?? 0xFFFFFFFF,
            );
          }
          D

          # ─── lib/models/account_item.dart ───
          cat > lib/models/account_item.dart << 'D'
          class AccountItem {
            final String id;
            final String platform;
            final String name;
            final String streamKey;
            final String rtmpUrl;
            AccountItem({
              required this.id, required this.platform, required this.name,
              required this.streamKey, required this.rtmpUrl,
            });
            Map<String, dynamic> toJson() => {
              'id': id, 'platform': platform, 'name': name,
              'streamKey': streamKey, 'rtmpUrl': rtmpUrl,
            };
            factory AccountItem.fromJson(Map<String, dynamic> j) => AccountItem(
              id: j['id'], platform: j['platform'], name: j['name'],
              streamKey: j['streamKey'], rtmpUrl: j['rtmpUrl'],
            );
          }
          D

          # ─── lib/services/overlay_store.dart ───
          cat > lib/services/overlay_store.dart << 'D'
          import 'dart:convert';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/overlay_item.dart';
          class OverlayStore {
            static const _key = 'overlays_v1';
            Future<List<OverlayItem>> loadAll() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString(_key);
              if (raw == null || raw.isEmpty) return [];
              try {
                return (jsonDecode(raw) as List)
                    .map((e) => OverlayItem.fromJson(e)).toList();
              } catch (_) { return []; }
            }
            Future<void> saveAll(List<OverlayItem> items) async {
              final p = await SharedPreferences.getInstance();
              await p.setString(_key,
                  jsonEncode(items.map((e) => e.toJson()).toList()));
            }
          }
          D

          # ─── lib/services/account_store.dart ───
          cat > lib/services/account_store.dart << 'D'
          import 'dart:convert';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../models/account_item.dart';
          class AccountStore {
            static const _key = 'accounts_v1';
            Future<List<AccountItem>> loadAll() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString(_key);
              if (raw == null || raw.isEmpty) return [];
              try {
                return (jsonDecode(raw) as List)
                    .map((e) => AccountItem.fromJson(e)).toList();
              } catch (_) { return []; }
            }
            Future<void> saveAll(List<AccountItem> items) async {
              final p = await SharedPreferences.getInstance();
              await p.setString(_key,
                  jsonEncode(items.map((e) => e.toJson()).toList()));
            }
          }
          D

          # ─── lib/services/streaming_service.dart ───
          cat > lib/services/streaming_service.dart << 'D'
          import 'package:rtmp_broadcaster/camera.dart';
          import 'package:mic_info/mic_info.dart';

          class StreamingService {
            static CameraController? _controller;
            static bool _isStreaming = false;
            static bool _isRecording = false;
            static bool _isMicMuted = false;

            static CameraController? get controller => _controller;
            static bool get isStreaming => _isStreaming;
            static bool get isRecording => _isRecording;
            static bool get isMicMuted => _isMicMuted;

            static Future<CameraController?> initialize({bool front = false}) async {
              final cams = await availableCameras();
              if (cams.isEmpty) return null;
              final lens = front
                  ? CameraLensDirection.front
                  : CameraLensDirection.back;
              final cam = cams.firstWhere(
                (c) => c.lensDirection == lens,
                orElse: () => cams.first,
              );
              _controller = CameraController(
                cam,
                ResolutionPreset.high,
                enableAudio: true,
              );
              await _controller!.initialize();
              return _controller;
            }

            static Future<List<String>> detectUsbMics() async {
              try {
                final mics = await MicInfo.getWiredMicrophones();
                return mics.map((m) => m.productName).toList();
              } catch (_) {
                return [];
              }
            }

            static Future<void> startStream({
              required String rtmpUrl,
              required String streamKey,
              int bitrate = 2500 * 1024,
            }) async {
              if (_controller == null) return;
              final url = '$rtmpUrl/$streamKey';
              await _controller!.startVideoStreaming(
                url,
                bitrate: bitrate,
                androidUseOpenGL: false,
              );
              _isStreaming = true;
            }

            static Future<void> stopStream() async {
              if (_controller == null) return;
              await _controller!.stopEverything();
              _isStreaming = false;
            }

            static Future<void> startRecording(String path) async {
              if (_controller == null) return;
              await _controller!.startVideoRecording(path);
              _isRecording = true;
            }

            static Future<void> stopRecording() async {
              if (_controller == null) return;
              await _controller!.stopVideoRecording();
              _isRecording = false;
            }

            static Future<void> switchCamera() async {
              final cams = await availableCameras();
              if (cams.isEmpty) return;
              final current = _controller?.description.lensDirection
                  ?? CameraLensDirection.back;
              final target = current == CameraLensDirection.back
                  ? CameraLensDirection.front
                  : CameraLensDirection.back;
              final cam = cams.firstWhere(
                (c) => c.lensDirection == target,
                orElse: () => cams.first,
              );
              await _controller?.dispose();
              _controller = CameraController(
                cam,
                ResolutionPreset.high,
                enableAudio: !_isMicMuted,
              );
              await _controller!.initialize();
            }

            static Future<void> muteMic(bool muted) async {
              if (_controller == null) return;
              final cam = _controller!.description;
              await _controller!.dispose();
              _controller = CameraController(
                cam,
                ResolutionPreset.high,
                enableAudio: !muted,
              );
              await _controller!.initialize();
              _isMicMuted = muted;
            }

            static Future<void> dispose() async {
              await _controller?.dispose();
              _controller = null;
              _isStreaming = false;
              _isRecording = false;
              _isMicMuted = false;
            }
          }
          D

          # ─── lib/widgets/overlay_renderer.dart ───
          cat > lib/widgets/overlay_renderer.dart << 'D'
          import 'package:flutter/material.dart';
          import '../models/overlay_item.dart';
          class OverlayRenderer extends StatelessWidget {
            final List<OverlayItem> overlays;
            const OverlayRenderer({super.key, required this.overlays});
            @override
            Widget build(BuildContext context) {
              return LayoutBuilder(builder: (context, cons) {
                final w = cons.maxWidth;
                final h = cons.maxHeight;
                return Stack(children: overlays.map((o) {
                  return Positioned(
                    left: o.x * w - 60,
                    top: o.y * h - 14,
                    child: _item(o),
                  );
                }).toList());
              });
            }
            Widget _item(OverlayItem o) {
              if (o.kind == OverlayKind.liveBadge) {
                return Container(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                  decoration: BoxDecoration(
                    color: Color(o.color),
                    borderRadius: BorderRadius.circular(4),
                  ),
                  child: Row(mainAxisSize: MainAxisSize.min, children: [
                    Container(width: 8, height: 8,
                      decoration: const BoxDecoration(
                        color: Colors.white, shape: BoxShape.circle)),
                    const SizedBox(width: 6),
                    Text(o.content, style: TextStyle(
                      color: Colors.white, fontSize: o.size,
                      fontWeight: FontWeight.w900, letterSpacing: 2)),
                  ]),
                );
              }
              return Text(o.content, style: TextStyle(
                color: Color(o.color), fontSize: o.size,
                fontWeight: FontWeight.w900, letterSpacing: 1,
                shadows: const [Shadow(blurRadius: 4, color: Colors.black)]));
            }
          }
          D

          # ─── lib/widgets/live_camera.dart ───
          cat > lib/widgets/live_camera.dart << 'D'
          import 'package:rtmp_broadcaster/camera.dart';
          import 'package:flutter/material.dart';
          class LiveCamera extends StatefulWidget {
            final bool front;
            const LiveCamera({super.key, this.front = false});
            @override
            State<LiveCamera> createState() => _LiveCameraState();
          }
          class _LiveCameraState extends State<LiveCamera> {
            CameraController? _ctrl;
            bool _ready = false;
            String? _error;
            @override
            void initState() { super.initState(); _init(); }
            Future<void> _init() async {
              try {
                final cams = await availableCameras();
                if (cams.isEmpty) { setState(() => _error = 'No cameras'); return; }
                final lens = widget.front
                    ? CameraLensDirection.front : CameraLensDirection.back;
                final cam = cams.firstWhere((c) => c.lensDirection == lens,
                    orElse: () => cams.first);
                _ctrl = CameraController(cam, ResolutionPreset.high,
                    enableAudio: true);
                await _ctrl!.initialize();
                if (mounted) setState(() => _ready = true);
              } catch (e) {
                if (mounted) setState(() => _error = e.toString());
              }
            }
            @override
            void didUpdateWidget(covariant LiveCamera old) {
              super.didUpdateWidget(old);
              if (old.front != widget.front) {
                _ctrl?.dispose(); _ready = false; _init();
              }
            }
            @override
            void dispose() { _ctrl?.dispose(); super.dispose(); }
            @override
            Widget build(BuildContext context) {
              if (_error != null) {
                return Container(color: Colors.black, child: Center(child: Text(
                  _error!,
                  style: const TextStyle(color: Colors.redAccent, fontSize: 11))));
              }
              if (!_ready || _ctrl == null) {
                return Container(color: Colors.black, child: const Center(
                  child: CircularProgressIndicator(color: Colors.redAccent)));
              }
              final isFront =
                  _ctrl!.description.lensDirection == CameraLensDirection.front;
              return RotatedBox(quarterTurns: isFront ? 3 : 1,
                  child: CameraPreview(_ctrl!));
            }
          }
          D

          # ─── lib/screens/role_chooser.dart ───
          cat > lib/screens/role_chooser.dart << 'D'
          import 'package:flutter/material.dart';
          import 'director_screen.dart';
          import 'camera_screen.dart';
          class RoleChooser extends StatelessWidget {
            const RoleChooser({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                body: SafeArea(child: SingleChildScrollView(
                  padding: const EdgeInsets.symmetric(
                    horizontal: 24, vertical: 16),
                  child: Column(children: [
                    const SizedBox(height: 20),
                    const Text('ABRIMAX STUDIO', style: TextStyle(
                      fontSize: 24, fontWeight: FontWeight.w900,
                      letterSpacing: 4)),
                    const SizedBox(height: 4),
                    const Text('What is this phone?',
                      style: TextStyle(fontSize: 12, color: Colors.white54)),
                    const SizedBox(height: 20),
                    Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                      _card(context, Icons.videocam, 'CAMERA',
                        const Color(0xFFEF4444),
                        () => Navigator.push(context, MaterialPageRoute(
                          builder: (_) => const CameraScreen()))),
                      const SizedBox(width: 16),
                      _card(context, Icons.dashboard, 'DIRECTOR',
                        const Color(0xFF3B82F6),
                        () => Navigator.push(context, MaterialPageRoute(
                          builder: (_) => const DirectorScreen()))),
                      const SizedBox(width: 16),
                      _card(context, Icons.all_inclusive, 'BOTH',
                        const Color(0xFF8B5CF6),
                        () => Navigator.push(context, MaterialPageRoute(
                          builder: (_) => const DirectorScreen()))),
                    ]),
                  ]),
                )),
              );
            }
            Widget _card(BuildContext context, IconData icon, String title,
                Color color, VoidCallback onTap) {
              return InkWell(onTap: onTap,
                borderRadius: BorderRadius.circular(12),
                child: Container(width: 140, height: 150,
                  decoration: BoxDecoration(color: Colors.white10,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(
                      color: color.withOpacity(0.5), width: 2)),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 44, color: color),
                      const SizedBox(height: 10),
                      Text(title, style: const TextStyle(
                        fontSize: 14, fontWeight: FontWeight.w900,
                        letterSpacing: 2)),
                    ])));
            }
          }
          D

          # ─── lib/screens/camera_screen.dart ───
          cat > lib/screens/camera_screen.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:rtmp_broadcaster/camera.dart';
          import '../services/streaming_service.dart';
          import '../services/account_store.dart';

          class CameraScreen extends StatefulWidget {
            const CameraScreen({super.key});
            @override
            State<CameraScreen> createState() => _CameraScreenState();
          }

          class _CameraScreenState extends State<CameraScreen> {
            bool _live = false;
            bool _recording = false;
            bool _micMuted = false;
            bool _front = false;
            String _quality = '720p';
            int _fps = 30;
            String _status = 'READY';
            List<String> _usbMics = [];
            CameraController? _cam;

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              _cam = await StreamingService.initialize(front: _front);
              final mics = await StreamingService.detectUsbMics();
              if (mounted) setState(() => _usbMics = mics);
            }

            void _cycleQ() {
              setState(() {
                if (_quality == '720p') _quality = '480p';
                else if (_quality == '480p') _quality = '360p';
                else _quality = '720p';
              });
            }

            void _cycleF() {
              setState(() {
                final o = [24, 25, 30, 35, 60];
                _fps = o[(o.indexOf(_fps) + 1) % o.length];
              });
            }

            Future<void> _toggleLive() async {
              if (_live) {
                await StreamingService.stopStream();
                if (mounted) setState(() { _live = false; _status = 'STOPPED'; });
                return;
              }
              final store = AccountStore();
              final accounts = await store.loadAll();
              if (accounts.isEmpty) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text(
                      'Link an account first (Director > Menu > Link Accounts)')));
                }
                return;
              }
              final acct = accounts.first;
              if (mounted) setState(() => _status = 'CONNECTING...');
              try {
                await StreamingService.startStream(
                  rtmpUrl: acct.rtmpUrl,
                  streamKey: acct.streamKey,
                );
                if (mounted) setState(() { _live = true; _status = 'LIVE'; });
              } catch (e) {
                if (mounted) setState(() => _status = 'ERROR');
              }
            }

            Future<void> _toggleRecord() async {
              if (_recording) {
                await StreamingService.stopRecording();
                if (mounted) setState(() {
                  _recording = false; _status = 'RECORDING SAVED';
                });
                return;
              }
              final path = '/storage/emulated/0/Movies/abrimax_'
                  '${DateTime.now().millisecondsSinceEpoch}.mp4';
              await StreamingService.startRecording(path);
              if (mounted) setState(() {
                _recording = true; _status = 'RECORDING';
              });
            }

            @override
            void dispose() {
              StreamingService.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final isReady =
                  _cam != null && (_cam!.value.isInitialized ?? false);
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                appBar: AppBar(
                  title: const Text('CAMERA NODE', style: TextStyle(
                    fontSize: 14, letterSpacing: 3,
                    fontWeight: FontWeight.w900)),
                  backgroundColor: const Color(0xFF141418),
                  actions: [
                    Padding(
                      padding: const EdgeInsets.only(right: 12),
                      child: Center(child: Text(
                        _status,
                        style: TextStyle(
                          color: _live ? Colors.green
                              : (_recording ? Colors.orange : Colors.grey),
                          fontSize: 10, fontWeight: FontWeight.w800,
                          letterSpacing: 1,
                        ),
                      )),
                    ),
                  ],
                ),
                body: Row(children: [
                  Expanded(child: Container(
                    margin: const EdgeInsets.all(10),
                    decoration: BoxDecoration(color: Colors.black,
                      borderRadius: BorderRadius.circular(8),
                      border: Border.all(
                        color: _live ? Colors.red : Colors.white24,
                        width: _live ? 3 : 1)),
                    child: ClipRRect(
                      borderRadius: BorderRadius.circular(6),
                      child: isReady
                          ? CameraPreview(_cam!)
                          : const Center(child: CircularProgressIndicator(
                              color: Colors.redAccent)),
                    ),
                  )),
                  Container(width: 160, color: const Color(0xFF141418),
                    padding: const EdgeInsets.all(8),
                    child: SingleChildScrollView(child: Column(children: [
                      if (_usbMics.isNotEmpty)
                        Container(
                          margin: const EdgeInsets.only(bottom: 8),
                          padding: const EdgeInsets.all(6),
                          decoration: BoxDecoration(
                            color: Colors.teal.withOpacity(0.15),
                            borderRadius: BorderRadius.circular(6),
                            border: Border.all(
                              color: Colors.tealAccent.withOpacity(0.4)),
                          ),
                          child: Row(children: [
                            const Icon(Icons.usb,
                              color: Colors.tealAccent, size: 14),
                            const SizedBox(width: 4),
                            Expanded(child: Text(
                              _usbMics.first,
                              style: const TextStyle(
                                color: Colors.tealAccent, fontSize: 8),
                              overflow: TextOverflow.ellipsis,
                            )),
                          ]),
                        ),
                      _btn(_live ? Icons.stop : Icons.play_arrow,
                        _live ? 'STOP' : 'GO LIVE',
                        _live ? Colors.red : Colors.green, 78, _toggleLive),
                      const SizedBox(height: 8),
                      _btn(_recording ? Icons.stop : Icons.fiber_manual_record,
                        _recording ? 'STOP REC' : 'RECORD',
                        _recording ? Colors.red : Colors.orangeAccent, 64,
                        _toggleRecord),
                      const SizedBox(height: 8),
                      _btn(Icons.high_quality, _quality, Colors.blue, 64,
                        _cycleQ),
                      const SizedBox(height: 8),
                      _btn(Icons.speed, '$_fps FPS', Colors.tealAccent, 64,
                        _cycleF),
                      const SizedBox(height: 8),
                      _btn(_micMuted ? Icons.mic_off : Icons.mic,
                        _micMuted ? 'MUTED' : 'MIC ON',
                        _micMuted ? Colors.redAccent : Colors.greenAccent, 64,
                        () async {
                          await StreamingService.muteMic(!_micMuted);
                          _cam = StreamingService.controller;
                          if (mounted) setState(() => _micMuted = !_micMuted);
                        }),
                      const SizedBox(height: 8),
                      _btn(Icons.flip_camera_android, 'SWITCH',
                        Colors.purpleAccent, 64, () async {
                          await StreamingService.switchCamera();
                          _cam = StreamingService.controller;
