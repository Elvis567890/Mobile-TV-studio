      - name: Write MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/yourcompany/studio
          cat > android/app/src/main/kotlin/com/yourcompany/studio/MainActivity.kt << 'K'
          package com.yourcompany.studio

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.os.Build
          import androidx.annotation.RequiresApi
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val PERM_REQUEST = 9901
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/audio"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "listInputs" -> result.success(listAudioInputs())
                          "setPreferredInput" -> {
                              val id = call.argument<Int>("id")
                              result.success(id != null && setPreferred(id))
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/permissions"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "checkAll" -> result.success(checkAll())
                          "requestAll" -> { requestAll(); result.success(null) }
                          "openAppSettings" -> {
                              val i = android.content.Intent(
                                  android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                              i.data = android.net.Uri.parse("package:$packageName")
                              startActivity(i); result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/stream"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startStream" -> {
                              val urls = call.argument<List<String>>("urls") ?: emptyList()
                              val rec = call.argument<String>("recordingPath") ?: ""
                              android.util.Log.i("StreamEngine", "start urls=$urls rec=$rec")
                              result.success(urls.isNotEmpty() || rec.isNotEmpty())
                          }
                          "stopStream" -> { result.success(null) }
                          else -> result.notImplemented()
                      }
                  }
              }
              private fun listAudioInputs(): List<Map<String, Any>> {
                  val out = mutableListOf<Map<String, Any>>()
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  if (Build.VERSION.SDK_INT < 23) return out
                  for (d in am.getDevices(AudioManager.GET_DEVICES_INPUTS)) {
                      val type = when (d.type) {
                          AudioDeviceInfo.TYPE_BUILTIN_MIC -> "builtin"
                          AudioDeviceInfo.TYPE_USB_DEVICE,
                          AudioDeviceInfo.TYPE_USB_HEADSET -> "usb"
                          AudioDeviceInfo.TYPE_BLUETOOTH_SCO,
                          AudioDeviceInfo.TYPE_BLUETOOTH_A2DP -> "bluetooth"
                          AudioDeviceInfo.TYPE_WIRED_HEADSET,
                          AudioDeviceInfo.TYPE_WIRED_HEADPHONES -> "wired"
                          else -> "other"
                      }
                      out.add(mapOf("id" to d.id,
                          "name" to (d.productName?.toString() ?: "Unknown"),
                          "type" to type))
                  }
                  return out
              }
              @RequiresApi(Build.VERSION_CODES.M)
              private fun setPreferred(id: Int): Boolean {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  return am.getDevices(AudioManager.GET_DEVICES_INPUTS).any { it.id == id }
              }
              private fun checkAll(): Map<String, Boolean> {
                  fun granted(p: String) = ContextCompat.checkSelfPermission(this, p) ==
                      PackageManager.PERMISSION_GRANTED
                  return mapOf(
                      "camera" to granted(Manifest.permission.CAMERA),
                      "microphone" to granted(Manifest.permission.RECORD_AUDIO),
                      "bluetooth" to (Build.VERSION.SDK_INT < 31 ||
                          granted(Manifest.permission.BLUETOOTH_CONNECT)))
              }
              private fun requestAll() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 31) {
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), PERM_REQUEST)
              }
          }
          K

      - name: Regenerate android
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          rm -f pubspec.lock

      - name: Restore MainActivity.kt (flutter create deletes it)
        run: |
          mkdir -p android/app/src/main/kotlin/com/yourcompany/studio
          cat > android/app/src/main/kotlin/com/yourcompany/studio/MainActivity.kt << 'K'
          package com.yourcompany.studio
          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.os.Build
          import androidx.annotation.RequiresApi
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
              private val PERM_REQUEST = 9901
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/audio"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "listInputs" -> result.success(listAudioInputs())
                          "setPreferredInput" -> {
                              val id = call.argument<Int>("id")
                              result.success(id != null && setPreferred(id))
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/permissions"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "checkAll" -> result.success(checkAll())
                          "requestAll" -> { requestAll(); result.success(null) }
                          "openAppSettings" -> {
                              val i = android.content.Intent(
                                  android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                              i.data = android.net.Uri.parse("package:$packageName")
                              startActivity(i); result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "mobile_tv_studio/native/stream"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startStream" -> {
                              val urls = call.argument<List<String>>("urls") ?: emptyList()
                              val rec = call.argument<String>("recordingPath") ?: ""
                              android.util.Log.i("StreamEngine", "start urls=$urls rec=$rec")
                              result.success(urls.isNotEmpty() || rec.isNotEmpty())
                          }
                          "stopStream" -> { result.success(null) }
                          else -> result.notImplemented()
                      }
                  }
              }
              private fun listAudioInputs(): List<Map<String, Any>> {
                  val out = mutableListOf<Map<String, Any>>()
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  if (Build.VERSION.SDK_INT < 23) return out
                  for (d in am.getDevices(AudioManager.GET_DEVICES_INPUTS)) {
                      val type = when (d.type) {
                          AudioDeviceInfo.TYPE_BUILTIN_MIC -> "builtin"
                          AudioDeviceInfo.TYPE_USB_DEVICE,
                          AudioDeviceInfo.TYPE_USB_HEADSET -> "usb"
                          AudioDeviceInfo.TYPE_BLUETOOTH_SCO,
                          AudioDeviceInfo.TYPE_BLUETOOTH_A2DP -> "bluetooth"
                          AudioDeviceInfo.TYPE_WIRED_HEADSET,
                          AudioDeviceInfo.TYPE_WIRED_HEADPHONES -> "wired"
                          else -> "other"
                      }
                      out.add(mapOf("id" to d.id,
                          "name" to (d.productName?.toString() ?: "Unknown"),
                          "type" to type))
                  }
                  return out
              }
              @RequiresApi(Build.VERSION_CODES.M)
              private fun setPreferred(id: Int): Boolean {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  return am.getDevices(AudioManager.GET_DEVICES_INPUTS).any { it.id == id }
              }
              private fun checkAll(): Map<String, Boolean> {
                  fun granted(p: String) = ContextCompat.checkSelfPermission(this, p) ==
                      PackageManager.PERMISSION_GRANTED
                  return mapOf(
                      "camera" to granted(Manifest.permission.CAMERA),
                      "microphone" to granted(Manifest.permission.RECORD_AUDIO),
                      "bluetooth" to (Build.VERSION.SDK_INT < 31 ||
                          granted(Manifest.permission.BLUETOOTH_CONNECT)))
              }
              private fun requestAll() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 31) {
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), PERM_REQUEST)
              }
          }
          K

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create

      - name: Force Gradle 8.7 + Kotlin 2.1
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'E'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          E
          cat > android/settings.gradle << 'E'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          E
          cat > android/build.gradle << 'E'
          ext { kotlin_version = "2.1.0" }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (compileSdkVersion == null) { compileSdkVersion 34 }
                          if (defaultConfig != null) {
                              if (defaultConfig.targetSdkVersion == null)
                                  defaultConfig.targetSdkVersion 34
                              if (defaultConfig.minSdkVersion == null)
                                  defaultConfig.minSdkVersion 24
                          }
                      }
                  }
              }
          }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          E
          cat >> android/gradle.properties << 'E'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          E

