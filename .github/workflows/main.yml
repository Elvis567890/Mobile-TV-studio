name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.24.0, channel: stable, cache: true }

      - name: Clean lib
        run: |
          rm -rf lib test
          mkdir -p lib/screens lib/widgets lib/models lib/data lib/services

      - name: Write pubspec
        run: |
          cat > pubspec.yaml << 'P'
          name: mobile_tv_studio
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.2
            provider: ^6.1.2
            uuid: ^4.5.0
            path_provider: ^2.1.4
            file_picker: ^8.1.2
            video_player: ^2.9.1
            camera: ^0.11.0+2
            flutter_webrtc: ^0.11.7
            web_socket_channel: ^3.0.1
            http: ^1.2.2
            webview_flutter: ^4.8.0
            google_sign_in: ^6.2.1
            googleapis: ^13.2.0
            googleapis_auth: ^1.6.0
            extension_google_sign_in_as_googleapis_auth: ^2.0.12
            mic_info: ^0.0.6
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.1
          flutter:
            uses-material-design: true
            assets:
              - assets/icon/
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            adaptive_icon_background: "#0A0A0F"
            adaptive_icon_foreground: "assets/icon/app_icon.png"
          flutter_native_splash:
            color: "#0A0A0F"
            image: "assets/icon/app_icon.png"
            color_dark: "#0A0A0F"
            image_dark: "assets/icon/app_icon.png"
            android_12:
              color: "#0A0A0F"
              image: "assets/icon/app_icon.png"
          P
          rm -f pubspec.lock

      - name: Generate icon
        run: |
          pip install Pillow > /dev/null 2>&1
          mkdir -p assets/icon
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (1024, 1024), (10, 10, 15, 255))
          d = ImageDraw.Draw(img)
          cx, cy = 512, 420
          d.ellipse((cx-280, cy-280, cx+280, cy+280), fill=(239, 68, 68, 255))
          d.ellipse((cx-200, cy-200, cx+200, cy+200), fill=(10, 10, 15, 255))
          d.polygon([(cx-70, cy-90), (cx-70, cy+90), (cx+100, cy)], fill=(255, 255, 255, 255))
          try:
              f1 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 100)
              f2 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 68)
          except Exception:
              f1 = ImageFont.load_default(); f2 = ImageFont.load_default()
          d.text((512, 800), 'MOBILE TV', fill=(255, 255, 255, 255), anchor='mm', font=f1)
          d.text((512, 900), 'STUDIO', fill=(239, 68, 68, 255), anchor='mm', font=f2)
          img.save('assets/icon/app_icon.png')
          PY

      # ----------------------------------------------------------------
      # PATCH: Force the Flutter camera plugin to use MIC (external)
      # instead of CAMCORDER (always built-in mic).
      # ----------------------------------------------------------------
      - name: Patch camera plugin for external microphone
        run: |
          CAMERA_PATH=$(find ~/.pub-cache -type d -name "camera_android_camerax*" | head -1)
          if [ -z "$CAMERA_PATH" ]; then
            echo "Camera plugin not found - skipping patch"
            exit 0
          fi
          TARGET="$CAMERA_PATH/android/src/main/java/io/flutter/plugins/camerax/RecorderProxyApi.java"
          if [ ! -f "$TARGET" ]; then
            echo "RecorderProxyApi.java not found - skipping"
            exit 0
          fi
          # Add imports if missing
          grep -q "import android.media.MediaRecorder;" "$TARGET" || \
            sed -i '/import androidx.camera.video.Recorder;/a import android.media.MediaRecorder;' "$TARGET"
          grep -q "import java.lang.reflect.Method;" "$TARGET" || \
            sed -i '/import java.io.File;/a import java.lang.reflect.Method;' "$TARGET"
          # Inject reflection code before return builder.build();
          sed -i '/return builder.build();/i \
          try {\
              Method setAudioSource = Recorder.Builder.class.getDeclaredMethod("setAudioSource", int.class);\
              setAudioSource.setAccessible(true);\
              setAudioSource.invoke(builder, MediaRecorder.AudioSource.MIC);\
          } catch (Exception e) {\
              android.util.Log.w("FlutterCameraPatch", "Could not set AudioSource.MIC: " + e.getMessage());\
          }' "$TARGET"
          echo "Camera plugin patched to use AudioSource.MIC"
          grep -n "MediaRecorder.AudioSource.MIC" "$TARGET" || echo "Patch marker not found"

      - name: Write lib — main.dart
        run: |
          cat > lib/main.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/role_chooser.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const App());
          }
          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Mobile TV Studio',
              theme: ThemeData(useMaterial3: true, brightness: Brightness.dark,
                scaffoldBackgroundColor: const Color(0xFF0A0A0F),
                colorScheme: const ColorScheme.dark(
                  primary: Color(0xFF3B82F6), surface: Color(0xFF141418))),
              home: const RoleChooser());
          }
          D

      - name: Write lib — services/config.dart
        run: |
          cat > lib/services/config.dart << 'D'
          class AppConfig {
            static const String signalingUrl = 'wss://mobile-tv-studio.onrender.com';
            static const String roomId = 'studio1';
          }
          D

      - name: Write lib — services/signaling.dart
        run: |
          cat > lib/services/signaling.dart << 'D'
          import 'dart:async';
          import 'dart:convert';
          import 'package:web_socket_channel/web_socket_channel.dart';
          enum SignalType { offer, answer, candidate, join, leave }
          class SignalMessage {
            final SignalType type; final String room; final String from;
            final String sdp; final String mid; final int mline;
            SignalMessage({required this.type, required this.room, required this.from,
              this.sdp = '', this.mid = '', this.mline = 0});
            Map<String, dynamic> toJson() => {'type': type.name, 'room': room,
              'from': from, 'sdp': sdp, 'mid': mid, 'mline': mline};
            factory SignalMessage.fromJson(Map<String, dynamic> j) => SignalMessage(
              type: SignalType.values.firstWhere((t) => t.name == j['type'],
                orElse: () => SignalType.candidate),
              room: j['room'] ?? '', from: j['from'] ?? '',
              sdp: j['sdp'] ?? '', mid: j['mid'] ?? '', mline: j['mline'] ?? 0);
          }
          class SignalingClient {
            final String serverUrl; final String roomId; final String clientId;
            SignalingClient({required this.serverUrl, required this.roomId, required this.clientId});
            WebSocketChannel? _channel;
            final _controller = StreamController<SignalMessage>.broadcast();
            Stream<SignalMessage> get messages => _controller.stream;
            Future<bool> connect() async {
              try {
                _channel = WebSocketChannel.connect(Uri.parse(serverUrl));
                await _channel!.ready;
                _channel!.stream.listen((raw) {
                  try { _controller.add(SignalMessage.fromJson(jsonDecode(raw as String))); } catch (_) {}
                }, onError: (_) {});
                send(SignalMessage(type: SignalType.join, room: roomId, from: clientId));
                return true;
              } catch (_) { return false; }
            }
            void send(SignalMessage m) { try { _channel?.sink.add(jsonEncode(m.toJson())); } catch (_) {} }
            Future<void> disconnect() async {
              send(SignalMessage(type: SignalType.leave, room: roomId, from: clientId));
              await _channel?.sink.close();
              await _controller.close();
            }
          }
          D

      - name: Write lib — services/webrtc_session.dart SELECT AUDIO INPUT
        run: |
          cat > lib/services/webrtc_session.dart << 'D'
          import 'dart:async';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_webrtc/flutter_webrtc.dart';
          import 'signaling.dart';
          class WebRtcSession {
            final String serverUrl; final String roomId;
            final String clientId; final bool isCaller;
            WebRtcSession({required this.serverUrl, required this.roomId,
              required this.clientId, required this.isCaller});
            RTCPeerConnection? _pc; MediaStream? _localStream;
            SignalingClient? _signal; StreamSubscription<SignalMessage>? _sub;
            final _remote = RTCVideoRenderer(); bool _ready = false;
            RTCVideoRenderer get renderer => _remote;
            MediaStream? get localStream => _localStream;
            bool get ready => _ready;

            /// Enumerate available audio input devices.
            static Future<List<MediaDeviceInfo>> listAudioInputs() async {
              try { return await navigator.mediaDevices.enumerateDevices(); }
              catch (_) { return []; }
            }

            /// Try to pick an external (non-builtin) audio input.
            Future<String?> _pickExternalMicId() async {
              final devices = await listAudioInputs();
              // Prefer USB, wired, or bluetooth; fall back to first "audioinput"
              for (final d in devices) {
                if (d.kind != 'audioinput') continue;
                final label = (d.label ?? '').toLowerCase();
                if (label.contains('usb') || label.contains('wired') ||
                    label.contains('headset') || label.contains('external')) {
                  return d.deviceId;
                }
              }
              // Fallback: first audioinput
              for (final d in devices) {
                if (d.kind == 'audioinput') return d.deviceId;
              }
              return null;
            }

            Future<bool> start() async {
              try {
                if (!_ready) { await _remote.initialize(); _ready = true; }
                _pc = await createPeerConnection({
                  'iceServers': [
                    {'urls': 'stun:stun.l.google.com:19302'},
                    {'urls': 'stun:stun1.l.google.com:19302'}],
                  'sdpSemantics': 'unified-plan', 'iceTransportPolicy': 'all'});
                _pc!.onIceCandidate = (c) {
                  _signal?.send(SignalMessage(type: SignalType.candidate,
                    room: roomId, from: clientId, sdp: c.candidate ?? '',
                    mid: c.sdpMid ?? '', mline: c.sdpMLineIndex ?? 0));
                };
                _pc!.onTrack = (e) { if (e.streams.isNotEmpty) _remote.srcObject = e.streams[0]; };

                // Try to select external mic BEFORE getUserMedia
                final micId = await _pickExternalMicId();
                final constraints = <String, dynamic>{
                  'audio': micId != null ? {'deviceId': micId} : true,
                  'video': {'facingMode': 'environment',
                    'width': {'ideal': 854}, 'height': {'ideal': 480},
                    'frameRate': {'ideal': 24}},
                };
                debugPrint('WebRTC mic deviceId: $micId');
                _localStream = await navigator.mediaDevices.getUserMedia(constraints);

                // On Android, explicitly tell the WebRTC layer to use this input.
                if (micId != null && !kIsWeb) {
                  try { await Helper.selectAudioInput(micId); } catch (e) {
                    debugPrint('selectAudioInput failed: $e');
                  }
                }

                for (final t in _localStream!.getTracks()) { await _pc!.addTrack(t, _localStream!); }
                _signal = SignalingClient(serverUrl: serverUrl, roomId: roomId, clientId: clientId);
                if (!await _signal!.connect()) return false;
                _sub = _signal!.messages.listen(_onSignal);
                if (isCaller) {
                  final offer = await _pc!.createOffer();
                  await _pc!.setLocalDescription(offer);
                  _signal!.send(SignalMessage(type: SignalType.offer,
                    room: roomId, from: clientId, sdp: offer.sdp ?? ''));
                }
                return true;
              } catch (e) { debugPrint('WebRTC start failed: $e'); return false; }
            }
            Future<void> _onSignal(SignalMessage m) async {
              if (m.from == clientId) return;
              if (m.type == SignalType.offer) {
                await _pc!.setRemoteDescription(RTCSessionDescription(m.sdp, 'offer'));
                final a = await _pc!.createAnswer();
                await _pc!.setLocalDescription(a);
                _signal!.send(SignalMessage(type: SignalType.answer,
                  room: roomId, from: clientId, sdp: a.sdp ?? ''));
              } else if (m.type == SignalType.answer) {
                await _pc!.setRemoteDescription(RTCSessionDescription(m.sdp, 'answer'));
              } else if (m.type == SignalType.candidate) {
                await _pc!.addCandidate(RTCIceCandidate(m.sdp, m.mid, m.mline));
              }
            }
            Future<void> stop() async {
              await _sub?.cancel();
              await _signal?.disconnect();
              for (final t in _localStream?.getTracks() ?? <MediaStreamTrack>[]) { await t.stop(); }
              await _localStream?.dispose();
              await _pc?.close(); await _pc?.dispose();
              _pc = null; _localStream = null;
            }
          }
          D

      - name: Write lib — services/audio_input_service.dart MIC_INFO
        run: |
          cat > lib/services/audio_input_service.dart << 'D'
          import 'package:flutter/foundation.dart';
          import 'package:mic_info/mic_info.dart';
          import 'package:mic_info/model/mic_info_model.dart';
          class AudioInputDevice {
            final String id; final String name; final String type;
            AudioInputDevice({required this.id, required this.name, required this.type});
          }
          class AudioInputService extends ChangeNotifier {
            List<AudioInputDevice> _inputs = []; String? _selectedId;
            List<AudioInputDevice> get inputs => _inputs;
            String? get selectedId => _selectedId;
            bool get hasExternal => _inputs.any((d) =>
              d.type == 'usb' || d.type == 'wired' || d.type == 'bluetooth');
            Future<void> refresh() async {
              try {
                final defaultMics = await MicInfo.getDefaultMicrophones();
                final wiredMics = await MicInfo.getWiredMicrophones();
                final btMics = await MicInfo.getBluetoothMicrophones();
                final all = <MicInfoDevice>[...defaultMics, ...wiredMics, ...btMics];
                _inputs = all.map((d) => AudioInputDevice(
                  id: d.id ?? '',
                  name: d.productName ?? 'Unknown',
                  type: _classify(d))).toList();
              } catch (e) {
                debugPrint('mic_info failed: $e');
                _inputs = [];
              }
              notifyListeners();
            }
            String _classify(MicInfoDevice d) {
              final n = (d.productName ?? '').toLowerCase();
              if (n.contains('usb')) return 'usb';
              if (n.contains('wired') || n.contains('headset')) return 'wired';
              if (n.contains('bluetooth') || n.contains('bt')) return 'bluetooth';
              return 'builtin';
            }
            Future<void> select(String id) async {
              _selectedId = id;
              notifyListeners();
            }
          }
          D

      - name: Write lib — services/stream_engine.dart
        run: |
          cat > lib/services/stream_engine.dart << 'D'
          import 'package:flutter/foundation.dart';
          import 'package:flutter/services.dart';
          class StreamEngine extends ChangeNotifier {
            static const _ch = MethodChannel('mobile_tv_studio/native/stream');
            bool _live = false; bool _recording = false;
            String _status = 'IDLE'; String? _lastError;
            String? _recordingPath;
            bool get live => _live;
            bool get recording => _recording;
            String get status => _status;
            String? get lastError => _lastError;
            String? get recordingPath => _recordingPath;
            Future<bool> start({required List<String> rtmpUrls, String? recordingPath}) async {
              if (rtmpUrls.isEmpty && recordingPath == null) return false;
              _status = 'STARTING…'; notifyListeners();
              try {
                final ok = await _ch.invokeMethod<bool>('startStream', {
                  'urls': rtmpUrls, 'recordingPath': recordingPath ?? ''});
                if (ok == true) {
                  _live = true; _recording = recordingPath != null;
                  _recordingPath = recordingPath; _status = 'LIVE';
                  notifyListeners(); return true;
                } else {
                  _status = 'FAILED'; _lastError = 'Native rejected start';
                  notifyListeners(); return false;
                }
              } catch (e) {
                _status = 'ERROR'; _lastError = e.toString();
                notifyListeners(); return false;
              }
            }
            Future<void> stop() async {
              try { await _ch.invokeMethod('stopStream'); } catch (_) {}
              _live = false; _recording = false; _status = 'IDLE';
              notifyListeners();
            }
          }
          D

      - name: Write lib — services/local_recorder.dart
        run: |
          cat > lib/services/local_recorder.dart << 'D'
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import 'package:path_provider/path_provider.dart';
          class LocalRecorder extends ChangeNotifier {
            bool _recording = false; String? _currentPath;
            bool get recording => _recording;
            String? get currentPath => _currentPath;
            Future<String> prepare() async {
              final dir = await getApplicationDocumentsDirectory();
              final recDir = Directory('${dir.path}/recordings');
              if (!recDir.existsSync()) recDir.createSync(recursive: true);
              final stamp = DateTime.now().toIso8601String().replaceAll(':', '-');
              _currentPath = '${recDir.path}/broadcast_$stamp.mp4';
              return _currentPath!;
            }
            void markStarted() { _recording = true; notifyListeners(); }
            Future<String?> markStopped() async {
              _recording = false; final p = _currentPath;
              notifyListeners(); return p;
            }
            Future<List<File>> listRecordings() async {
              final dir = await getApplicationDocumentsDirectory();
              final recDir = Directory('${dir.path}/recordings');
              if (!recDir.existsSync()) return [];
              final files = recDir.listSync().whereType<File>()
                .where((f) => f.path.endsWith('.mp4')).toList();
              files.sort((a, b) => b.lastModifiedSync().compareTo(a.lastModifiedSync()));
              return files;
            }
            Future<void> deleteRecording(String path) async {
              final f = File(path);
              if (f.existsSync()) await f.delete();
              notifyListeners();
            }
          }
          D

      - name: Write lib — services/permissions_service.dart
        run: |
          cat > lib/services/permissions_service.dart << 'D'
          import 'package:flutter/services.dart';
          class PermissionsService {
            static const _ch = MethodChannel('mobile_tv_studio/native/permissions');
            static Future<Map<String, dynamic>> checkAll() async {
              try {
                final r = await _ch.invokeMethod<Map<dynamic, dynamic>>('checkAll');
                return r?.map((k, v) => MapEntry(k.toString(), v)) ?? {};
              } catch (_) { return {}; }
            }
            static Future<void> requestAll() async {
              try { await _ch.invokeMethod('requestAll'); } catch (_) {}
            }
            static Future<void> openAppSettings() async {
              try { await _ch.invokeMethod('openAppSettings'); } catch (_) {}
            }
          }
          D

      - name: Write lib — services/account_store.dart
        run: |
          cat > lib/services/account_store.dart << 'D'
          import 'dart:convert';
          import 'package:flutter/foundation.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:uuid/uuid.dart';
          import '../models/linked_account.dart';
          class AccountStore extends ChangeNotifier {
            static const _k = 'linked_accounts_v1';
            List<LinkedAccount> _items = [];
            List<LinkedAccount> get items => _items;
            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString(_k);
              if (raw != null && raw.isNotEmpty) {
                try { _items = (jsonDecode(raw) as List)
                  .map((e) => LinkedAccount.fromJson(e)).toList(); }
                catch (_) { _items = []; }
              }
              notifyListeners();
            }
            Future<void> _persist() async {
              final p = await SharedPreferences.getInstance();
              await p.setString(_k, jsonEncode(_items.map((e) => e.toJson()).toList()));
            }
            Future<LinkedAccount> link({required AccountPlatform platform,
              required String displayName, String? email,
              required String streamKey, required String rtmpUrl}) async {
              final a = LinkedAccount(id: const Uuid().v4(), platform: platform,
                displayName: displayName, email: email,
                streamKey: streamKey, rtmpUrl: rtmpUrl, linkedAt: DateTime.now());
              _items.add(a); await _persist(); notifyListeners(); return a;
            }
            Future<void> unlink(String id) async {
              _items.removeWhere((a) => a.id == id);
              await _persist(); notifyListeners();
            }
            List<LinkedAccount> forPlatform(AccountPlatform p) =>
              _items.where((a) => a.platform == p).toList();
          }
          D

      - name: Write lib — models/linked_account.dart
        run: |
          cat > lib/models/linked_account.dart << 'D'
          enum AccountPlatform { youtube, facebook, twitch, tiktok, kick, trovo, linkedin, x }
          class LinkedAccount {
            final String id; final AccountPlatform platform;
            final String displayName; final String? email;
            final String streamKey; final String rtmpUrl; final DateTime linkedAt;
            LinkedAccount({required this.id, required this.platform,
              required this.displayName, this.email,
              required this.streamKey, required this.rtmpUrl, required this.linkedAt});
            Map<String, dynamic> toJson() => {'id': id, 'platform': platform.name,
              'displayName': displayName, 'email': email, 'streamKey': streamKey,
              'rtmpUrl': rtmpUrl, 'linkedAt': linkedAt.toIso8601String()};
            factory LinkedAccount.fromJson(Map<String, dynamic> j) => LinkedAccount(
              id: j['id'], platform: AccountPlatform.values.firstWhere(
                (p) => p.name == j['platform'], orElse: () => AccountPlatform.youtube),
              displayName: j['displayName'], email: j['email'],
              streamKey: j['streamKey'], rtmpUrl: j['rtmpUrl'],
              linkedAt: DateTime.parse(j['linkedAt']));
            String get fullUrl => '$rtmpUrl/$streamKey';
          }
          D

      - name: Write lib — services/platform_defaults.dart
        run: |
          cat > lib/services/platform_defaults.dart << 'D'
          import '../models/linked_account.dart';
          class PlatformDefaults {
            static String label(AccountPlatform p) {
              switch (p) {
                case AccountPlatform.youtube: return 'YouTube';
                case AccountPlatform.facebook: return 'Facebook';
                case AccountPlatform.twitch: return 'Twitch';
                case AccountPlatform.tiktok: return 'TikTok';
                case AccountPlatform.kick: return 'Kick';
                case AccountPlatform.trovo: return 'Trovo';
                case AccountPlatform.linkedin: return 'LinkedIn';
                case AccountPlatform.x: return 'X';
              }
            }
            static String rtmp(AccountPlatform p) {
              switch (p) {
                case AccountPlatform.youtube: return 'rtmp://a.rtmp.youtube.com/live2';
                case AccountPlatform.facebook: return 'rtmps://live-api-s.facebook.com:443/rtmp';
                case AccountPlatform.twitch: return 'rtmp://live.twitch.tv/app';
                case AccountPlatform.tiktok: return 'rtmp://push.tiktokv.com/live';
                case AccountPlatform.kick: return 'rtmp://fa723fc1b171.global-contribute.live-video.net/app';
                case AccountPlatform.trovo: return 'rtmp://livepush.trovo.live/live';
                case AccountPlatform.linkedin: return 'rtmp://rtmp-api.facebook.com:80/rtmp';
                case AccountPlatform.x: return 'rtmp://ingest.pscp.tv:80/x';
              }
            }
            static String dashboardUrl(AccountPlatform p) {
              switch (p) {
                case AccountPlatform.youtube: return 'https://studio.youtube.com';
                case AccountPlatform.facebook: return 'https://www.facebook.com/live/producer';
                case AccountPlatform.twitch: return 'https://dashboard.twitch.tv/settings/stream';
                case AccountPlatform.tiktok: return 'https://www.tiktok.com/live';
                case AccountPlatform.kick: return 'https://kick.com/dashboard/settings/stream';
                case AccountPlatform.trovo: return 'https://studio.trovo.live';
                case AccountPlatform.linkedin: return 'https://www.linkedin.com/video';
                case AccountPlatform.x: return 'https://twitter.com/settings/broadcasting';
              }
            }
            static String helpText(AccountPlatform p) {
              switch (p) {
                case AccountPlatform.youtube: return 'Sign in with Google. Stream key created automatically.';
                case AccountPlatform.twitch: return 'Open dashboard, copy Primary Stream Key, paste here.';
                case AccountPlatform.facebook: return 'Open Live Producer, copy Stream Key, paste here.';
                case AccountPlatform.tiktok: return 'TikTok Live Studio required. Copy URL and key.';
                case AccountPlatform.kick: return 'Kick dashboard → Stream Settings. Copy URL and key.';
