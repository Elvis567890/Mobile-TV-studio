                          trailing: n == _camCount
                              ? const Icon(Icons.check,
                                  color: Colors.tealAccent) : null,
                          onTap: () => Navigator.pop(ctx, n));
                      })),
                    ]))));
              if (c != null) setState(() => _camCount = c);
            }
            Future<void> _openG() async {
