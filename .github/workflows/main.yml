name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Regenerate Android folder with v2 embedding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          echo "=== android folder ==="
          ls android/
          echo ""
          echo "=== android/app/build.gradle.kts ==="
          cat android/app/build.gradle.kts

      - name: Patch app build.gradle with explicit SDK versions
        run: |
          python3 << 'PYEOF'
          import os, re

          path = 'android/app/build.gradle.kts'
          if not os.path.exists(path):
              path = 'android/app/build.gradle'

          with open(path) as f:
              s = f.read()

          # If it is a .kts file, use Kotlin syntax
          if path.endswith('.kts'):
              if 'compileSdk = ' not in s and 'compileSdkVersion' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    compileSdk = 34\n    ndkVersion = "25.1.8937393"'
                  )
              if 'targetSdk = ' not in s:
                  s = re.sub(
                      r'(\n\s*targetSdk\s*=\s*[^\n]+)',
                      r'\n        targetSdk = 34',
                      s,
                      count=1
                  )
              if 'minSdk = ' not in s:
                  s = re.sub(
                      r'(\n\s*minSdk\s*=\s*[^\n]+)',
                      r'\n        minSdk = 24',
                      s,
                      count=1
                  )
          else:
              if 'compileSdkVersion' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    compileSdkVersion 34'
                  )
              s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', s)
              s = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', s)

          with open(path, 'w') as f:
              f.write(s)

          print("=== After patch ===")
          print(open(path).read())
          PYEOF

      - name: Force v2 embedding in manifest
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              s = f.read()

          s = re.sub(r'<meta-data[^>]*android:name="flutterEmbedding"[^>]*/>', '', s)
          s = s.replace(
              '</application>',
              '        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />\n    </application>'
          )
          if 'xmlns:tools' not in s:
              s = s.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n          xmlns:tools="http://schemas.android.com/tools"'
              )
          s = s.replace(
              'android:label="mobile_tv_studio"',
              'android:label="Mobile TV Studio"\n        android:usesCleartextTraffic="true"\n        tools:replace="android:label"'
          )
          with open(path, 'w') as f:
              f.write(s)
          print("=== Manifest ===")
          print(open(path).read())
          PYEOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileTVStudio-release
          path: build/app/outputs/flutter-apk/app-release.apk
