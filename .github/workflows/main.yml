            }
            Widget _card(BuildContext context, IconData icon, String title, Color color, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(12),
                child: Container(
                  width: 140,
                  height: 150,
                  decoration: BoxDecoration(
                    color: Colors.white10,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: color.withOpacity(0.5), width: 2),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 44, color: color),
                      const SizedBox(height: 10),
                      Text(
                        title,
                        style: const TextStyle(
                          fontSize: 14,
                          fontWeight: FontWeight.w900,
                          letterSpacing: 2,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Write camera screen
        run: |
          cat > lib/screens/camera_screen.dart << 'D'
          import 'package:flutter/material.dart';
          import '../widgets/live_camera.dart';
          class CameraScreen extends StatefulWidget {
            const CameraScreen({super.key});
            @override
            State<CameraScreen> createState() => _CameraScreenState();
          }
          class _CameraScreenState extends State<CameraScreen> {
            bool _live = false;
            bool _front = false;
            String _quality = '720p';
            int _fps = 30;
            void _cycleQuality() {
              setState(() {
                if (_quality == '720p') {
                  _quality = '480p';
                } else if (_quality == '480p') {
                  _quality = '360p';
                } else {
                  _quality = '720p';
                }
              });
            }
            void _cycleFps() {
              setState(() {
                final opts = [24, 25, 30, 35, 60];
                final idx = opts.indexOf(_fps);
                _fps = opts[(idx + 1) % opts.length];
              });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                appBar: AppBar(
                  title: const Text(
                    'CAMERA NODE',
                    style: TextStyle(
                      fontSize: 14,
                      letterSpacing: 3,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                  backgroundColor: const Color(0xFF141418),
                  actions: [
                    Padding(
                      padding: const EdgeInsets.only(right: 12),
                      child: Center(
                        child: Text(
                          '$_quality - ${_fps}fps - ${_live ? "LIVE" : "OFFLINE"}',
                          style: TextStyle(
                            color: _live ? Colors.green : Colors.grey,
                            fontSize: 10,
                            fontWeight: FontWeight.w800,
                            letterSpacing: 1,
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
                body: Row(
                  children: [
                    Expanded(
                      child: Container(
                        margin: const EdgeInsets.all(10),
                        decoration: BoxDecoration(
                          color: Colors.black,
                          borderRadius: BorderRadius.circular(8),
                          border: Border.all(
                            color: _live ? Colors.red : Colors.white24,
                            width: _live ? 3 : 1,
                          ),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(6),
                          child: LiveCamera(front: _front),
                        ),
                      ),
                    ),
                    Container(
                      width: 160,
                      color: const Color(0xFF141418),
                      padding: const EdgeInsets.all(8),
                      child: SingleChildScrollView(
                        child: Column(
                          children: [
                            _btn(
                              _live ? Icons.stop : Icons.play_arrow,
                              _live ? 'STOP' : 'GO LIVE',
                              _live ? Colors.red : Colors.green,
                              78,
                              () => setState(() => _live = !_live),
                            ),
                            const SizedBox(height: 8),
                            _btn(Icons.high_quality, _quality, Colors.blue, 64, _cycleQuality),
                            const SizedBox(height: 8),
                            _btn(Icons.speed, '$_fps FPS', Colors.tealAccent, 64, _cycleFps),
                            const SizedBox(height: 8),
                            _btn(
                              Icons.flip_camera_android,
                              _front ? 'FRONT' : 'REAR',
                              Colors.purpleAccent,
                              64,
                              () => setState(() => _front = !_front),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
            Widget _btn(IconData icon, String label, Color color, double size, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(8),
                child: Container(
                  width: size,
                  height: size,
                  decoration: BoxDecoration(
                    color: color.withOpacity(0.12),
                    border: Border.all(color: color, width: 1.5),
                    borderRadius: BorderRadius.circular(8),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, color: color, size: size * 0.32),
                      const SizedBox(height: 4),
                      Text(
                        label,
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          color: color,
                          fontSize: 9,
                          fontWeight: FontWeight.w900,
                          letterSpacing: 1,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Write graphics editor
        run: |
          cat > lib/screens/graphics_editor.dart << 'D'
          import 'package:flutter/material.dart';
          import 'package:uuid/uuid.dart';
          import '../models/overlay_item.dart';
          import '../services/overlay_store.dart';
          import '../widgets/overlay_renderer.dart';
          class GraphicsEditor extends StatefulWidget {
            const GraphicsEditor({super.key});
            @override
            State<GraphicsEditor> createState() => _GraphicsEditorState();
          }
          class _GraphicsEditorState extends State<GraphicsEditor> {
            final _store = OverlayStore();
            List<OverlayItem> _items = [];
            String? _selected;
            final _swatches = [
              0xFFFFFFFF,
              0xFFEF4444,
              0xFFF5C542,
              0xFF22C55E,
              0xFF3B82F6,
              0xFF8B5CF6,
              0xFFFF6B00,
              0xFF00C2FF,
            ];
            @override
            void initState() {
              super.initState();
              _load();
            }
            Future<void> _load() async {
              final items = await _store.loadAll();
              if (mounted) {
                setState(() => _items = items);
              }
            }
            Future<void> _save() async {
              await _store.saveAll(_items);
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Saved')),
                );
              }
            }
            Future<void> _addText() async {
              final ctrl = TextEditingController();
              final text = await showDialog<String>(
                context: context,
                builder: (ctx) {
                  return AlertDialog(
                    backgroundColor: const Color(0xFF141418),
                    title: const Text('Add Text'),
                    content: TextField(
                      controller: ctrl,
                      autofocus: true,
                      style: const TextStyle(color: Colors.white),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: const Text('CANCEL'),
                      ),
                      FilledButton(
                        onPressed: () => Navigator.pop(ctx, ctrl.text),
                        child: const Text('ADD'),
                      ),
                    ],
                  );
                },
              );
              if (text == null || text.isEmpty) {
                return;
              }
              setState(() {
                _items.add(OverlayItem(
                  id: const Uuid().v4(),
                  kind: OverlayKind.text,
                  content: text,
                  x: 0.5,
                  y: 0.5,
                ));
              });
            }
            void _addLiveBadge() {
              setState(() {
                _items.add(OverlayItem(
                  id: const Uuid().v4(),
                  kind: OverlayKind.liveBadge,
                  content: 'LIVE',
                  x: 0.1,
                  y: 0.15,
                  size: 14,
                  color: 0xFFEF4444,
                ));
              });
            }
            void _move(Offset d, Size box) {
              if (_selected == null) {
                return;
              }
              final item = _items.firstWhere((e) => e.id == _selected);
              setState(() {
                item.x = (item.x + d.dx / box.width).clamp(0.0, 1.0);
                item.y = (item.y + d.dy / box.height).clamp(0.0, 1.0);
              });
            }
            void _setColor(int c) {
              if (_selected == null) {
                return;
              }
              final item = _items.firstWhere((e) => e.id == _selected);
              setState(() => item.color = c);
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                appBar: AppBar(
                  title: const Text(
                    'GRAPHICS',
                    style: TextStyle(
                      fontSize: 14,
                      letterSpacing: 3,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                  backgroundColor: const Color(0xFF141418),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.add, color: Colors.tealAccent),
                      onPressed: _addText,
                    ),
                    IconButton(
                      icon: const Icon(Icons.fiber_manual_record, color: Colors.redAccent),
                      onPressed: _addLiveBadge,
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      flex: 3,
                      child: Padding(
                        padding: const EdgeInsets.all(12),
                        child: LayoutBuilder(
                          builder: (context, cons) {
                            final box = Size(cons.maxWidth, cons.maxHeight);
                            return GestureDetector(
                              onPanUpdate: (d) => _move(d.delta, box),
                              child: Container(
                                decoration: BoxDecoration(
                                  color: Colors.black,
                                  borderRadius: BorderRadius.circular(6),
                                  border: Border.all(color: const Color(0xFFF5C542), width: 1.5),
                                ),
                                child: Stack(
                                  children: [
                                    const Center(
                                      child: Text(
                                        'DRAG TO MOVE',
                                        style: TextStyle(
                                          color: Colors.white24,
                                          fontSize: 10,
                                          letterSpacing: 3,
                                        ),
                                      ),
                                    ),
                                    OverlayRenderer(overlays: _items),
                                    ..._items.map((it) {
                                      return Positioned(
                                        left: it.x * box.width - 70,
                                        top: it.y * box.height - 20,
                                        child: GestureDetector(
                                          onTap: () => setState(() => _selected = it.id),
                                          child: Container(
                                            width: 140,
                                            height: 40,
                                            decoration: BoxDecoration(
                                              border: Border.all(
                                                color: _selected == it.id
                                                    ? const Color(0xFF3B82F6)
                                                    : Colors.transparent,
                                                width: 2,
                                              ),
                                            ),
                                          ),
                                        ),
                                      );
                                    }),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ),
                    if (_selected != null)
                      Container(
                        height: 44,
                        color: const Color(0xFF141418),
                        child: ListView(
                          scrollDirection: Axis.horizontal,
                          children: _swatches.map((c) {
                            return GestureDetector(
                              onTap: () => _setColor(c),
                              child: Container(
                                margin: const EdgeInsets.all(6),
                                width: 32,
                                height: 32,
                                decoration: BoxDecoration(
                                  color: Color(c),
                                  shape: BoxShape.circle,
                                  border: Border.all(color: Colors.white24, width: 2),
                                ),
                              ),
                            );
                          }).toList(),
                        ),
                      ),
                    Expanded(
                      flex: 2,
                      child: Container(
                        color: const Color(0xFF141418),
                        child: _items.isEmpty
                            ? const Center(
                                child: Text(
                                  'No overlays. Tap + to add.',
                                  style: TextStyle(color: Colors.white54, fontSize: 12),
                                ),
                              )
                            : ListView.builder(
                                itemCount: _items.length,
                                itemBuilder: (_, i) {
                                  final it = _items[i];
                                  return ListTile(
                                    selected: _selected == it.id,
                                    selectedTileColor: Colors.white10,
                                    title: Text(
                                      it.content,
                                      style: const TextStyle(color: Colors.white),
                                    ),
                                    trailing: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        IconButton(
                                          icon: const Icon(Icons.remove_circle_outline, color: Colors.white70),
                                          onPressed: () {
                                            setState(() {
                                              it.size = (it.size - 4).clamp(6.0, 200.0);
                                            });
                                          },
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.add_circle_outline, color: Colors.white70),
                                          onPressed: () {
                                            setState(() {
                                              it.size = (it.size + 4).clamp(6.0, 200.0);
                                            });
                                          },
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                          onPressed: () {
                                            setState(() {
                                              _items.removeWhere((e) => e.id == it.id);
                                            });
                                          },
                                        ),
                                      ],
                                    ),
                                    onTap: () => setState(() => _selected = it.id),
                                  );
                                },
                              ),
                      ),
                    ),
                    Container(
                      height: 50,
                      color: const Color(0xFF0A0A0F),
                      padding: const EdgeInsets.symmetric(horizontal: 12),
                      child: Row(
                        children: [
                          FilledButton.icon(
                            onPressed: _save,
                            icon: const Icon(Icons.save),
                            label: const Text('SAVE'),
                          ),
                          const Spacer(),
                          FilledButton.icon(
                            onPressed: () => Navigator.pop(context),
                            icon: const Icon(Icons.check),
                            label: const Text('DONE'),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          D

      - name: Write director screen
        run: |
          cat > lib/screens/director_screen.dart << 'D'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import '../models/overlay_item.dart';
          import '../services/overlay_store.dart';
          import '../widgets/overlay_renderer.dart';
          import 'graphics_editor.dart';

          const _bg = Color(0xFF0A0A0F);
          const _panel = Color(0xFF141418);
          const _red = Color(0xFFEF4444);
          const _yellow = Color(0xFFF5C542);
          const _blue = Color(0xFF3B82F6);
          const _grey = Color(0x14FFFFFF);

          class DirectorScreen extends StatefulWidget {
            const DirectorScreen({super.key});
            @override
            State<DirectorScreen> createState() => _DirectorScreenState();
          }

          class _DirectorScreenState extends State<DirectorScreen> {
            bool _onAir = false;
            bool _menuOpen = false;
            int _tab = 0;
            int _seconds = 0;
            int _camCount = 6;
            Timer? _ticker;
            List<bool> _live = List.generate(15, (i) => i == 0);
            List<bool> _preview = List.generate(15, (i) => i == 1);
            final _overlayStore = OverlayStore();
            List<OverlayItem> _overlays = [];

            @override
            void initState() {
              super.initState();
              _ticker = Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) {
                  setState(() => _seconds++);
                }
              });
              _loadOverlays();
            }

            Future<void> _loadOverlays() async {
              final items = await _overlayStore.loadAll();
              if (mounted) {
                setState(() => _overlays = items);
              }
            }

            @override
            void dispose() {
              _ticker?.cancel();
              super.dispose();
            }

            String get _time {
              final h = (_seconds ~/ 3600).toString().padLeft(2, '0');
              final m = ((_seconds ~/ 60) % 60).toString().padLeft(2, '0');
              final s = (_seconds % 60).toString().padLeft(2, '0');
              return '$h:$m:$s';
            }

            void _take() {
              setState(() {
                final liveIdx = _live.indexOf(true);
                final previewIdx = _preview.indexOf(true);
                if (liveIdx < 0 || previewIdx < 0) {
                  return;
                }
                _live[liveIdx] = false;
                _preview[liveIdx] = true;
                _preview[previewIdx] = false;
                _live[previewIdx] = true;
              });
            }

            void _selectPreview(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) {
                  _preview[k] = false;
                }
                _preview[i] = true;
              });
            }

            void _setLive(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) {
                  _live[k] = false;
                  _preview[k] = false;
                }
                _live[i] = true;
              });
            }

            void _addCamera() {
              if (_camCount >= 15) {
                return;
              }
              setState(() => _camCount++);
            }

            Future<void> _removeCamera(int i) async {
              if (_camCount <= 1) {
                return;
              }
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) {
                  return AlertDialog(
                    backgroundColor: _panel,
                    title: const Text('Remove camera?'),
                    content: Text('Remove CAM ${i + 1}?'),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('CANCEL'),
                      ),
                      FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('REMOVE'),
                      ),
                    ],
                  );
                },
              );
              if (ok != true) {
                return;
              }
              setState(() {
                _camCount--;
                if (!_live.sublist(0, _camCount).contains(true) && _camCount > 0) {
                  _live[0] = true;
                }
                if (!_preview.sublist(0, _camCount).contains(true) && _camCount > 1) {
                  _preview[1] = true;
                }
              });
            }

            Future<void> _pickCount() async {
              final choice = await showModalBottomSheet<int>(
                context: context,
                backgroundColor: _panel,
                builder: (ctx) {
                  return SafeArea(
                    child: SizedBox(
                      height: MediaQuery.of(ctx).size.height * 0.75,
                      child: Column(
                        children: [
                          const Padding(
                            padding: EdgeInsets.all(16),
                            child: Text(
                              'NUMBER OF CAMERAS',
                              style: TextStyle(
                                color: Colors.white70,
                                fontSize: 12,
                                letterSpacing: 3,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                          ),
                          const Divider(height: 1, color: Colors.white12),
                          Expanded(
                            child: ListView.builder(
                              itemCount: 15,
                              itemBuilder: (_, i) {
                                final n = i + 1;
                                return ListTile(
                                  title: Text(
                                    '$n camera${n == 1 ? "" : "s"}',
                                    style: const TextStyle(color: Colors.white),
                                  ),
                                  trailing: n == _camCount
                                      ? const Icon(Icons.check, color: Colors.tealAccent)
                                      : null,
                                  onTap: () => Navigator.pop(ctx, n),
                                );
                              },
                            ),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
              if (choice != null) {
                setState(() => _camCount = choice);
              }
            }

            Future<void> _openGraphics() async {
              setState(() => _menuOpen = false);
              await Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => const GraphicsEditor()),
              );
              _loadOverlays();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: _bg,
                body: SafeArea(
                  child: Stack(
                    children: [
                      Column(
                        children: [
                          _statusBar(),
                          _cameraStrip(),
                          _tabRow(),
                          Expanded(child: _tab == 1 ? _grid() : _program()),
                          _actionBar(),
                        ],
                      ),
                      if (_menuOpen) _menuPanel(),
                    ],
                  ),
                ),
              );
            }

            Widget _statusBar() {
              return Container(
                height: 40,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    Container(
                      width: 7,
                      height: 7,
                      decoration: BoxDecoration(
                        color: _onAir ? _red : Colors.grey,
                        shape: BoxShape.circle,
                      ),
                    ),
                    const SizedBox(width: 6),
                    Text(
                      _onAir ? 'ON AIR' : 'OFFLINE',
                      style: TextStyle(
                        color: _onAir ? _red : Colors.grey,
                        fontSize: 10,
                        fontWeight: FontWeight.w900,
                        letterSpacing: 2,
                      ),
                    ),
                    const SizedBox(width: 10),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 2),
                      decoration: BoxDecoration(
                        color: _blue.withOpacity(0.2),
                        borderRadius: BorderRadius.circular(3),
                      ),
                      child: Text(
                        '$_camCount CAMS',
                        style: const TextStyle(
                          color: _blue,
                          fontSize: 8,
                          fontWeight: FontWeight.w900,
                          letterSpacing: 1,
                        ),
                      ),
                    ),
                    const Spacer(),
                    Text(
                      _time,
                      style: const TextStyle(
                        color: Colors.white,
                        fontSize: 10,
                        fontWeight: FontWeight.w700,
                      ),
                    ),
                    const SizedBox(width: 10),
                    GestureDetector(
                      onTap: () => setState(() => _menuOpen = !_menuOpen),
                      child: const Icon(Icons.menu, color: Colors.white, size: 18),
                    ),
                  ],
                ),
              );
            }

            Widget _cameraStrip() {
              final items = <Widget>[];
              for (var i = 0; i < _camCount; i++) {
                items.add(Expanded(child: _camTile(i)));
              }
              items.add(SizedBox(width: 48, child: _addTile()));
              return Container(
                height: 64,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(children: items),
              );
            }

            Widget _camTile(int i) {
              final isLive = _live[i];
              final isPreview = _preview[i];
              final borderColor = isLive ? _red : (isPreview ? _yellow : _grey);
              final borderWidth = (isLive || isPreview) ? 2.0 : 1.0;
              final dotColor = isLive ? _red : (isPreview ? _yellow : Colors.grey);
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(
                  onTap: () => _selectPreview(i),
                  onDoubleTap: () => _setLive(i),
                  onLongPress: () => _removeCamera(i),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.black,
                      border: Border.all(color: borderColor, width: borderWidth),
                      borderRadius: BorderRadius.circular(3),
                    ),
                    child: Stack(
                      children: [
                        Positioned(
                          top: 3,
                          left: 3,
                          child: Container(
                            width: 5,
                            height: 5,
                            decoration: BoxDecoration(
                              color: dotColor,
                              shape: BoxShape.circle,
                            ),
                          ),
                        ),
                        if (isLive)
                          Positioned(
                            top: 3,
                            right: 3,
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                              decoration: BoxDecoration(
                                color: _red,
                                borderRadius: BorderRadius.circular(2),
                              ),
                              child: const Text(
                                'LIVE',
                                style: TextStyle(
                                  color: Colors.white,
                                  fontSize: 6,
                                  fontWeight: FontWeight.w900,
                                  letterSpacing: 1,
                                ),
                              ),
                            ),
                          ),
                        Positioned(
                          left: 4,
                          bottom: 3,
                          child: Text(
                            'CAM ${i + 1}',
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 7,
                              fontWeight: FontWeight.w900,
                              letterSpacing: 1,
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _addTile() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2),
                child: GestureDetector(
                  onTap: _addCamera,
                  child: Container(
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(3),
                      border: Border.all(color: Colors.tealAccent, width: 1),
                    ),
                    child: const Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.add, color: Colors.tealAccent, size: 18),
                        SizedBox(height: 2),
                        Text(
                          'Add',
                          style: TextStyle(color: Colors.tealAccent, fontSize: 7),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _tabRow() {
              return Container(
                height: 24,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    _tabButton('PROGRAM', 0),
                    const SizedBox(width: 20),
                    _tabButton('MULTIVIEW', 1),
                  ],
                ),
              );
            }

            Widget _tabButton(String label, int index) {
              final active = _tab == index;
              return GestureDetector(
                onTap: () => setState(() => _tab = index),
                child: Text(
                  label,
                  style: TextStyle(
                    color: active ? Colors.white : Colors.white54,
                    fontSize: 9,
                    fontWeight: active ? FontWeight.w900 : FontWeight.w600,
                    letterSpacing: 2,
                  ),
                ),
              );
            }

            Widget _program() {
              return Padding(
                padding: const EdgeInsets.fromLTRB(10, 2, 10, 2),
                child: Container(
                  decoration: BoxDecoration(
                    color: Colors.black,
                    border: Border.all(color: _yellow, width: 1.5),
                    borderRadius: BorderRadius.circular(4),
                  ),
                  child: LayoutBuilder(
                    builder: (context, cons) {
                      final w = cons.maxWidth;
                      final previewIdx = _preview.indexOf(true);
                      final previewNum = previewIdx >= 0 ? previewIdx + 1 : 1;
                      return Stack(
                        children: [
                          const Center(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.videocam_off, color: Colors.white24, size: 32),
                                SizedBox(height: 6),
                                Text(
                                  'WAITING FOR CAMERA',
                                  style: TextStyle(
                                    color: Colors.white38,
                                    fontSize: 10,
                                    letterSpacing: 2,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          Positioned(
                            top: 6,
                            left: 6,
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                              decoration: BoxDecoration(
                                color: _red,
                                borderRadius: BorderRadius.circular(2),
                              ),
                              child: const Text(
                                'PROGRAM',
                                style: TextStyle(
                                  color: Colors.white,
                                  fontSize: 8,
                                  fontWeight: FontWeight.w900,
                                  letterSpacing: 1.5,
                                ),
                              ),
                            ),
                          ),
                          if (_overlays.isNotEmpty)
                            Positioned.fill(child: OverlayRenderer(overlays: _overlays)),
                          Positioned(
                            right: 8,
                            bottom: 8,
                            width: w * 0.28,
                            height: w * 0.28 * 9 / 16,
                            child: Container(
                              decoration: BoxDecoration(
                                color: Colors.black,
                                border: Border.all(color: _yellow, width: 1.5),
                                borderRadius: BorderRadius.circular(3),
                              ),
                              child: Stack(
                                children: [
                                  Center(
                                    child: Text(
                                      'CAM $previewNum',
                                      style: const TextStyle(
                                        color: Colors.white24,
                                        fontSize: 11,
                                        fontWeight: FontWeight.w900,
                                        letterSpacing: 2,
                                      ),
                                    ),
                                  ),
                                  Positioned(
                                    top: 3,
                                    left: 3,
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                                      decoration: BoxDecoration(
                                        color: _yellow,
                                        borderRadius: BorderRadius.circular(2),
                                      ),
                                      child: const Text(
                                        'PREVIEW',
                                        style: TextStyle(
                                          color: Colors.black,
                                          fontSize: 6,
                                          fontWeight: FontWeight.w900,
                                          letterSpacing: 1,
                                        ),
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ],
                      );
                    },
                  ),
                ),
              );
            }

            Widget _grid() {
              int cols;
              if (_camCount <= 4) {
                cols = 2;
              } else if (_camCount <= 9) {
                cols = 3;
              } else if (_camCount <= 12) {
                cols = 4;
              } else {
                cols = 5;
              }
              return Padding(
                padding: const EdgeInsets.all(10),
                child: GridView.builder(
                  itemCount: _camCount,
                  gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                    crossAxisCount: cols,
                    mainAxisSpacing: 6,
                    crossAxisSpacing: 6,
                    childAspectRatio: 16 / 9,
                  ),
                  itemBuilder: (_, i) {
                    final isLive = _live[i];
                    final isPreview = _preview[i];
                    final borderColor = isLive ? _red : (isPreview ? _yellow : _grey);
                    return GestureDetector(
                      onTap: () => _selectPreview(i),
                      onLongPress: () => _removeCamera(i),
                      child: Container(
                        decoration: BoxDecoration(
                          color: Colors.black,
                          border: Border.all(color: borderColor, width: 1.5),
                          borderRadius: BorderRadius.circular(3),
                        ),
                        child: Center(
                          child: Text(
                            'CAM ${i + 1}',
                            style: const TextStyle(
                              color: Colors.white70,
                              fontSize: 10,
                              fontWeight: FontWeight.w800,
                              letterSpacing: 2,
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }

            Widget _actionBar() {
              return Container(
                height: 48,
                color: _bg,
                padding: const EdgeInsets.symmetric(horizontal: 10),
                child: Row(
                  children: [
                    GestureDetector(
                      onTap: () => setState(() => _onAir = !_onAir),
                      child: Container(
                        height: 36,
                        padding: const EdgeInsets.symmetric(horizontal: 14),
                        decoration: BoxDecoration(
                          color: _onAir ? _red : const Color(0xFF1E293B),
                          borderRadius: BorderRadius.circular(5),
                        ),
                        child: Row(
                          children: [
                            Icon(
                              _onAir ? Icons.stop_circle : Icons.podcasts,
                              color: Colors.white,
                              size: 16,
                            ),
                            const SizedBox(width: 6),
                            Text(
                              _onAir ? 'END STREAM' : 'GO LIVE',
                              style: const TextStyle(
                                color: Colors.white,
                                fontSize: 11,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 1.2,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const Spacer(),
                    GestureDetector(
                      onTap: _take,
                      child: Container(
                        height: 36,
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        decoration: BoxDecoration(
                          color: _red,
                          borderRadius: BorderRadius.circular(5),
                        ),
                        child: const Row(
                          children: [
                            Icon(Icons.fiber_manual_record, color: Colors.white, size: 10),
                            SizedBox(width: 6),
                            Text(
                              'TAKE',
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 12,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 2.5,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _menuPanel() {
              return Positioned(
                top: 0,
                right: 0,
                bottom: 0,
                child: Container(
                  width: 220,
                  color: _bg,
                  child: Column(
                    children: [
                      Container(
                        height: 40,
                        padding: const EdgeInsets.symmetric(horizontal: 12),
                        decoration: const BoxDecoration(
                          border: Border(bottom: BorderSide(color: _grey)),
                        ),
                        child: Row(
                          children: [
                            const Text(
                              'Menu',
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 12,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                            const Spacer(),
                            GestureDetector(
                              onTap: () => setState(() => _menuOpen = false),
                              child: const Icon(Icons.close, color: Colors.white, size: 16),
                            ),
                          ],
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.grid_view, color: Colors.white70, size: 16),
                        title: const Text(
                          'Camera Count',
                          style: TextStyle(color: Colors.white, fontSize: 11),
                        ),
                        onTap: () {
                          setState(() => _menuOpen = false);
                          _pickCount();
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.add, color: Colors.white70, size: 16),
                        title: const Text(
                          'Add Camera',
                          style: TextStyle(color: Colors.white, fontSize: 11),
                        ),
                        onTap: () {
                          setState(() => _menuOpen = false);
                          _addCamera();
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.layers, color: Colors.tealAccent, size: 16),
                        title: const Text(
                          'Graphics',
                          style: TextStyle(color: Colors.tealAccent, fontSize: 11),
                        ),
                        onTap: _openGraphics,
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          D

      - name: Create android
        run: |
          flutter create --platforms=android --org com.yourcompany --project-name mobile_tv_studio .
          rm -f pubspec.lock
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'E'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          E

          cat > android/settings.gradle << 'E'
          pluginManagement {
              def fp = { def p = new Properties(); file("local.properties").withInputStream { p.load(it) }; return p.getProperty("flutter.sdk") }()
              includeBuild("$fp/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          E

          cat > android/build.gradle << 'E'
          ext { kotlin_version = "2.1.0" }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android {
                          if (compileSdkVersion == null) compileSdkVersion 34
                          if (defaultConfig != null) {
                              if (defaultConfig.targetSdkVersion == null) defaultConfig.targetSdkVersion 34
                              if (defaultConfig.minSdkVersion == null) defaultConfig.minSdkVersion 24
                          }
                      }
                  }
              }
          }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          E

          cat >> android/gradle.properties << 'E'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          E

          cat > android/app/build.gradle << 'E'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          android {
              namespace "com.yourcompany.studio"
              compileSdk 34
              ndkVersion "26.1.10909125"
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId "com.yourcompany.studio"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source '../..' }
          E

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                    xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="true" />
              <application android:label="Mobile TV Studio"
                           android:name="${applicationName}"
                           android:icon="@mipmap/ic_launcher"
                           android:usesCleartextTraffic="true"
                           tools:replace="android:label">
                  <activity android:name=".MainActivity"
                            android:exported="true"
                            android:launchMode="singleTop"
                            android:theme="@style/LaunchTheme"
                            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                            android:hardwareAccelerated="true"
                            android:windowSoftInputMode="adjustResize"
                            android:screenOrientation="landscape">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme"
                                 android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          XML

          flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MobileTVStudio-android
          path: build/app/outputs/flutter-apk/app-release.apk
