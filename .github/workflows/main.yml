        run: |
          cat > lib/screens/director_screen.dart << 'D'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter_webrtc/flutter_webrtc.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'graphics_editor.dart';
          import 'placeholder_screen.dart';
          import 'recordings_screen.dart';
          import 'link_account_screen.dart';
          import '../models/overlay_item.dart';
          import '../data/overlay_store.dart';
          import '../widgets/overlay_renderer.dart';
          import '../services/webrtc_session.dart';
          import '../services/local_recorder.dart';
          import '../services/account_store.dart';
          import '../services/stream_engine.dart';
          import '../services/config.dart';

          const _bg = Color(0xFF0A0A0F);
          const _panel = Color(0xFF141418);
          const _border = Color(0x14FFFFFF);
          const _red = Color(0xFFEF4444);
          const _green = Color(0xFF22C55E);
          const _yellow = Color(0xFFF5C542);
          const _blue = Color(0xFF3B82F6);
          const _textMid = Color(0x99FFFFFF);

          class DirectorScreen extends StatefulWidget {
            const DirectorScreen({super.key});
            @override State<DirectorScreen> createState() => _DS();
          }
          class _Cam {
            final String name; bool live; bool preview;
            _Cam(this.name, {this.live = false, this.preview = false});
          }
          class _DS extends State<DirectorScreen> {
            bool _onAir = false; bool _menu = false;
            int _tabIndex = 0; int _sec = 0;
            int _camCount = 6;
            Timer? _ticker;
            List<_Cam> _cams = [];
            final _vols = <double>[];
            final _inputs = <String>[];
            final _mutes = <bool>[];
            WebRtcSession? _session;
            String _connStatus = 'OFFLINE';
            final _recorder = LocalRecorder();
            final _accounts = AccountStore();
            final _engine = StreamEngine();
            final _overlayStore = OverlayStore();
            List<OverlayItem> _overlays = [];

            @override void initState() {
              super.initState();
              _buildCams(6);
              _loadSavedCount();
              _ticker = Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() => _sec++); });
              _connect();
              _loadOverlays();
              _accounts.load();
              _engine.addListener(() { if (mounted) setState(() {}); });
            }

            void _buildCams(int count) {
              final wasLive = _cams.indexWhere((c) => c.live);
              final wasPrev = _cams.indexWhere((c) => c.preview);
              _cams = List.generate(count, (i) => _Cam('CAM ${i + 1}'));
              _vols.clear(); _inputs.clear(); _mutes.clear();
              for (var i = 0; i < count; i++) {
                _vols.add(0.7);
                _inputs.add(['MIC', 'USB', 'BT', 'WIRED'][i % 4]);
                _mutes.add(false);
              }
              if (wasLive >= 0 && wasLive < count) _cams[wasLive].live = true;
              else if (count > 0) _cams[0].live = true;
              if (wasPrev >= 0 && wasPrev < count) _cams[wasPrev].preview = true;
              else if (count > 1) _cams[1].preview = true;
            }

            Future<void> _loadSavedCount() async {
              final p = await SharedPreferences.getInstance();
              final saved = p.getInt('camera_count') ?? 6;
              if (saved != _camCount && mounted) {
                setState(() { _camCount = saved.clamp(1, 15); _buildCams(_camCount); });
              }
            }

            Future<void> _saveCount() async {
              final p = await SharedPreferences.getInstance();
              await p.setInt('camera_count', _camCount);
            }

            Future<void> _setCameraCount(int n) async {
              n = n.clamp(1, 15);
              if (n == _camCount) return;
              setState(() { _camCount = n; _buildCams(n); });
              await _saveCount();
            }

            Future<void> _showCameraCountPicker() async {
              final selected = await showModalBottomSheet<int>(context: context,
                backgroundColor: const Color(0xFF141418),
                isScrollControlled: true,
                builder: (ctx) => SafeArea(child: SizedBox(
                  height: MediaQuery.of(ctx).size.height * 0.75,
                  child: Column(children: [
                    const Padding(padding: EdgeInsets.all(16),
                      child: Text('NUMBER OF CAMERAS', style: TextStyle(
                        color: Colors.white70, fontSize: 12,
                        letterSpacing: 3, fontWeight: FontWeight.w800))),
                    const Divider(height: 1, color: Colors.white12),
                    Expanded(child: ListView.builder(itemCount: 15,
                      itemBuilder: (_, i) {
                        final n = i + 1;
                        return ListTile(
                          title: Text('$n camera${n == 1 ? "" : "s"}',
                            style: const TextStyle(color: Colors.white)),
                          trailing: n == _camCount ? const Icon(Icons.check,
                            color: Colors.tealAccent) : null,
                          onTap: () => Navigator.pop(ctx, n));
                      }))]))); 
              if (selected != null) await _setCameraCount(selected);
            }

            Future<void> _addCamera() async {
              if (_camCount >= 15) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(
                  content: Text('Maximum 15 cameras reached')));
                return;
              }
              await _setCameraCount(_camCount + 1);
            }

            Future<void> _removeCamera(int index) async {
              if (_camCount <= 1) return;
              final ok = await showDialog<bool>(context: context,
                builder: (ctx) => AlertDialog(backgroundColor: const Color(0xFF141418),
                  title: const Text('Remove this camera?'),
                  content: Text('Remove CAM ${index + 1}?'),
                  actions: [TextButton(onPressed: () => Navigator.pop(ctx, false),
                    child: const Text('CANCEL')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('REMOVE'))]));
              if (ok == true) await _setCameraCount(_camCount - 1);
            }

            Future<void> _loadOverlays() async {
              final items = await _overlayStore.loadAll();
              if (mounted) setState(() => _overlays = items);
            }
            @override void dispose() {
              _ticker?.cancel(); _session?.stop(); _engine.stop(); super.dispose();
            }
            Future<void> _connect() async {
              setState(() => _connStatus = 'CONNECTING…');
              final s = WebRtcSession(serverUrl: AppConfig.signalingUrl,
                roomId: AppConfig.roomId,
                clientId: 'dir_${DateTime.now().millisecondsSinceEpoch}',
                isCaller: false);
              final ok = await s.start();
              if (ok) { _session = s; setState(() => _connStatus = 'CONNECTED'); }
              else { setState(() => _connStatus = 'RELAY OFFLINE'); }
            }
            String get _time {
              final h = (_sec ~/ 3600).toString().padLeft(2, '0');
              final m = ((_sec ~/ 60) % 60).toString().padLeft(2, '0');
              final s = (_sec % 60).toString().padLeft(2, '0');
              return '$h:$m:$s';
            }
            String get _live => _cams.firstWhere((c) => c.live,
              orElse: () => _cams.isNotEmpty ? _cams[0] : _Cam('CAM 1')).name;
            String get _prev => _cams.firstWhere((c) => c.preview,
              orElse: () => _cams.length > 1 ? _cams[1] : _cams[0]).name;
            void _take() => setState(() {
              final l = _cams.indexWhere((c) => c.live);
              final p = _cams.indexWhere((c) => c.preview);
              if (l >= 0 && p >= 0) { _cams[l].live = false; _cams[l].preview = true;
                _cams[p].preview = false; _cams[p].live = true; }
            });
            void _open(Widget s) {
              setState(() => _menu = false);
              Navigator.of(context).push(MaterialPageRoute(builder: (_) => s))
                .then((_) { _loadOverlays(); _accounts.load(); });
            }
            Future<void> _startBroadcast() async {
              final path = await _recorder.prepare();
              _recorder.markStarted();
              final urls = _accounts.items.map((a) => a.fullUrl).toList();
              final ok = await _engine.start(rtmpUrls: urls, recordingPath: path);
              setState(() => _onAir = true);
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                content: Text(ok
                  ? 'Going live to ${urls.length} platform${urls.length == 1 ? "" : "s"}'
                  : 'Streaming locally (no platforms linked)'),
                duration: const Duration(seconds: 3)));
            }
            Future<void> _stopBroadcast() async {
              await _engine.stop();
              await _recorder.markStopped();
              setState(() => _onAir = false);
              final path = _recorder.currentPath;
              if (path == null) return;
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                content: Text('Saved: ${path.split("/").last}')));
            }
            Future<void> _toggleAir() async {
              if (_onAir) { await _stopBroadcast(); } else { await _startBroadcast(); }
            }
            @override
