          const _red = Color(0xFFEF4444);
          const _yellow = Color(0xFFF5C542);
          const _blue = Color(0xFF3B82F6);
          const _grey = Color(0x14FFFFFF);

          class DirectorScreen extends StatefulWidget {
            const DirectorScreen({super.key});
            @override
            State<DirectorScreen> createState() => _DirectorScreenState();
          }

          class _DirectorScreenState extends State<DirectorScreen> {
            bool _onAir = false;
            bool _menuOpen = false;
            bool _showLiveCamera = false;
            int _tab = 0;
            int _sec = 0;
            int _camCount = 6;
            Timer? _ticker;
            final List<bool> _live = List.generate(15, (i) => i == 0);
            final List<bool> _prev = List.generate(15, (i) => i == 1);
            final _overlayStore = OverlayStore();
            List<OverlayItem> _overlays = [];

            final _localRenderer = RTCVideoRenderer();
            final _remoteRenderer = RTCVideoRenderer();
            RTCPeerConnection? _pc;
            MediaStream? _localStream;
            MediaStream? _remoteStream;
            bool _webrtcReady = false;

            @override
            void initState() {
              super.initState();
              _ticker = Timer.periodic(const Duration(seconds: 1),
                (_) { if (mounted) setState(() => _sec++); });
              _loadOverlays();
              _initWebRTC();
            }

            Future<void> _initWebRTC() async {
              await _localRenderer.initialize();
              await _remoteRenderer.initialize();
              try {
                final constraints = {
                  'audio': true,
                  'video': {
                    'mandatory': {
                      'minWidth': '640', 'minHeight': '480',
                      'maxWidth': '1280', 'maxHeight': '720',
                    },
                    'facingMode': 'user',
                  },
                };
                _localStream = await navigator.mediaDevices
                    .getUserMedia(constraints);
                _localRenderer.srcObject = _localStream;
                if (mounted) setState(() => _webrtcReady = true);
              } catch (e) {
                debugPrint('WebRTC init error: $e');
              }
            }

            Future<void> _createPeerConnection() async {
              final config = {
                'iceServers': [
                  {'urls': 'stun:stun.l.google.com:19302'},
                  {'urls': 'stun:stun1.l.google.com:19302'},
                ],
              };
              _pc = await createPeerConnection(config);
              _pc!.onIceCandidate = (candidate) {
                debugPrint('ICE candidate: ${candidate.toMap()}');
              };
              _pc!.onTrack = (event) {
                if (event.streams.isNotEmpty) {
                  _remoteStream = event.streams[0];
                  _remoteRenderer.srcObject = _remoteStream;
                  if (mounted) setState(() {});
                }
              };
              if (_localStream != null) {
                for (final track in _localStream!.getTracks()) {
                  await _pc!.addTrack(track, _localStream!);
                }
              }
            }

            Future<void> _callPeer() async {
              await _createPeerConnection();
              final offer = await _pc!.createOffer();
              await _pc!.setLocalDescription(offer);
              debugPrint('Offer: ${offer.sdp}');
            }

            @override
            void dispose() {
              _ticker?.cancel();
              _localRenderer.dispose();
              _remoteRenderer.dispose();
              _pc?.close();
              _localStream?.dispose();
              super.dispose();
            }

            Future<void> _loadOverlays() async {
              final items = await _overlayStore.loadAll();
              if (mounted) setState(() => _overlays = items);
            }

            String get _time {
              final h = (_sec ~/ 3600).toString().padLeft(2, '0');
              final m = ((_sec ~/ 60) % 60).toString().padLeft(2, '0');
              final s = (_sec % 60).toString().padLeft(2, '0');
              return '$h:$m:$s';
            }
            void _take() {
              setState(() {
                final l = _live.indexOf(true);
                final p = _prev.indexOf(true);
                if (l < 0 || p < 0) return;
                _live[l] = false; _prev[l] = true;
                _prev[p] = false; _live[p] = true;
              });
            }
            void _selPrev(int i) {
              setState(() {
                for (var k = 0; k < _camCount; k++) _prev[k] = false;
                _prev[i] = true;
